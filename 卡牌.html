<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>像素卡牌对战</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; font-family: 'Courier New', Courier, monospace; }
        body { background-color: #1a1a1a; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; touch-action: none; }
        #game-container { display: flex; flex-direction: column; height: 100%; padding: 10px; gap: 10px; }
        .status-panel { background: #2a2a2a; border: 4px solid #000; box-shadow: 4px 4px 0 #000; padding: 10px; display: flex; flex-direction: column; gap: 8px; position: relative; }
        .status-panel h2 { font-size: 16px; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #555; padding-bottom: 4px; display: flex; justify-content: space-between; }
        .bar-container { height: 20px; background: #111; border: 2px solid #000; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; transition: width 0.3s ease; }
        .hp-fill { background: #ff4c4c; }
        .shield-fill { background: #4c9aff; position: absolute; top: 0; left: 0; opacity: 0.8; }
        .bar-text { position: absolute; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 0 #000; }
        .energy-box { display: flex; align-items: center; gap: 5px; font-size: 16px; font-weight: bold; color: #ffd700; }
        #log-area { flex: 1; background: #111; border: 4px solid #000; box-shadow: inset 4px 4px 0 #000; padding: 10px; overflow-y: auto; font-size: 13px; line-height: 1.5; color: #aaa; display: flex; flex-direction: column; gap: 5px; }
        .log-entry { border-bottom: 1px dashed #333; padding-bottom: 2px; }
        .log-entry.player { color: #4c9aff; }
        .log-entry.enemy { color: #ff4c4c; }
        .log-entry.system { color: #ffd700; font-weight: bold; }
        #hand-area { display: flex; overflow-x: auto; gap: 10px; padding: 10px 0; min-height: 160px; scrollbar-width: none; }
        #hand-area::-webkit-scrollbar { display: none; }
        .card { width: 100px; height: 140px; background: #fff; color: #111; border: 4px solid #000; box-shadow: 4px 4px 0 #000; display: flex; flex-direction: column; justify-content: space-between; padding: 8px; cursor: pointer; flex-shrink: 0; transition: transform 0.1s, box-shadow 0.1s; position: relative; }
        .card:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        .card.selected { transform: translateY(-15px); box-shadow: 4px 8px 0 #000; border-color: #ffd700; }
        @keyframes play-card-anim {
            0% { transform: scale(1) translateY(0); opacity: 1; }
            50% { transform: scale(1.2) translateY(-30px); opacity: 0.8; }
            100% { transform: scale(1.5) translateY(-100px); opacity: 0; }
        }
        .card.played { animation: play-card-anim 0.3s ease forwards; pointer-events: none; z-index: 999; }
        .card-cost { background: #ffd700; border: 2px solid #000; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 14px; border-radius: 50%; position: absolute; top: -10px; right: -10px; }
        .card-name { font-weight: bold; font-size: 12px; text-align: center; margin-top: 10px; word-break: break-all; }
        .card-type { font-size: 10px; text-align: center; color: #555; }
        .card-desc { font-size: 11px; text-align: center; line-height: 1.2; }
        #controls { display: flex; gap: 8px; padding-bottom: 10px; }
        .btn { flex: 1; height: 80px; background: #2a2a2a; color: #fff; border: 4px solid #000; box-shadow: 4px 4px 0 #000; font-size: 16px; font-weight: bold; display: flex; justify-content: center; align-items: center; cursor: pointer; text-transform: uppercase; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
        .btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #play-btn { background: #4c9aff; }
        #end-btn { background: #ff4c4c; }
        #draw-btn { background: #ffd700; color: #000; }
        
        /* 右上角音效开关 */
        #sound-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 2000;
            background: #2a2a2a;
            border: 3px solid #000;
            box-shadow: 2px 2px 0 #000;
            color: #fff;
            width: 45px;
            height: 45px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border-radius: 50%;
            -webkit-tap-highlight-color: transparent;
        }
        #sound-toggle:active { transform: translate(2px, 2px); box-shadow: 0 0 0 #000; }

        /* 右下角赞助作者按钮 */
        #sponsor-btn {
            position: fixed;
            bottom: 110px;
            right: 20px;
            z-index: 2000;
            background: #007bff;
            color: #fff;
            padding: 10px 18px;
            text-decoration: none;
            border: 3px solid #000;
            box-shadow: 4px 4px 0 #000;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: transform 0.1s, box-shadow 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        #sponsor-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }

        #game-over { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; flex-direction: column; justify-content: center; align-items: center; gap: 20px; }
        #game-over h1 { font-size: 36px; text-shadow: 4px 4px 0 #000; }
        #game-over p { font-size: 18px; color: #aaa; }
        #restart-btn { width: 200px; height: 80px; background: #ffd700; color: #000; }
    </style>
</head>
<body>

<button id="sound-toggle" title="静音/开启声音">🔊</button>

<div id="game-container">
    <div class="status-panel" id="enemy-panel">
        <h2>敌方 <span class="energy-box" id="enemy-energy">能量: 0 / 3</span></h2>
        <div class="bar-container">
            <div class="bar-fill hp-fill" id="enemy-hp-bar" style="width: 100%;"></div>
            <div class="bar-fill shield-fill" id="enemy-shield-bar" style="width: 0%;"></div>
            <div class="bar-text" id="enemy-hp-text">100 / 100</div>
        </div>
    </div>

    <div id="log-area"></div>

    <div class="status-panel" id="player-panel">
        <h2>玩家 <span class="energy-box" id="player-energy">能量: 0 / 3</span></h2>
        <div class="bar-container">
            <div class="bar-fill hp-fill" id="player-hp-bar" style="width: 100%;"></div>
            <div class="bar-fill shield-fill" id="player-shield-bar" style="width: 0%;"></div>
            <div class="bar-text" id="player-hp-text">100 / 100</div>
        </div>
    </div>

    <div id="hand-area"></div>

    <div id="controls">
        <button class="btn" id="play-btn" disabled>打出</button>
        <button class="btn" id="draw-btn">抽牌(1费)</button>
        <button class="btn" id="end-btn">结束</button>
    </div>
</div>

<a href="<a href="https://ty696.github.io/6669/pay.html" id="sponsor-btn">赞助作者</a>" target="_blank" id="sponsor-btn">赞助作者</a>

<div id="game-over">
    <h1 id="game-over-text">GAME OVER</h1>
    <p id="game-over-sub">...</p>
    <button class="btn" id="restart-btn">重新开始</button>
</div>

<script>
    /* =========================================
       音频引擎 (Web Audio API)
       ========================================= */
    let audioCtx = null;
    let isMuted = false;
    let bgmInterval = null;
    let bgmStep = 0;

    function initAudio() {
        if (audioCtx) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            startBGM();
        } catch (e) {
            console.log('浏览器不支持 Web Audio API');
        }
    }

    // 播放音效
    function playSFX(type) {
        if (!audioCtx || isMuted) return;
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        const now = audioCtx.currentTime;
        
        if (type === 'click') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(800, now);
            osc.frequency.exponentialRampToValueAtTime(600, now + 0.05);
            gain.gain.setValueAtTime(0.05, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            osc.start(now);
            osc.stop(now + 0.05);
        } else if (type === 'draw') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.linearRampToValueAtTime(1000, now + 0.08);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            osc.start(now);
            osc.stop(now + 0.08);
        } else if (type === 'attack') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        } else if (type === 'defend') {
            osc.type = 'square';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(400, now + 0.2);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        } else if (type === 'heal') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.linearRampToValueAtTime(800, now + 0.3);
            gain.gain.setValueAtTime(0.1, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);
        } else if (type === 'win') {
            // 胜利音阶
            [523, 659, 784, 1047].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'square';
                o.frequency.setValueAtTime(freq, now + i * 0.15);
                g.gain.setValueAtTime(0.1, now + i * 0.15);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.15 + 0.15);
                o.start(now + i * 0.15);
                o.stop(now + i * 0.15 + 0.15);
            });
        } else if (type === 'lose') {
            // 失败音阶
            [300, 250, 200, 150].forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'sawtooth';
                o.frequency.setValueAtTime(freq, now + i * 0.2);
                g.gain.setValueAtTime(0.1, now + i * 0.2);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.2 + 0.2);
                o.start(now + i * 0.2);
                o.stop(now + i * 0.2 + 0.2);
            });
        }
    }

    // 启动背景音乐 (8-bit循环)
    function startBGM() {
        if (bgmInterval) clearInterval(bgmInterval);
        if (!audioCtx) return;
        
        // 一段简单的赛博朋克底噪旋律
        const notes = [131, 131, 165, 196, 165, 131, 196, 165]; // C3, E3, G3 等
        bgmStep = 0;
        
        bgmInterval = setInterval(() => {
            if (isMuted || !audioCtx) return;
            const freq = notes[bgmStep % notes.length];
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            // 音量非常小，不盖过游戏音效
            gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
            
            bgmStep++;
        }, 400); // 每400ms播放一个音符
    }

    // 音效开关
    document.getElementById('sound-toggle').addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        initAudio(); // 确保初始化
        isMuted = !isMuted;
        document.getElementById('sound-toggle').textContent = isMuted ? '🔇' : '🔊';
    });

    // 第一次点击页面任何地方初始化音频
    document.body.addEventListener('touchstart', initAudio, { once: true, passive: false });
    document.body.addEventListener('click', initAudio, { once: true });

    /* =========================================
       数据层
       ========================================= */
    const CARD_TEMPLATES = [
        { name: '火球术', cost: 1, type: 'attack', value: 10, desc: '造成 10 点伤害' },
        { name: '铁壁', cost: 1, type: 'defend', value: 8, desc: '获得 8 点护盾' },
        { name: '治疗术', cost: 2, type: 'heal', value: 15, desc: '恢复 15 点生命' },
        { name: '重击', cost: 2, type: 'attack', value: 18, desc: '造成 18 点伤害' },
        { name: '魔法盾', cost: 2, type: 'defend', value: 12, desc: '获得 12 点护盾' },
        { name: '吸血', cost: 3, type: 'attack', value: 8, heal: 8, desc: '造成 8 点伤害，恢复 8 点生命' },
    ];

    const gameState = {
        player: { hp: 100, maxHp: 100, shield: 0, energy: 0, maxEnergy: 3, hand: [], deck: [], discard: [] },
        enemy: { hp: 100, maxHp: 100, shield: 0, energy: 0, maxEnergy: 3, hand: [], deck: [], discard: [] },
        turn: 'player',
        selectedCardIndex: -1,
        isGameOver: false,
        logs: [],
        isAnimating: false
    };

    /* =========================================
       工具函数
       ========================================= */
    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function addLog(message, type = 'system') {
        gameState.logs.push({ message, type });
        const logArea = document.getElementById('log-area');
        const entry = document.createElement('div');
        entry.className = `log-entry ${type}`;
        entry.textContent = message;
        logArea.appendChild(entry);
        logArea.scrollTop = logArea.scrollHeight;
    }

    /* =========================================
       核心逻辑
       ========================================= */
    function initGame() {
        let deck = [];
        CARD_TEMPLATES.forEach(template => {
            for (let i = 0; i < 4; i++) {
                deck.push({ ...template, id: Math.random().toString(36).substr(2, 9) });
            }
        });
        
        gameState.player = { hp: 100, maxHp: 100, shield: 0, energy: 0, maxEnergy: 3, hand: [], deck: shuffle(deck), discard: [] };
        gameState.enemy = { hp: 100, maxHp: 100, shield: 0, energy: 0, maxEnergy: 3, hand: [], deck: shuffle([...deck]), discard: [] };
        gameState.turn = 'player';
        gameState.selectedCardIndex = -1;
        gameState.isGameOver = false;
        gameState.isAnimating = false;
        gameState.logs = [];
        
        document.getElementById('log-area').innerHTML = '';
        document.getElementById('game-over').style.display = 'none';
        
        addLog('游戏开始！玩家先手。能量上限将随回合成长。', 'system');
        
        for (let i = 0; i < 5; i++) drawCard(gameState.player);
        for (let i = 0; i < 5; i++) drawCard(gameState.enemy);
        
        startPlayerTurn();
    }

    function drawCard(target) {
        if (target.hand && target.hand.length >= 5) return false;
        
        if (target.deck.length === 0) {
            if (target.discard.length === 0) return false;
            target.deck = shuffle([...target.discard]);
            target.discard = [];
            addLog(`${target === gameState.player ? '你的' : '敌方的'}牌库已空，洗入弃牌堆重新抽牌。`, 'system');
        }
        
        let card = target.deck.pop();
        if (target.hand) target.hand.push(card);
        if (target === gameState.player) playSFX('draw');
        return true;
    }

    function dealDamage(target, amount) {
        let actualDamage = amount;
        if (target.shield > 0) {
            if (target.shield >= amount) {
                target.shield -= amount;
                actualDamage = 0;
            } else {
                actualDamage = amount - target.shield;
                target.shield = 0;
            }
        }
        target.hp -= actualDamage;
        if (target.hp < 0) target.hp = 0;
        return actualDamage;
    }

    /* =========================================
       回合流转
       ========================================= */
    function startPlayerTurn() {
        if (gameState.isGameOver) return;
        gameState.turn = 'player';
        
        if (gameState.player.maxEnergy < 10) gameState.player.maxEnergy += 1;
        gameState.player.energy = gameState.player.maxEnergy;
        gameState.selectedCardIndex = -1;
        gameState.isAnimating = false;
        gameState.player.shield = 0;
        
        addLog(`--- 你的回合 (能量上限提升至 ${gameState.player.maxEnergy}) ---`, 'player');
        
        let drawn = 0;
        for (let i = 0; i < 2; i++) {
            if (drawCard(gameState.player)) drawn++;
        }
        if (drawn > 0) addLog(`你抽了 ${drawn} 张牌。`, 'player');
        
        renderAll();
    }

    function endPlayerTurn() {
        if (gameState.isGameOver || gameState.turn !== 'player' || gameState.isAnimating) return;
        playSFX('click');
        addLog('--- 你结束了回合 ---', 'player');
        gameState.turn = 'enemy';
        renderAll();
        setTimeout(enemyTurn, 800);
    }

    function enemyTurn() {
        if (gameState.isGameOver) return;
        gameState.turn = 'enemy';
        
        if (gameState.enemy.maxEnergy < 10) gameState.enemy.maxEnergy += 1;
        gameState.enemy.energy = gameState.enemy.maxEnergy;
        gameState.enemy.shield = 0;
        
        addLog(`--- 敌方回合 (能量上限提升至 ${gameState.enemy.maxEnergy}) ---`, 'enemy');
        
        let drawn = 0;
        for (let i = 0; i < 2; i++) {
            if (drawCard(gameState.enemy)) drawn++;
        }
        if (drawn > 0) addLog(`敌方抽了 ${drawn} 张牌。`, 'enemy');
        
        let enemyEnergy = gameState.enemy.energy;
        let actions = [];
        
        while (enemyEnergy > 0) {
            let playableCards = gameState.enemy.hand.filter(c => c.cost <= enemyEnergy);
            
            if (playableCards.length === 0) {
                if (enemyEnergy === 1) {
                    actions.push(`敌方消耗了最后的 1 点能量，但无合适卡牌打出。`);
                    enemyEnergy = 0;
                }
                break;
            }
            
            playableCards.sort((a, b) => b.cost - a.cost);
            let card = playableCards[0];
            
            let idx = gameState.enemy.hand.findIndex(c => c.id === card.id);
            if (idx === -1) break;
            gameState.enemy.hand.splice(idx, 1);
            gameState.enemy.discard.push(card);
            enemyEnergy -= card.cost;
            
            // AI打牌音效
            if (card.type === 'attack') playSFX('attack');
            else if (card.type === 'defend') playSFX('defend');
            else if (card.type === 'heal') playSFX('heal');
            
            if (card.type === 'attack') {
                let actual = dealDamage(gameState.player, card.value);
                actions.push(`敌方使用了【${card.name}】，造成 ${actual} 点伤害`);
                if (card.heal) {
                    gameState.enemy.hp = Math.min(gameState.enemy.maxHp, gameState.enemy.hp + card.heal);
                    actions.push(`敌方通过【${card.name}】恢复了 ${card.heal} 点生命`);
                }
            } else if (card.type === 'defend') {
                gameState.enemy.shield += card.value;
                actions.push(`敌方使用了【${card.name}】，获得 ${card.value} 点护盾`);
            } else if (card.type === 'heal') {
                gameState.enemy.hp = Math.min(gameState.enemy.maxHp, gameState.enemy.hp + card.value);
                actions.push(`敌方使用了【${card.name}】，恢复 ${card.value} 点生命`);
            }
        }
        
        if (actions.length === 0) actions.push('敌方没有行动。');
        actions.forEach(action => addLog(action, 'enemy'));
        
        renderAll();
        if (checkGameOver()) return;
        
        setTimeout(() => {
            if (!gameState.isGameOver) startPlayerTurn();
        }, 1000);
    }

    /* =========================================
       玩家操作
       ========================================= */
    function selectCard(index) {
        if (gameState.turn !== 'player' || gameState.isGameOver) return;
        const card = gameState.player.hand[index];
        if (!card) return;
        
        if (gameState.player.energy < card.cost) {
            addLog('能量不足！', 'system');
            return;
        }
        
        playSFX('click'); // 点击音效
        
        document.querySelectorAll('.card').forEach(el => el.classList.remove('selected'));
        const cardEl = document.querySelectorAll('.card')[index];
        if (cardEl) cardEl.classList.add('selected');
        
        gameState.selectedCardIndex = index;
        addLog(`已选中【${card.name}】，请点击“打出”按钮释放。`, 'system');
        updateButtons();
    }

    function playSelectedCard() {
        if (gameState.turn !== 'player' || gameState.isGameOver || gameState.isAnimating) return;
        const index = gameState.selectedCardIndex;
        if (index === -1) return;
        
        const card = gameState.player.hand[index];
        if (!card || gameState.player.energy < card.cost) return;
        
        gameState.isAnimating = true;
        
        // 音效播放
        if (card.type === 'attack') playSFX('attack');
        else if (card.type === 'defend') playSFX('defend');
        else if (card.type === 'heal') playSFX('heal');
        
        const cardEl = document.querySelectorAll('.card')[index];
        if (cardEl) {
            cardEl.classList.add('played');
        }
        
        setTimeout(() => {
            try {
                gameState.player.energy -= card.cost;
                gameState.player.hand.splice(index, 1);
                gameState.player.discard.push(card);
                gameState.selectedCardIndex = -1;
                
                let logMsg = `你使用了【${card.name}】`;
                if (card.type === 'attack') {
                    let actual = dealDamage(gameState.enemy, card.value);
                    logMsg += `，造成 ${actual} 点伤害`;
                    if (card.heal) {
                        gameState.player.hp = Math.min(gameState.player.maxHp, gameState.player.hp + card.heal);
                        logMsg += `，并恢复 ${card.heal} 点生命`;
                    }
                } else if (card.type === 'defend') {
                    gameState.player.shield += card.value;
                    logMsg += `，获得 ${card.value} 点护盾`;
                } else if (card.type === 'heal') {
                    gameState.player.hp = Math.min(gameState.player.maxHp, gameState.player.hp + card.value);
                    logMsg += `，恢复 ${card.value} 点生命`;
                }
                logMsg += '。';
                addLog(logMsg, 'player');
            } finally {
                gameState.isAnimating = false;
                renderAll();
                checkGameOver();
            }
        }, 300);
    }

    function drawPlayerCard() {
        if (gameState.turn !== 'player' || gameState.isGameOver || gameState.isAnimating) return;
        if (gameState.player.energy < 1) {
            addLog('能量不足，无法抽牌！', 'system');
            return;
        }
        if (gameState.player.hand.length >= 5) {
            addLog('手牌已满，无法抽牌！', 'system');
            return;
        }
        
        gameState.player.energy -= 1;
        if (drawCard(gameState.player)) {
            addLog('你消耗了 1 点能量抽了一张牌。', 'player');
        } else {
            addLog('牌库和弃牌堆都空了，无法抽牌。', 'system');
        }
        renderAll();
    }

    function checkGameOver() {
        if (gameState.isGameOver) return true;
        
        if (gameState.player.hp <= 0) {
            gameState.isGameOver = true;
            playSFX('lose');
            document.getElementById('game-over-text').textContent = '你输了！';
            document.getElementById('game-over-sub').textContent = '被敌方击败。';
            document.getElementById('game-over').style.display = 'flex';
            return true;
        }
        if (gameState.enemy.hp <= 0) {
            gameState.isGameOver = true;
            playSFX('win');
            document.getElementById('game-over-text').textContent = '你赢了！';
            document.getElementById('game-over-sub').textContent = '成功击败敌方！';
            document.getElementById('game-over').style.display = 'flex';
            return true;
        }
        return false;
    }

    /* =========================================
       渲染层
       ========================================= */
    function renderAll() {
        renderPlayerStatus();
        renderEnemyStatus();
        renderHand();
        updateButtons();
    }

    function renderPlayerStatus() {
        const p = gameState.player;
        document.getElementById('player-hp-bar').style.width = `${(p.hp / p.maxHp) * 100}%`;
        document.getElementById('player-shield-bar').style.width = `${Math.min(100, (p.shield / p.maxHp) * 100)}%`;
        document.getElementById('player-hp-text').textContent = `${p.hp} / ${p.maxHp} ${p.shield > 0 ? `(+${p.shield}盾)` : ''}`;
        document.getElementById('player-energy').textContent = `能量: ${p.energy} / ${p.maxEnergy}`;
    }

    function renderEnemyStatus() {
        const e = gameState.enemy;
        document.getElementById('enemy-hp-bar').style.width = `${(e.hp / e.maxHp) * 100}%`;
        document.getElementById('enemy-shield-bar').style.width = `${Math.min(100, (e.shield / e.maxHp) * 100)}%`;
        document.getElementById('enemy-hp-text').textContent = `${e.hp} / ${e.maxHp} ${e.shield > 0 ? `(+${e.shield}盾)` : ''}`;
        document.getElementById('enemy-energy').textContent = `能量: ${e.energy} / ${e.maxEnergy}`;
    }

    function renderHand() {
        const handArea = document.getElementById('hand-area');
        handArea.innerHTML = '';
        
        gameState.player.hand.forEach((card, index) => {
            const cardEl = document.createElement('div');
            cardEl.className = `card ${gameState.selectedCardIndex === index ? 'selected' : ''}`;
            
            if (card.cost > gameState.player.energy) {
                cardEl.style.opacity = '0.5';
                cardEl.style.filter = 'grayscale(100%)';
            }
            
            cardEl.innerHTML = `
                <div class="card-cost">${card.cost}</div>
                <div class="card-name">${card.name}</div>
                <div class="card-type">${card.type === 'attack' ? '攻击' : card.type === 'defend' ? '防御' : '回复'}</div>
                <div class="card-desc">${card.desc}</div>
            `;
            
            cardEl.addEventListener('click', () => selectCard(index));
            cardEl.addEventListener('touchstart', (e) => {
                e.preventDefault();
                selectCard(index);
            }, { passive: false });
            
            handArea.appendChild(cardEl);
        });
    }

    function updateButtons() {
        const playBtn = document.getElementById('play-btn');
        const endBtn = document.getElementById('end-btn');
        const drawBtn = document.getElementById('draw-btn');
        
        const isPlayerTurn = gameState.turn === 'player' && !gameState.isGameOver;
        const hasSelection = gameState.selectedCardIndex !== -1;
        const hasEnergyForDraw = gameState.player.energy >= 1;
        const handNotFull = gameState.player.hand.length < 5;
        
        playBtn.disabled = !isPlayerTurn || !hasSelection;
        endBtn.disabled = !isPlayerTurn;
        drawBtn.disabled = !isPlayerTurn || !hasEnergyForDraw || !handNotFull;
    }

    /* =========================================
       事件绑定
       ========================================= */
    const bindTap = (id, handler) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.addEventListener('click', (e) => { e.preventDefault(); handler(); });
        el.addEventListener('touchstart', (e) => { e.preventDefault(); handler(); }, { passive: false });
    };

    bindTap('play-btn', playSelectedCard);
    bindTap('draw-btn', drawPlayerCard);
    bindTap('end-btn', endPlayerTurn);
    bindTap('restart-btn', initGame);

    // 启动
    initGame();

</script>
</body>
</html>
