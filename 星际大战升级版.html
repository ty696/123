<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04060f">
<title>星际突袭 SKY STRIKE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: radial-gradient(circle at 50% 30%, #0a1030 0%, #05060f 60%, #020308 100%);
    font-family: 'Rajdhani', 'Segoe UI', 'Microsoft YaHei', sans-serif;
    user-select: none; -webkit-user-select: none;
    overscroll-behavior: none; touch-action: none;
    position: fixed;
  }
  #stage {
    position: absolute;
    background: #040612;
    box-shadow: 0 0 60px rgba(0, 200, 255, .18), 0 0 140px rgba(120, 0, 255, .12), inset 0 0 0 1px rgba(0, 220, 255, .25);
    overflow: hidden;
  }
  canvas#game { display: block; width: 100%; height: 100%; background: #040612; touch-action: none; cursor: crosshair; }

  .fx-overlay {
    position: absolute; inset: 0; pointer-events: none; z-index: 5;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,.025) 0 1px, transparent 1px 3px);
    mix-blend-mode: overlay;
  }
  .vignette {
    position: absolute; inset: 0; pointer-events: none; z-index: 6;
    box-shadow: inset 0 0 90px 24px rgba(0,0,0,.55);
  }

  .screen {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center; padding: 24px;
    background: radial-gradient(circle at 50% 35%, rgba(10,18,48,.72) 0%, rgba(3,5,15,.9) 75%);
    backdrop-filter: blur(3px);
    transition: opacity .25s ease;
    overflow-y: auto;
    padding-top: max(24px, env(safe-area-inset-top));
    padding-bottom: max(24px, env(safe-area-inset-bottom));
  }
  .screen.hidden { opacity: 0; pointer-events: none; }

  .title-block { position: relative; margin-bottom: 6px; }
  .game-title {
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(34px, 8vh, 60px);
    font-weight: 900; letter-spacing: 6px; line-height: 1;
    background: linear-gradient(180deg, #aef4ff 0%, #38c6ff 45%, #2b6bff 75%, #b06bff 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 14px rgba(56,198,255,.65)) drop-shadow(0 0 42px rgba(90,80,255,.35));
    animation: titlePulse 2.6s ease-in-out infinite;
  }
  .game-sub {
    margin-top: 8px;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(12px, 2.2vh, 16px); letter-spacing: 10px; text-indent: 10px;
    color: #7fd9ff; text-shadow: 0 0 10px rgba(80,200,255,.8);
  }
  .title-rule {
    width: min(78%, 340px); height: 2px; margin: 12px auto 0;
    background: linear-gradient(90deg, transparent, #39d6ff, #a66bff, #39d6ff, transparent);
    box-shadow: 0 0 12px rgba(57,214,255,.7);
  }
  @keyframes titlePulse {
    0%,100% { filter: drop-shadow(0 0 14px rgba(56,198,255,.65)) drop-shadow(0 0 42px rgba(90,80,255,.35)); }
    50%     { filter: drop-shadow(0 0 22px rgba(120,230,255,.9)) drop-shadow(0 0 60px rgba(140,90,255,.55)); }
  }

  .btn {
    position: relative;
    font-family: 'Orbitron', 'Microsoft YaHei', sans-serif;
    font-size: clamp(15px, 2.6vh, 18px); font-weight: 700; letter-spacing: 3px;
    color: #d8f6ff; cursor: pointer;
    padding: 14px 42px; min-width: 220px; min-height: 52px;
    background: linear-gradient(135deg, rgba(14,68,110,.55), rgba(8,28,64,.55));
    border: none; outline: none;
    clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px);
    box-shadow: inset 0 0 0 1.5px rgba(70,210,255,.75), 0 0 18px rgba(30,150,255,.25);
    transition: all .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn::before {
    content: ''; position: absolute; inset: 3px;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    box-shadow: inset 0 0 14px rgba(60,200,255,.18); pointer-events: none;
  }
  .btn:hover, .btn:active {
    color: #04101c;
    background: linear-gradient(135deg, #7fe9ff, #39b6ff 55%, #8a7bff);
    box-shadow: 0 0 26px rgba(80,200,255,.85), inset 0 0 0 1.5px rgba(255,255,255,.9);
    transform: translateY(-1px);
  }
  .btn.secondary {
    color: #9fc7e8; box-shadow: inset 0 0 0 1.5px rgba(110,150,200,.5), 0 0 10px rgba(30,90,160,.2);
    background: linear-gradient(135deg, rgba(20,34,60,.55), rgba(10,18,38,.55));
  }
  .btn.secondary:hover, .btn.secondary:active { color: #d8f6ff; background: linear-gradient(135deg, rgba(60,110,180,.6), rgba(30,50,110,.6)); box-shadow: 0 0 18px rgba(90,160,255,.5); }

  .panel {
    width: min(90%, 380px);
    padding: 14px 18px;
    background: linear-gradient(160deg, rgba(12,30,60,.62), rgba(6,12,30,.62));
    border: 1px solid rgba(70,180,255,.35);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    box-shadow: inset 0 0 24px rgba(30,120,255,.1), 0 0 20px rgba(0,80,180,.15);
  }
  .ctrl-row { display: flex; justify-content: space-between; gap: 10px; padding: 5px 4px; font-size: clamp(13px,2.2vh,15px); color: #b9d8ef; }
  .ctrl-row b { color: #6fe3ff; font-family: 'Orbitron', sans-serif; font-size: .92em; letter-spacing: 1px; white-space: nowrap; }
  .ctrl-sep { height: 1px; background: linear-gradient(90deg, transparent, rgba(90,190,255,.35), transparent); }

  .hiscore-line {
    font-family: 'Orbitron', sans-serif; letter-spacing: 3px;
    font-size: clamp(13px, 2.3vh, 16px); color: #ffd76b;
    text-shadow: 0 0 12px rgba(255,200,60,.55);
  }
  .hiscore-line span { color: #fff3c4; }

  .over-title {
    font-family: 'Orbitron', sans-serif; font-size: clamp(28px, 6.5vh, 48px); font-weight: 900;
    letter-spacing: 6px; color: #ff5c7a;
    text-shadow: 0 0 18px rgba(255,60,100,.8), 0 0 50px rgba(255,40,80,.4);
  }
  .stat-line { font-size: clamp(14px, 2.6vh, 18px); color: #bcd6ee; letter-spacing: 1px; }
  .stat-line b { color: #8fe9ff; font-family: 'Orbitron', sans-serif; margin-left: 10px; font-size: 1.1em; }
  .new-record {
    font-family: 'Orbitron', sans-serif; color: #ffe06b; letter-spacing: 4px; font-size: 14px;
    animation: blink 1s steps(2) infinite; text-shadow: 0 0 14px rgba(255,210,60,.8);
  }
  @keyframes blink { 50% { opacity: .25; } }

  .small-note { font-size: 12px; letter-spacing: 2px; color: #5f86a8; font-family: 'Orbitron', sans-serif; }

  .hangar-title {
    font-family: 'Orbitron', sans-serif; font-size: clamp(20px, 4vh, 30px); font-weight: 900;
    letter-spacing: 5px; color: #8fe9ff; text-shadow: 0 0 14px rgba(56,198,255,.6);
  }
  .hangar-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; width: 100%; max-width: 520px; }
  @media (min-width: 560px) { .hangar-grid { grid-template-columns: repeat(3, 1fr); } }
  .ship-card {
    cursor: pointer; padding: 8px 6px 10px;
    background: linear-gradient(165deg, rgba(14,32,64,.66), rgba(6,12,30,.72));
    border: 1.5px solid rgba(90,150,210,.35);
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    transition: all .16s ease; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative;
    -webkit-tap-highlight-color: transparent;
  }
  .ship-card:active { border-color: rgba(110,210,255,.8); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(40,140,255,.25); }
  .ship-card.selected {
    border-color: #5ce1ff;
    box-shadow: 0 0 22px rgba(70,200,255,.45), inset 0 0 22px rgba(70,200,255,.12);
    background: linear-gradient(165deg, rgba(20,70,120,.7), rgba(8,20,50,.78));
  }
  .ship-card canvas { width: 100%; max-width: 110px; height: auto; }
  .ship-name { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #d8f6ff; line-height: 1.2; }
  .ship-en { font-size: 9px; letter-spacing: 2px; color: #6fa8d8; font-family: 'Orbitron', sans-serif; }
  .ship-desc { font-size: 10px; color: #9fc0dc; line-height: 1.3; min-height: 28px; text-align: center; padding: 0 2px; }
  .stat-bars { width: 100%; display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
  .stat-row { display: flex; align-items: center; gap: 4px; font-size: 9px; color: #8fb6d8; }
  .stat-row span { width: 26px; flex: none; }
  .stat-track { flex: 1; height: 3px; background: rgba(90,140,200,.18); }
  .stat-fill { height: 100%; background: linear-gradient(90deg, #2b8fff, #5ce1ff); box-shadow: 0 0 6px rgba(80,200,255,.7); }
  .ship-medal {
    position: absolute; top: 5px; right: 5px; width: 24px; height: 24px;
    background: radial-gradient(circle at 35% 30%, #fff6c0, #ffd24a 40%, #c89020 100%);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: #6b4400; font-weight: 900; line-height: 1;
    box-shadow: 0 2px 8px rgba(255,200,60,.6), inset 0 1px 3px rgba(255,255,255,.5);
    border: 1.5px solid #ffc44a; z-index: 2; pointer-events: none;
  }
  .hangar-actions { display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; justify-content: center; }
  .hangar-actions .btn { min-width: 140px; padding: 12px 18px; font-size: 14px; }
  #hangarScreen { justify-content: flex-start; padding-top: max(20px, env(safe-area-inset-top)); }

  #backBtn {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: max(8px, env(safe-area-inset-left)); z-index: 30;
    width: 42px; height: 42px; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(8,20,44,.6); border: 1px solid rgba(90,200,255,.5);
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    color: #8fe0ff;
    -webkit-tap-highlight-color: transparent;
  }
  #backBtn:active { color: #04101c; background: linear-gradient(135deg,#7fe9ff,#39b6ff); border-color: #fff; box-shadow: 0 0 14px rgba(80,200,255,.8); }
  #backBtn.hidden { display: none; }

  #muteBtn {
    position: absolute; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 30;
    width: 42px; height: 42px; cursor: pointer;
    background: rgba(8,20,44,.6); border: 1px solid rgba(90,200,255,.5);
    clip-path: polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
    color: #8fe0ff; font-size: 18px; line-height: 40px; text-align: center;
    -webkit-tap-highlight-color: transparent;
  }
  #muteBtn.off { color: #ff6480; border-color: rgba(255,90,120,.5); }

  #touchBomb {
    position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); z-index: 15;
    width: 86px; height: 86px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
    font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 1px;
    color: #ffe9a8; background: radial-gradient(circle, rgba(255,180,40,.28), rgba(120,60,0,.18));
    border: 2px solid rgba(255,200,80,.75); box-shadow: 0 0 20px rgba(255,170,40,.4);
    pointer-events: auto;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #touchBomb small { font-size: 20px; font-weight: 900; display: block; }
  #touchBomb > div { text-align: center; line-height: 1.2; }

  /* 屏幕旋转提示 */
  #rotateHint {
    position: absolute; inset: 0; z-index: 9999;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(4,6,15,.95); color: #8fe0ff; text-align: center; padding: 24px;
    font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
  }
  #rotateHint .icon { font-size: 48px; margin-bottom: 12px; animation: rot 2s ease-in-out infinite; }
  @keyframes rot { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } }
  #rotateHint p { font-size: 14px; color: #b8d8f0; line-height: 1.6; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game" width="480" height="720"></canvas>
  <button id="backBtn" class="hidden" title="返回">
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.5 5 L7.5 12 L14.5 19" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div class="fx-overlay"></div>
  <div class="vignette"></div>
  <div id="touchBomb"><div>BOMB<small id="touchBombCount">×2</small></div></div>
  <button id="muteBtn" title="声音开关">♪</button>

  <!-- 主菜单 -->
  <div class="screen" id="menuScreen">
    <div class="title-block">
      <div class="game-title">SKY STRIKE</div>
      <div class="game-sub">星 际 突 袭</div>
      <div class="title-rule"></div>
    </div>
    <button class="btn" id="startBtn">开始任务</button>
    <button class="btn secondary" id="hangarBtn">出战选项</button>
    <div class="panel">
      <div class="ctrl-row"><span>移动</span><b>按住拖动 / WASD</b></div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-row"><span>射击</span><b>自动开火</b></div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-row"><span>清屏炸弹</span><b>右下按钮 / 空格</b></div>
      <div class="ctrl-sep"></div>
      <div class="ctrl-row"><span>暂停</span><b>P / ESC</b></div>
    </div>
    <div class="hiscore-line">HI-SCORE <span id="menuHi">0</span></div>
    <div class="small-note">P 火力 · S 护盾 · B 炸弹 · H 修复 · D 僚机</div>
  </div>

  <!-- 暂停 -->
  <div class="screen hidden" id="pauseScreen">
    <div class="game-title" style="font-size:clamp(28px,6vh,44px)">PAUSED</div>
    <div class="game-sub" style="font-size:13px">暂 停</div>
    <button class="btn" id="resumeBtn">继续战斗</button>
    <button class="btn secondary" id="restartBtn1">重新开始</button>
    <button class="btn secondary" id="menuBtn1">返回主菜单</button>
  </div>

  <!-- 结算 -->
  <div class="screen hidden" id="overScreen">
    <div class="over-title">MISSION FAILED</div>
    <div class="panel" style="padding:18px">
      <div class="stat-line">最终得分<b id="finalScore">0</b></div>
      <div class="ctrl-sep" style="margin:6px 0"></div>
      <div class="stat-line">最高连击<b id="finalCombo">0</b></div>
      <div class="ctrl-sep" style="margin:6px 0"></div>
      <div class="stat-line">存活时间<b id="finalTime">0:00</b></div>
      <div class="ctrl-sep" style="margin:6px 0"></div>
      <div class="stat-line">击毁敌机<b id="finalKills">0</b></div>
    </div>
    <div class="new-record" id="newRecord" style="display:none">★ NEW RECORD ★</div>
    <div class="hiscore-line">HI-SCORE <span id="overHi">0</span></div>
    <button class="btn" id="retryBtn">再次出击</button>
    <button class="btn secondary" id="menuBtn2">返回主菜单</button>
  </div>

  <!-- 机库 -->
  <div class="screen hidden" id="hangarScreen">
    <div class="hangar-title">HANGAR</div>
    <div class="game-sub" style="font-size:12px;letter-spacing:6px">出 战 选 项</div>
    <div class="hangar-grid" id="hangarGrid"></div>
    <div class="hangar-actions">
      <button class="btn" id="hangarStartBtn">确认出击</button>
      <button class="btn secondary" id="hangarBackBtn">返回</button>
    </div>
  </div>

  <div id="rotateHint">
    <div class="icon">📱</div>
    <p>请将手机旋转为竖屏<br>以获得最佳游戏体验</p>
  </div>
</div>

<script>
'use strict';
/* ============================================================
 * 星际突袭 SKY STRIKE —— 手机优化版
 * ============================================================ */
const W = 480, H = 720;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');

/* ============================================================
 * 【手机优化 1】动态尺寸：不用 100vh，避免地址栏吞高度
 * 监听 resize / orientationchange / visualViewport 变化
 * ============================================================ */
function fitStage() {
  const vw = window.innerWidth;
  const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
  const aspect = W / H; // 2:3
  let sw = vw, sh = vh;
  if (vw / vh > aspect) {
    // 屏幕太宽 → 按高度撑满
    sh = vh; sw = vh * aspect;
  } else {
    // 屏幕太高 → 按宽度撑满
    sw = vw; sh = vw / aspect;
  }
  stage.style.width = sw + 'px';
  stage.style.height = sh + 'px';
  stage.style.left = ((vw - sw) / 2) + 'px';
  stage.style.top = ((vh - sh) / 2) + 'px';
  // 旋转提示
  const rotHint = document.getElementById('rotateHint');
  if (window.orientation === 90 || window.orientation === -90 ||
      (screen.orientation && screen.orientation.angle !== 0 && screen.orientation.angle !== 180)) {
    rotHint.style.display = 'flex';
  } else {
    rotHint.style.display = 'none';
  }
}
window.addEventListener('resize', fitStage);
window.addEventListener('orientationchange', () => setTimeout(fitStage, 200));
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fitStage);
  window.visualViewport.addEventListener('scroll', fitStage);
}
fitStage();

/* 【手机优化 2】震动反馈：受击 / 爆炸 / 拾取道具 */
function vibrate(ms) {
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

/* 【手机优化 3】全屏：进入游戏时尝试全屏 */
function enterFullscreen() {
  const el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) {
    el.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  }
}

/* 【手机优化 4】阻止双击缩放、长按菜单、下拉刷新 */
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
let lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouchEnd < 300) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

const rand = (a, b) => a + Math.random() * (b - a);
const randInt = (a, b) => Math.floor(rand(a, b + 1));
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ---------------- 音频 ---------------- */
const AudioSys = {
  ctx: null, muted: localStorage.getItem('skystrike.muted') === '1',
  master: null, musicGain: null, sfxGain: null, noiseBuf: null,
  musicTimer: null, step: 0, nextNoteTime: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = this.muted ? 0 : 0.9;
    this.master.connect(this.ctx.destination);
    this.musicGain = this.ctx.createGain(); this.musicGain.gain.value = 0.32; this.musicGain.connect(this.master);
    this.sfxGain = this.ctx.createGain(); this.sfxGain.gain.value = 0.9; this.sfxGain.connect(this.master);
    const len = this.ctx.sampleRate * 0.6;
    this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  },
  tone(freq, dur, type, vol, slideTo, when) {
    if (!this.ctx) return;
    const t0 = when || this.ctx.currentTime;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || 'square'; o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t0 + dur);
    g.gain.setValueAtTime(vol || 0.15, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(this.sfxGain);
    o.start(t0); o.stop(t0 + dur + 0.02);
  },
  noise(dur, vol, freq, q) {
    if (!this.ctx) return;
    const t0 = this.ctx.currentTime;
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass';
    f.frequency.setValueAtTime(freq || 1200, t0);
    f.frequency.exponentialRampToValueAtTime(120, t0 + dur);
    f.Q.value = q || 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol || 0.3, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.sfxGain);
    src.start(t0); src.stop(t0 + dur + 0.02);
  },
  sfx: {
    shoot() { AudioSys.tone(rand(760, 840), 0.07, 'square', 0.045, 420); },
    laser() { AudioSys.tone(1400, 0.09, 'sawtooth', 0.04, 700); },
    hit()   { AudioSys.tone(rand(300, 380), 0.05, 'triangle', 0.06, 180); },
    explode(big) {
      AudioSys.noise(big ? 0.55 : 0.22, big ? 0.5 : 0.22, big ? 900 : 1500);
      AudioSys.tone(big ? 90 : 150, big ? 0.4 : 0.16, 'sawtooth', 0.12, 40);
      vibrate(big ? 40 : 12);
    },
    hurt()  { AudioSys.tone(220, 0.35, 'sawtooth', 0.22, 60); AudioSys.noise(0.3, 0.2, 700); vibrate(60); },
    power()  { [523, 659, 784, 1046].forEach((f, i) => AudioSys.tone(f, 0.12, 'triangle', 0.12, null, AudioSys.ctx.currentTime + i * 0.06)); vibrate(20); },
    bomb()   { AudioSys.noise(0.9, 0.55, 2600); AudioSys.tone(70, 0.8, 'sine', 0.35, 28); vibrate([30, 40, 30]); },
    alarm()  { AudioSys.tone(880, 0.18, 'square', 0.12); AudioSys.tone(660, 0.18, 'square', 0.12, null, AudioSys.ctx ? AudioSys.ctx.currentTime + 0.22 : 0); vibrate(50); },
    bossDie(){ for (let i = 0; i < 6; i++) setTimeout(() => { AudioSys.noise(0.4, 0.4, 900); AudioSys.tone(120 - i * 14, 0.4, 'sawtooth', 0.15, 40); vibrate(40); }, i * 140); }
  },
  startMusic() {
    if (!this.ctx || this.musicTimer) return;
    this.step = 0; this.nextNoteTime = this.ctx.currentTime + 0.08;
    const bassLine = [55, 55, 0, 55, 0, 65.4, 0, 49, 0, 55, 0, 73.4, 0, 65.4, 0, 49];
    const arpNotes = [220, 261.6, 329.6, 440, 329.6, 261.6, 196, 261.6, 220, 293.7, 349.2, 440, 392, 329.6, 261.6, 220];
    const spb = 60 / 132 / 2;
    const schedule = () => {
      if (!this.ctx) return;
      while (this.nextNoteTime < this.ctx.currentTime + 0.18) {
        const s = this.step % 16;
        const t = this.nextNoteTime;
        const b = bassLine[s];
        if (b) { this.toneAt(b, spb * 1.6, 'sawtooth', 0.10, t, this.musicGain, 500); }
        if (s % 2 === 0) { this.toneAt(arpNotes[s], spb * 0.9, 'square', 0.035, t, this.musicGain, 2400); }
        if (s % 4 === 0) { this.kick(t); }
        if (s % 4 === 2) { this.hat(t, 0.05); } else { this.hat(t, 0.02); }
        this.nextNoteTime += spb; this.step++;
      }
    };
    this.musicTimer = setInterval(schedule, 40);
  },
  toneAt(freq, dur, type, vol, when, dest, cutoff) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain(), f = this.ctx.createBiquadFilter();
    o.type = type; o.frequency.value = freq; f.type = 'lowpass'; f.frequency.value = cutoff || 3000;
    g.gain.setValueAtTime(vol, when);
    g.gain.exponentialRampToValueAtTime(0.0001, when + dur);
    o.connect(f); f.connect(g); g.connect(dest); o.start(when); o.stop(when + dur + 0.02);
  },
  kick(when) {
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(130, when); o.frequency.exponentialRampToValueAtTime(42, when + 0.12);
    g.gain.setValueAtTime(0.22, when); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.16);
    o.connect(g); g.connect(this.musicGain); o.start(when); o.stop(when + 0.18);
  },
  hat(when, vol) {
    const src = this.ctx.createBufferSource(); src.buffer = this.noiseBuf;
    const f = this.ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 6000;
    const g = this.ctx.createGain(); g.gain.setValueAtTime(vol, when); g.gain.exponentialRampToValueAtTime(0.0001, when + 0.04);
    src.connect(f); f.connect(g); g.connect(this.musicGain); src.start(when); src.stop(when + 0.05);
  },
  stopMusic() { if (this.musicTimer) { clearInterval(this.musicTimer); this.musicTimer = null; } },
  toggleMute() {
    this.muted = !this.muted;
    localStorage.setItem('skystrike.muted', this.muted ? '1' : '0');
    if (this.master) this.master.gain.value = this.muted ? 0 : 0.9;
    return this.muted;
  }
};

function initBackground() {
  stars = [];
  const isMobile = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
  const density = isMobile ? 0.7 : 1.0;
  for (let layer = 0; layer < 3; layer++) {
    const n = Math.floor([46, 32, 18][layer] * density);
    for (let i = 0; i < n; i++) {
      stars.push({ x: rand(0, W), y: rand(0, H), layer, size: [0.7, 1.3, 2.1][layer] + rand(0, 0.5), tw: rand(0, 6.28) });
    }
  }
  nebulae = [];
  const palette = [[70, 40, 160], [20, 110, 200], [150, 40, 140], [30, 160, 170]];
  for (let i = 0; i < (isMobile ? 3 : 4); i++) {
    const c = palette[i];
    const cv = document.createElement('canvas'); cv.width = cv.height = 320;
    const cctx = cv.getContext('2d');
    const g = cctx.createRadialGradient(160, 160, 10, 160, 160, 160);
    g.addColorStop(0, `rgba(${c[0]},${c[1]},${c[2]},0.20)`);
    g.addColorStop(0.5, `rgba(${c[0]},${c[1]},${c[2]},0.07)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    cctx.fillStyle = g; cctx.fillRect(0, 0, 320, 320);
    nebulae.push({ img: cv, x: rand(0, W), y: rand(-H, H), r: rand(190, 280), sp: rand(4, 10) });
  }
}
function updateBackground(dt) {
  const boost = state === STATE.PLAY ? 1 : 0.35;
  for (const s of stars) {
    s.y += (20 + s.layer * 42) * dt * boost; s.tw += dt * 3;
    if (s.y > H + 2) { s.y = -2; s.x = rand(0, W); }
  }
  for (const n of nebulae) {
    n.y += n.sp * dt * boost;
    if (n.y - n.r > H) { n.y = -n.r; n.x = rand(0, W); }
  }
}
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#070b22'); g.addColorStop(0.55, '#05071a'); g.addColorStop(1, '#03040f');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'screen';
  for (const n of nebulae) ctx.drawImage(n.img, n.x - n.r, n.y - n.r, n.r * 2, n.r * 2);
  ctx.globalCompositeOperation = 'source-over';
  for (const s of stars) {
    const a = [0.35, 0.6, 0.9][s.layer] * (0.7 + 0.3 * Math.sin(s.tw));
    ctx.fillStyle = `rgba(200,230,255,${a})`;
    ctx.fillRect(s.x, s.y, s.size, s.size + (s.layer === 2 ? 2 : 0));
  }
}

/* ================= 极光激光 ================= */
let auroraBeams = [], auroraRungs = [], auroraMaps = [], auroraSfxT = 0;
const AURORA_HELIX = {
  4: { R: 18, bx: 7,  k: 0.0150, w: 3.0, dps: 9,  om: 2.2 },
  5: { R: 22, bx: 8,  k: 0.0150, w: 3.4, dps: 11, om: 2.2 },
  6: { R: 24, bx: 8,  k: 0.0150, w: 3.6, dps: 12, om: 2.4 },
  7: { R: 27, bx: 9,  k: 0.0140, w: 4.0, dps: 14, om: 2.6 },
  8: { R: 30, bx: 10, k: 0.0135, w: 4.6, dps: 16, om: 2.8 }
};
const AURORA_CORE = { 4: [10.8, 16], 5: [12.0, 19], 6: [13.2, 22], 7: [14.8, 25], 8: [17.2, 30] };
const AURORA_CORE_COLOR = '#d60096';
const AURORA_STRAND_C1 = '#ff6ee4';
const AURORA_STRAND_C2 = '#ffb4f0';
const AURORA_FLARE = 130;

function buildAuroraBeams() {
  const p = player, lvl = p.power, t = game.time, ny = p.y - 16;
  auroraRungs = [];
  const straight = (slot, bx, w, dps, color, ang, core) => {
    ang = ang || 0;
    let path;
    if (!ang) {
      path = [{ x: p.x + bx, y: ny }, { x: p.x + bx, y: -40 }];
    } else {
      const dx = Math.sin(ang), dy = -Math.cos(ang);
      let L = (ny + 40) / Math.max(0.3, -dy);
      if (dx < -0.001) L = Math.min(L, (-20 - p.x - bx) / dx);
      else if (dx > 0.001) L = Math.min(L, (W + 20 - p.x - bx) / dx);
      path = [{ x: p.x + bx, y: ny }, { x: p.x + bx + dx * L, y: ny + dy * L }];
    }
    auroraBeams.push({ slot, path, w, dps, color, core: !!core });
  };

  if (lvl === 1) straight(0, 0, 2.2, 9, '#ff4fd8');
  else if (lvl === 2) {
    straight(1, -5, 2.2, 6, '#ff7ae0', -0.07);
    straight(2, 5, 2.2, 6, '#ff7ae0', 0.07);
  } else if (lvl === 3) straight(0, 0, 12, 22, AURORA_CORE_COLOR, 0, true);
  else {
    const cc = AURORA_CORE[lvl] || AURORA_CORE[8];
    straight(0, 0, cc[0], cc[1], AURORA_CORE_COLOR, 0, true);
    const c = AURORA_HELIX[lvl] || AURORA_HELIX[8];
    const L = ny + 40, step = 9, steps = Math.ceil(L / step);
    const mkStrand = (slot, phase, color) => {
      const path = [];
      for (let i = 0; i <= steps; i++) {
        const s = Math.min(i * step, L);
        const g = c.bx + (c.R - c.bx) * Math.min(1, s / AURORA_FLARE);
        path.push({ x: p.x + g * Math.cos(s * c.k - t * c.om + phase), y: ny - s });
      }
      auroraBeams.push({ slot, path, w: c.w, dps: c.dps, color });
    };
    mkStrand(1, 0, AURORA_STRAND_C1);
    mkStrand(2, Math.PI, AURORA_STRAND_C2);
    for (let s = 60; s < L - 10; s += 80) {
      const g = c.bx + (c.R - c.bx) * Math.min(1, s / AURORA_FLARE);
      const ox = g * Math.cos(s * c.k - t * c.om);
      auroraRungs.push({ x1: p.x + ox, x2: p.x - ox, y: ny - s });
    }
    if (lvl === 6) {
      straight(3, -9, 2.8, 8, '#ffc0f0', -0.13);
      straight(4, 9, 2.8, 8, '#ffc0f0', 0.13);
    } else if (lvl === 7) {
      straight(3, -9, 2.8, 8, '#ffc0f0', -0.12);
      straight(4, 9, 2.8, 8, '#ffc0f0', 0.12);
      straight(5, -12, 2.6, 7, '#e6a6ff', -0.25);
      straight(6, 12, 2.6, 7, '#e6a6ff', 0.25);
    } else if (lvl >= 8) {
      straight(3, -10, 3.2, 9, '#ffc0f0', -0.12);
      straight(4, 10, 3.2, 9, '#ffc0f0', 0.12);
      straight(5, -13, 2.8, 8, '#e6a6ff', -0.24);
      straight(6, 13, 2.8, 8, '#e6a6ff', 0.24);
    }
  }
  p.drones.forEach((d, i) => auroraBeams.push({
    slot: 8 + i, path: [{ x: d.x, y: d.y - 8 }, { x: d.x, y: -40 }], w: 2.2, dps: 8, color: '#ff8ee2'
  }));
}

function beamPathHit(bm, px, py) {
  const pt = bm.path;
  let best = Infinity, hx = pt[0].x, hy = pt[0].y;
  for (let i = 0; i < pt.length - 1; i++) {
    const a = pt[i], b = pt[i + 1];
    const dx = b.x - a.x, dy = b.y - a.y, L2 = dx * dx + dy * dy || 1;

function auroraDeal(slot, key, amount, hx, hy, isBoss) {
  if (!auroraMaps[slot]) auroraMaps[slot] = new Map();
  const m = auroraMaps[slot];
  const acc = (m.get(key) || 0) + amount;
  const n = Math.floor(acc);
  if (n <= 0) { m.set(key, acc); return; }
  m.set(key, acc - n);
  if (isBoss) {
    if (!boss || boss.dead) return;
    boss.hp -= n; boss.hitFlash = 1;
    if (Math.random() < 0.5) pushParticle(mkParticle(hx, hy, rand(0, 6.29), 90, 0.2, '#ff9cee', 2.2));
    if (boss.hp <= 0) killBoss();
  } else {
    const e = enemies.find(en => en.uid === key);
    if (!e || e.hp <= 0) { m.delete(key); return; }
    e.hp -= n; e.hitFlash = 1;
    if (Math.random() < 0.4) pushParticle(mkParticle(hx, hy, rand(0, 6.29), 90, 0.2, '#ffd0f2', 2));
    if (e.hp <= 0) killEnemy(e);
  }
}
function updateAurora(dt) {
  auroraBeams = [];
  buildAuroraBeams();
  for (const bm of auroraBeams) {
    for (const e of enemies) {
      if (e.delay > 0 || e.hp <= 0) continue;
      const h = beamPathHit(bm, e.x, e.y);
      const rr = e.r + bm.w;
      if (h.d2 < rr * rr) auroraDeal(bm.slot, e.uid, bm.dps * dt, h.hx, h.hy, false);
    }
    if (boss && !boss.entering && !boss.dead) {
      const h = beamPathHit(bm, boss.x, boss.y);
      const rr = boss.r + bm.w;
      if (h.d2 < rr * rr) auroraDeal(bm.slot, BOSS_HIT_ID, bm.dps * dt, h.hx, h.hy, true);
    }
  }
  auroraSfxT -= dt;
  if (auroraSfxT <= 0) {
    AudioSys.tone(420 + Math.sin(game.time * 2) * 90, 0.09, 'triangle', 0.012, 760);
    if (enemies.some(e => e.hitFlash > 0) || (boss && boss.hitFlash > 0)) AudioSys.sfx.hit();
    auroraSfxT = 0.12;
  }
}
function drawAuroraBeams() {

/* ---------------- 道具 ---------------- */
const POWER_DEF = {
  P: { color: '#46d6ff', label: 'P', name: '火力升级' },
  S: { color: '#5c9bff', label: 'S', name: '护盾' },
  B: { color: '#ffc24a', label: 'B', name: '炸弹' },
  H: { color: '#5cff94', label: 'H', name: '修复' },
  D: { color: '#c47bff', label: 'D', name: '僚机' }
};
function spawnPower(x, y, kind) { powerups.push({ x, y, vy: 70, kind, t: rand(0, 6.28) }); }
function killEnemy(e) {
  explode(e.x, e.y, e.type === 'tank');
  game.combo++; game.comboTimer = 2.2;
  game.maxCombo = Math.max(game.maxCombo, game.combo);
  const mult = 1 + Math.min(1.5, game.combo * 0.05);
  addScore(e.x, e.y, Math.round(e.score * mult));
  maybeDrop(e);
  game.shake = Math.max(game.shake, e.type === 'tank' ? 7 : 2.5);
  AudioSys.sfx.explode(e.type === 'tank');
  if (e.type === 'tank') game.flash = Math.max(game.flash, 0.15);
}
function killBoss() {
  if (!boss || boss.dead) return;
  boss.hp = 0; boss.dead = true; boss.dieT = 1.1;
  ebullets.length = 0;
  AudioSys.sfx.bossDie();
}
function maybeDrop(e) {
  let chance = 0.1;
  if (e.type === 'tank') chance = 0.85;
  else if (e.type === 'gunner') chance = 0.35;
  else if (e.type === 'hunter') chance = 0.14;
  if (Math.random() > chance) return;
  const r = Math.random();
  let kind;
  if (r < 0.42) kind = 'P';
  else if (r < 0.60) kind = 'S';
  else if (r < 0.76) kind = 'H';
  else if (r < 0.90) kind = 'B';
  else kind = 'D';
  spawnPower(e.x, e.y, kind);
}
function updatePowerups(dt) {
  for (const p of powerups) {
    p.t += dt; p.y += p.vy * dt; p.x += Math.sin(p.t * 2.4) * 26 * dt;
    const d2 = dist2(p.x, p.y, player.x, player.y);
    if (d2 < 100 * 100) {
      const d = Math.sqrt(d2) || 1;
      p.x += (player.x - p.x) / d * 240 * dt;
      p.y += (player.y - p.y) / d * 240 * dt;
    }
  }
  powerups = powerups.filter(p => p.y < H + 30 && !p.taken);
}
function drawPowerups() {
  for (const p of powerups) {
    const def = POWER_DEF[p.kind];
    ctx.save();
    ctx.translate(p.x, p.y);
    const s = 1 + Math.sin(p.t * 5) * 0.08;
    ctx.scale(s, s);
    ctx.shadowColor = def.color; ctx.shadowBlur = 14;
    ctx.fillStyle = 'rgba(8,18,42,.9)';
    ctx.strokeStyle = def.color; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -13); ctx.lineTo(12, -6); ctx.lineTo(12, 8); ctx.lineTo(0, 14); ctx.lineTo(-12, 8); ctx.lineTo(-12, -6);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.fillStyle = def.color;
    ctx.font = 'bold 13px Orbitron, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(def.label, 0, 1);
    ctx.restore();
  }
}
function collectPower(p) {
  p.taken = true;
  AudioSys.sfx.power();
  const fx = msg => floats.push({ x: player.x, y: player.y - 30, text: msg, t: 1.1, color: POWER_DEF[p.kind].color });
  switch (p.kind) {
    case 'P':
      if (player.power < player.maxPower) { player.power++; fx('火力 LV.' + player.power); }
      else { game.score += 500; fx('+500'); }
      break;
    case 'S': player.shield = 7; fx('护盾启动'); break;
    case 'B':
      if (player.bombs < 5) { player.bombs++; fx('炸弹 +1'); } else { game.score += 300; fx('+300'); }
      break;
    case 'H':
      if (player.hp < player.maxHp) { player.hp++; fx('生命修复'); } else { game.score += 300; fx('+300'); }
      break;
    case 'D':
      if (player.drones.length < 4) {
        const side = player.drones.length % 2 === 0 ? -1 : 1;
        player.drones.push({ side, x: player.x + side * 26, y: player.y + 6 });
        fx('僚机就位');
      } else { game.score += 300; fx('+300'); }
      break;
  }
}

/* ---------------- 粒子 ---------------- */
function mkParticle(x, y, ang, sp, life, color, size) {
  return { x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life, maxLife: life, color, size };
}
function explode(x, y, big) {
  const n = big ? 26 : 12;
  const colors = big ? ['#ffffff', '#ffd060', '#ff8a3a', '#ff4060'] : ['#ffe2a0', '#ff9c3a', '#ff5c7a'];
  for (let i = 0; i < n; i++) {
    const a = rand(0, 6.29), sp = rand(40, big ? 320 : 200);
    pushParticle(mkParticle(x, y, a, sp, rand(0.3, big ? 0.9 : 0.6), pick(colors), rand(1.5, big ? 4.5 : 3)));
  }
  pushParticle({ x, y, vx: 0, vy: 0, life: 0.35, maxLife: 0.35, color: big ? '#ffe2a0' : '#ffb060', size: big ? 50 : 22, ring: true });
}
function updateParticles(dt) {
  for (const p of particles) {
    p.life -= dt;
    if (p.ring) continue;
    p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= (1 - 2.4 * dt); p.vy *= (1 - 2.4 * dt);
  }
  particles = particles.filter(p => p.life > 0);
}
function drawParticles() {
  for (const p of particles) {
    const k = p.life / p.maxLife;
    if (p.ring) {
      ctx.strokeStyle = `rgba(255,220,150,${k * 0.8})`;
      ctx.lineWidth = 2.5 * k;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1.4 - k), 0, 6.29); ctx.stroke();
    } else {
      ctx.globalAlpha = k;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}
function addScore(x, y, val) {
  game.score += val; game.kills++;
  floats.push({ x, y, text: '' + val, t: 0.8, color: '#9be8ff' });
}
function drawFloats(dt) {
  ctx.textAlign = 'center'; ctx.font = 'bold 13px Orbitron, sans-serif';
  for (const f of floats) {
    f.t -= dt; f.y -= 34 * dt;
    ctx.globalAlpha = clamp(f.t * 2, 0, 1);
    ctx.fillStyle = f.color; ctx.shadowColor = f.color; ctx.shadowBlur = 6;
    ctx.fillText(f.text, f.x, f.y);
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

/* ---------------- 出怪 ---------------- */
function updateSpawner(dt) {
  if (boss) return;
  if (game.time >= game.nextBossAt) { spawnBoss(); return; }
  const D = diffStats();
  game.spawnTimer -= dt;
  if (game.spawnTimer > 0 || enemies.length > D.enemyCap) return;
  const t = stageTime();
  game.spawnTimer = D.spawnGap;
  const roll = Math.random();
  const waveChance = D.waveChance;
  if (roll < waveChance) {
    const w = pick(['line', 'vee', 'ring', 'columns']);
    if (w === 'line') {
      for (let i = 0; i < 5; i++) spawnEnemy('scout', 70 + i * 85, -30 - i * 0, { vx: pick([-30, 30]) });
    } else if (w === 'vee') {
      for (let i = -2; i <= 2; i++) spawnEnemy('zig', W / 2 + i * 52, -40 - Math.abs(i) * 42, { delay: Math.abs(i) * 0.18 });
    } else if (w === 'ring' && (t > 15 || D.s >= 1)) {
      for (let i = 0; i < 7; i++) {
        const a = (i / 7) * Math.PI * 2;
        spawnEnemy('scout', W / 2 + Math.cos(a) * 130, -60 + Math.sin(a) * 80, { delay: i * 0.07, vx: Math.cos(a) * 20 });
      }
    } else {
      for (let i = 0; i < 3; i++) {
        spawnEnemy('scout', 90 + i * 150, -40 - i * 46, { delay: i * 0.22 });
        spawnEnemy('scout', 90 + i * 150 + 75, -70 - i * 46, { delay: i * 0.22 + 0.1 });
      }
    }
  } else {
    const x = rand(40, W - 40);
    const s = D.s;
    const pool = ['scout', 'scout', 'zig'];
    if (t > 12 || s >= 1) pool.push('hunter');
    if (t > 18 || s >= 1) pool.push('diver');
    if (t > 25 || s >= 2) pool.push('tank');
    if (t > 32 || s >= 2) pool.push('gunner');
    if (s >= 1) pool.push('hunter');
    if (s >= 2) pool.push('gunner', 'hunter');
    if (s >= 3) pool.push('tank', 'gunner', 'diver');
    spawnEnemy(pick(pool), x, -30);
  }
}

/* ---------------- 炸弹 / 受击 ---------------- */
function detonateBomb() {
  if (player.bombs <= 0 || !player.alive) return;
  player.bombs--;
  game.flash = 0.85; game.shake = 14;
  AudioSys.sfx.bomb();
  for (const b of ebullets) pushParticle(mkParticle(b.x, b.y, rand(0, 6.29), 60, 0.4, '#9be8ff', 2.5));
  ebullets.length = 0;
  for (const e of enemies) {
    e.hp -= 10; e.hitFlash = 1;
    if (e.hp <= 0) { explode(e.x, e.y, e.type === 'tank'); addScore(e.x, e.y, e.score); maybeDrop(e); }
  }
  if (boss && !boss.dead) { boss.hp -= 30; boss.hitFlash = 1; }
  pushParticle({ x: player.x, y: player.y, vx: 0, vy: 0, life: 0.5, maxLife: 0.5, color: '#bfeeff', size: 40, ring: true });
  document.getElementById('touchBombCount').textContent = '×' + player.bombs;
}
function damagePlayer() {
  if (player.invuln > 0 || player.shield > 0 || !player.alive) return;
  player.hp--;
  player.invuln = 2.2;
  game.shake = 12; game.flash = 0.35;
  AudioSys.sfx.hurt();
  explode(player.x, player.y, false);
  player.power = Math.max(1, player.power - 2);
  if (player.drones.length && Math.random() < 0.7) player.drones.pop();
  for (const b of ebullets) {
    if (dist2(b.x, b.y, player.x, player.y) < 90 * 90) pushParticle(mkParticle(b.x, b.y, rand(0, 6.29), 80, 0.3, '#ff9c3a', 2));
  }
  ebullets = ebullets.filter(b => dist2(b.x, b.y, player.x, player.y) >= 90 * 90);
  if (player.hp <= 0) gameOver();
}

/* ---------------- 主循环 ---------------- */
function startGame() {
  player = createPlayer();
  bullets = []; ebullets = []; enemies = []; particles = []; powerups = []; floats = [];
  boss = null;
  game.time = 0; game.score = 0; game.kills = 0; game.maxCombo = 0;
  game.combo = 0; game.comboTimer = 0;
  game.shake = 0; game.flash = 0;
  game.spawnTimer = 2.0; game.bossWarn = 0; game.bossCycle = 0; game.nextBossAt = 55;
  game.stageStart = 0; game.banner = null; game.clearFx = 0;
  auroraBeams = []; auroraRungs = []; auroraMaps = []; auroraSfxT = 0;
  pointer.active = false;
  state = STATE.PLAY;
  backBtn.classList.remove('hidden');
  game.banner = {
    title: SHIPS[selectedShip].en, sub: SHIPS[selectedShip].name + ' · 出击',
    t: 1.8, max: 1.8, color: SHIPS[selectedShip].accent
  };
  document.getElementById('touchBombCount').textContent = '×' + player.bombs;
  AudioSys.init(); AudioSys.startMusic();
  enterFullscreen();
}
function gameOver() {
  if (!player.alive) return;
  player.alive = false; player.deathT = 1.0;
  AudioSys.stopMusic();
  AudioSys.sfx.explode(true);
  explode(player.x, player.y, true);
  game.shake = 18; game.flash = 0.7;
  const hi = +(localStorage.getItem('skystrike.hi') || 0);
  if (game.score > hi) localStorage.setItem('skystrike.hi', game.score);
}
function showOverScreen() {
  if (state === STATE.OVER) return;
  state = STATE.OVER;
  const hi = +(localStorage.getItem('skystrike.hi') || 0);
  const isRecord = game.score >= hi && game.score > 0;
  document.getElementById('finalScore').textContent = game.score.toLocaleString();
  document.getElementById('finalCombo').textContent = game.maxCombo + 'x';
  document.getElementById('finalTime').textContent = fmtTime(game.time);
  document.getElementById('finalKills').textContent = game.kills;
  document.getElementById('overHi').textContent = Math.max(hi, game.score).toLocaleString();
  document.getElementById('newRecord').style.display = isRecord ? 'block' : 'none';
  showScreen('over');
}
function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + String(s).padStart(2, '0');
}

function update(dt) {
  game.time += dt;
  if (!player.alive) {
    player.deathT -= dt;
    updateSpawner(dt);
    updateEnemies(dt);
    updateBoss(dt);
    for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
    ebullets = ebullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);
    updatePowerups(dt);
    updateParticles(dt);
    updateBackground(dt);
    game.shake = Math.max(0, game.shake - dt * 26);
    game.flash = Math.max(0, game.flash - dt * 1.8);
    if (player.deathT <= 0) showOverScreen();
    return;
  }
  if (game.bossWarn > 0) game.bossWarn -= dt;
  game.shake = Math.max(0, game.shake - dt * 26);
  game.flash = Math.max(0, game.flash - dt * 1.8);

  if (player.alive) {
    if (pointer.active) {
      const tx = clamp(pointer.x + pointer.ox, 14, W - 14);
      const ty = clamp(pointer.y + pointer.oy, 70, H - 40);
      const dx = tx - player.x, dy = ty - player.y;
      const d = Math.hypot(dx, dy);
      const step = player.speed * dt;
      if (d <= step) { player.x = tx; player.y = ty; }
      else { player.x += dx / d * step; player.y += dy / d * step; }
      player.x = clamp(player.x, 14, W - 14);
      player.y = clamp(player.y, 70, H - 40);
    } else {
      let mx = 0, my = 0;
      if (keys.up) my -= 1; if (keys.down) my += 1; if (keys.left) mx -= 1; if (keys.right) mx += 1;
      if (mx || my) {
        const k = mx && my ? 0.707 : 1;
        player.x += mx * player.speed * k * dt;
        player.y += my * player.speed * k * dt;
      }
      player.x = clamp(player.x, 14, W - 14);
      player.y = clamp(player.y, 70, H - 40);
    }
    player.invuln = Math.max(0, player.invuln - dt);
    player.shield = Math.max(0, player.shield - dt);
    player.drones.forEach((d, i) => {
      const off = 22 + Math.floor(i / 2) * 20;
      const tx = player.x + d.side * off, ty = player.y + 8 + Math.sin(game.time * 4 + i) * 3;
      d.x += (tx - d.x) * Math.min(1, dt * 10);
      d.y += (ty - d.y) * Math.min(1, dt * 10);
    });
    if (Math.random() < 0.7) pushParticle(mkParticle(player.x + rand(-3, 3), player.y + 14, Math.PI / 2 + rand(-0.3, 0.3), rand(30, 90), 0.25, pick(TAIL_COLORS[player.ship]), 2));
    if (player.ship === 3) {
      updateAurora(dt);
    } else {
      auroraBeams = []; auroraRungs = [];
      player.fireT -= dt;
      if (player.fireT <= 0) { fireWeapon(); player.fireT = SHIPS[player.ship].fireGap; }
    }
  }

  updateSpawner(dt);
  updateEnemies(dt);
  updateBoss(dt);

  for (const b of bullets) {
    b.life -= dt;
    if (b.homing) {
      let best = null, bd = 300 * 300;
      for (const e of enemies) { const d = dist2(b.x, b.y, e.x, e.y); if (d < bd) { bd = d; best = e; } }
      if (boss && dist2(b.x, b.y, boss.x, boss.y) < bd) best = boss;
      if (best) {
        const a = Math.atan2(best.y - b.y, best.x - b.x);
        const ca = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy);
        let na = ca + clamp(((a - ca + Math.PI * 3) % (Math.PI * 2)) - Math.PI, -Math.PI, Math.PI) * Math.min(1, dt * 6);
        b.vx = Math.cos(na) * 340; b.vy = Math.sin(na) * 340;
      }
      b.trail -= dt;
      if (b.trail <= 0) { pushParticle(mkParticle(b.x, b.y, rand(0, 6.29), 20, 0.3, '#ffb04a', 2)); b.trail = 0.02; }
    }
    b.x += b.vx * dt; b.y += b.vy * dt;
  }
  bullets = bullets.filter(b => b.life > 0 && b.y > -40 && b.y < H + 40 && b.x > -40 && b.x < W + 40);

  for (const b of ebullets) { b.x += b.vx * dt; b.y += b.vy * dt; }
  ebullets = ebullets.filter(b => b.y > -20 && b.y < H + 20 && b.x > -20 && b.x < W + 20);

  updatePowerups(dt);

  for (const b of bullets) {
    for (const e of enemies) {
      if (e.delay > 0) continue;
      if (b.hitIds && b.hitIds.has(e.uid)) continue;
      const rr = (b.r + e.r) * ((b.kind === 'laser' || b.kind === 'beam') ? 1.25 : 1);
      if (dist2(b.x, b.y, e.x, e.y) < rr * rr) {
        if (b.hitIds) b.hitIds.add(e.uid);
        e.hp -= b.dmg; e.hitFlash = 1;
        for (let i = 0; i < 3; i++) pushParticle(mkParticle(b.x, b.y, rand(0, 6.29), 110, 0.22, '#9be8ff', 2));
        AudioSys.sfx.hit();
        if (b.pierce <= 0) { b.life = 0; } else b.pierce--;
        if (e.hp <= 0) killEnemy(e);
        if (b.life <= 0) break;
      }
    }
    if (b.life > 0 && boss && !boss.entering && !boss.dead && !(b.hitIds && b.hitIds.has(BOSS_HIT_ID))) {
      const rr = b.r + boss.r;
      if (dist2(b.x, b.y, boss.x, boss.y) < rr * rr) {
        if (b.hitIds) b.hitIds.add(BOSS_HIT_ID);
        boss.hp -= b.dmg; boss.hitFlash = 1;
        for (let i = 0; i < 3; i++) pushParticle(mkParticle(b.x, b.y, rand(0, 6.29), 110, 0.22, '#ffd060', 2));
        AudioSys.sfx.hit();
        if (b.pierce <= 0) b.life = 0; else b.pierce--;
        if (boss.hp <= 0) killBoss();
      }
    }
  }

  if (player.alive && player.invuln <= 0 && player.shield <= 0) {
    for (const b of ebullets) {
      if (dist2(b.x, b.y, player.x, player.y) < (b.r + player.r - 3) ** 2) { damagePlayer(); break; }
    }
  }
  if (player.alive && player.invuln <= 0 && player.shield <= 0) {
    for (const e of enemies) {
      if (e.delay > 0) continue;
      if (dist2(e.x, e.y, player.x, player.y) < (e.r + player.r - 4) ** 2) {
        e.hp = 0; explode(e.x, e.y, e.type === 'tank');
        damagePlayer(); break;
      }
    }
    if (boss && !boss.entering && !boss.dead && dist2(boss.x, boss.y, player.x, player.y) < (boss.r + player.r - 10) ** 2) damagePlayer();
  }
  if (player.shield > 0) {
    const before = ebullets.length;
    ebullets = ebullets.filter(b => dist2(b.x, b.y, player.x, player.y) >= (b.r + 22) ** 2);
    if (ebullets.length !== before) AudioSys.tone(900, 0.06, 'triangle', 0.07, 1200);
  }
  for (const p of powerups) {
    if (!p.taken && dist2(p.x, p.y, player.x, player.y) < 22 * 22) collectPower(p);
  }

  if (game.comboTimer > 0) { game.comboTimer -= dt; if (game.comboTimer <= 0) game.combo = 0; }
  if (game.clearFx > 0) game.clearFx -= dt;
  if (game.banner) { game.banner.t -= dt; if (game.banner.t <= 0) game.banner = null; }

  updateParticles(dt);
  updateBackground(dt);
}

/* ---------------- HUD ---------------- */
function drawHUD() {
  ctx.fillStyle = 'rgba(6,12,30,.55)';
  ctx.fillRect(0, 0, W, 44);
  ctx.strokeStyle = 'rgba(70,200,255,.35)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0, 44); ctx.lineTo(W, 44); ctx.stroke();

  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.font = "10px Orbitron, sans-serif";
  ctx.fillStyle = '#6fb6e0';
  ctx.fillText('SCORE', 48, 11);
  ctx.font = "bold 17px Orbitron, sans-serif";
  ctx.fillStyle = '#d8f6ff'; ctx.shadowColor = '#39d6ff'; ctx.shadowBlur = 6;
  ctx.fillText(game.score.toLocaleString(), 48, 28);
  ctx.shadowBlur = 0;

  ctx.textAlign = 'center';
  ctx.font = "10px Orbitron, sans-serif"; ctx.fillStyle = '#6fb6e0';
  ctx.fillText('TIME · STG ' + (game.bossCycle + 1), W / 2, 11);
  ctx.font = "bold 16px Orbitron, sans-serif"; ctx.fillStyle = '#bfe9ff';
  ctx.fillText(fmtTime(game.time), W / 2, 29);

  ctx.textAlign = 'right';
  ctx.font = "10px Orbitron, sans-serif"; ctx.fillStyle = '#8fa8d8';
  ctx.fillText('HI ' + (+(localStorage.getItem('skystrike.hi') || 0)).toLocaleString(), W - 14, 11);
  if (game.combo >= 3) {
    const pulse = 1 + Math.sin(game.time * 10) * 0.06;
    ctx.save(); ctx.translate(W - 14, 30); ctx.scale(pulse, pulse);
    ctx.font = "bold 15px Orbitron, sans-serif"; ctx.textAlign = 'right';
    ctx.fillStyle = '#ffd060'; ctx.shadowColor = '#ffb030'; ctx.shadowBlur = 10;
    ctx.fillText(game.combo + ' COMBO', 0, 0);
    ctx.restore(); ctx.shadowBlur = 0;
  }

  for (let i = 0; i < player.maxHp; i++) {
    const x = 16 + i * 22, y = H - 26;
    ctx.save(); ctx.translate(x, y);
    if (i < player.hp) {
      ctx.shadowColor = '#ff5c7a'; ctx.shadowBlur = 8;
      ctx.fillStyle = '#ff5c7a';
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.bezierCurveTo(-11, -1, -7, -9, 0, -4); ctx.bezierCurveTo(7, -9, 11, -1, 0, 8);
      ctx.fill();
    } else {
      ctx.strokeStyle = 'rgba(255,92,122,.4)'; ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(0, 8); ctx.bezierCurveTo(-11, -1, -7, -9, 0, -4); ctx.bezierCurveTo(7, -9, 11, -1, 0, 8);
      ctx.stroke();
    }
    ctx.restore();
  }
  for (let i = 0; i < player.bombs; i++) {
    const x = 16 + i * 18, y = H - 50;
    ctx.fillStyle = '#ffc24a'; ctx.shadowColor = '#ffb030'; ctx.shadowBlur = 7;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 6.29); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#5a3a00'; ctx.font = 'bold 8px Orbitron'; ctx.textAlign = 'center';
    ctx.fillText('B', x, y + 0.5);
  }
  if (player.shield > 0) {
    ctx.fillStyle = '#5c9bff'; ctx.font = "bold 11px Orbitron, sans-serif"; ctx.textAlign = 'left';
    ctx.shadowColor = '#5c9bff'; ctx.shadowBlur = 8;
    ctx.fillText('SHIELD ' + player.shield.toFixed(1), 92, H - 23);
    ctx.shadowBlur = 0;
  }

  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = "10px Orbitron, sans-serif"; ctx.fillStyle = '#6fb6e0';
  ctx.fillText('POWER', W - 16, H - 46);
  for (let i = 0; i < player.maxPower; i++) {
    const x = W - 16 - (player.maxPower - 1 - i) * 13, y = H - 26;
    if (i < player.power) {
      ctx.fillStyle = i >= 5 ? '#c47bff' : '#46d6ff';
      ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = 7;
    } else { ctx.fillStyle = 'rgba(100,150,200,.22)'; ctx.shadowBlur = 0; }
    ctx.fillRect(x - 3, y - 5, 7, 12);
  }
  ctx.shadowBlur = 0;
  for (let i = 0; i < player.drones.length; i++) {
    ctx.fillStyle = '#c47bff'; ctx.shadowColor = '#c47bff'; ctx.shadowBlur = 8;
    ctx.beginPath();
    const dx = W - 40 - i * 18, dy = H - 64;
    ctx.moveTo(dx, dy - 6); ctx.lineTo(dx + 6, dy + 5); ctx.lineTo(dx - 6, dy + 5); ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
  }

  if (boss) {
    const bw = W - 120, bx = 60, by = 58;
    const c = boss.def.color;
    ctx.fillStyle = 'rgba(12,6,20,.7)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 12);
    const ratio = clamp(boss.hp / boss.maxHp, 0, 1);
    const bg = ctx.createLinearGradient(bx, 0, bx + bw, 0);
    bg.addColorStop(0, c); bg.addColorStop(1, '#ffd060');
    ctx.fillStyle = bg;
    ctx.shadowColor = c; ctx.shadowBlur = 10;
    ctx.fillRect(bx, by, bw * ratio, 8);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = c; ctx.globalAlpha = 0.8; ctx.strokeRect(bx - 2, by - 2, bw + 4, 12); ctx.globalAlpha = 1;
    ctx.font = "bold 10px Orbitron, sans-serif"; ctx.textAlign = 'center';
    ctx.fillStyle = c; ctx.shadowColor = c; ctx.shadowBlur = 6;
    ctx.fillText(boss.dispName + ' · ' + boss.def.en, W / 2, by - 10);
    ctx.shadowBlur = 0;
  }

  if (game.bossWarn > 0) {
    const a = Math.floor(game.time * 8) % 2 ? 1 : 0.35;
    ctx.fillStyle = `rgba(255,30,60,${a * 0.12})`; ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center'; ctx.font = "bold 30px Orbitron, sans-serif";
    ctx.fillStyle = `rgba(255,70,100,${a})`; ctx.shadowColor = '#ff2040'; ctx.shadowBlur = 22;
    ctx.fillText('!! WARNING !!', W / 2, H / 2 - 28);
    ctx.font = "bold 17px Orbitron, sans-serif";
    ctx.fillStyle = `rgba(255,220,230,${a})`;
    const warnBoss = BOSS_DEFS[game.bossCycle % BOSS_DEFS.length];
    ctx.fillText(warnBoss.name + ' · ' + warnBoss.en, W / 2, H / 2 + 4);
    ctx.font = "bold 12px Orbitron, sans-serif";
    ctx.fillStyle = `rgba(255,70,100,${a})`;
    ctx.fillText('BOSS APPROACHING', W / 2, H / 2 + 28);
    ctx.shadowBlur = 0;
  }

  if (game.banner && game.banner.t > 0) {
    const bn = game.banner, k = bn.t / bn.max;
    const a = k > 0.7 ? (1 - k) / 0.3 : (k < 0.25 ? k / 0.25 : 1);
    ctx.globalAlpha = clamp(a, 0, 1);
    ctx.textAlign = 'center';
    ctx.font = "bold 30px Orbitron, sans-serif";
    ctx.fillStyle = bn.color || '#8fe9ff'; ctx.shadowColor = bn.color || '#39d6ff'; ctx.shadowBlur = 18;
    ctx.fillText(bn.title, W / 2, H * 0.36);
    ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
    ctx.fillStyle = '#d8f6ff'; ctx.shadowBlur = 8;
    ctx.fillText(bn.sub, W / 2, H * 0.36 + 34);
    ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  }
}

function drawClearFx() {
  const T = 4.4, e = T - game.clearFx;
  const cx = W / 2, cy = H * 0.42;
  const a = Math.min(clamp(e / 0.4, 0, 1), clamp(game.clearFx / 0.8, 0, 1));
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(e * 0.35);
  ctx.globalAlpha = a * 0.8;
  for (let i = 0; i < 12; i++) {
    const ang = (i / 12) * Math.PI * 2;
    const len = 150 + Math.sin(e * 3 + i) * 24;
    const g = ctx.createLinearGradient(0, 0, Math.cos(ang) * len, Math.sin(ang) * len);
    g.addColorStop(0, 'rgba(255,220,120,.55)'); g.addColorStop(1, 'rgba(255,220,120,0)');
    ctx.strokeStyle = g; ctx.lineWidth = 10;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(ang) * len, Math.sin(ang) * len); ctx.stroke();
  }
  ctx.restore();
  for (let r = 0; r < 3; r++) {
    const te = e - r * 0.45;
    if (te <= 0) continue;
    const rr = te * 340, al = clamp(1 - te / 1.6, 0, 1) * a;
    ctx.globalAlpha = al;
    ctx.strokeStyle = '#ffe88a'; ctx.lineWidth = 4 * al + 1;
    ctx.shadowColor = '#ffd24a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.arc(cx, cy, rr, 0, 6.29); ctx.stroke();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  const scale = 1 + Math.max(0, 0.5 - e) * 0.9;
  ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.font = "900 34px Orbitron, 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = '#ffe88a'; ctx.shadowColor = '#ffb02e'; ctx.shadowBlur = 26;
  ctx.fillText('首领已全部击败', 0, -8);
  ctx.font = "bold 15px Orbitron, sans-serif";
  ctx.fillStyle = '#fff6d0'; ctx.shadowBlur = 10;
  ctx.fillText('ALL BOSSES CLEARED', 0, 22);
  ctx.font = "bold 14px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = '#ffe8b0';
  ctx.fillText('无尽模式已开启 · 敌军持续强化，祝你好运', 0, 50);
  ctx.restore();
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

function render(t, dt) {
  ctx.clearRect(0, 0, W, H);
  drawBackground(t);

  ctx.save();
  if (game.shake > 0) ctx.translate(rand(-game.shake, game.shake) * 0.5, rand(-game.shake, game.shake) * 0.5);

  drawPowerups();
  drawEnemies();
  drawBoss();
  drawEnemyBullets();
  drawAuroraBeams();
  drawPlayer(t);
  drawPlayerBullets();
  drawParticles();
  drawFloats(dt);
  ctx.restore();

  if (state === STATE.PLAY || state === STATE.OVER || state === STATE.PAUSE) drawHUD();

  if (game.flash > 0) {
    ctx.fillStyle = `rgba(220,240,255,${Math.min(0.8, game.flash)})`;
    ctx.fillRect(0, 0, W, H);
  }
  if (game.clearFx > 0) drawClearFx();
}

/* ---------------- 输入 ---------------- */
const keys = { up: false, down: false, left: false, right: false };
const pointer = { active: false, x: W / 2, y: H - 110, ox: 0, oy: 0 };

function toLogical(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  return { x: (clientX - r.left) / r.width * W, y: (clientY - r.top) / r.height * H };
}
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
  if (k === 'arrowup' || k === 'w') keys.up = true;
  if (k === 'arrowdown' || k === 's') keys.down = true;
  if (k === 'arrowleft' || k === 'a') keys.left = true;
  if (k === 'arrowright' || k === 'd') keys.right = true;
  if (k === ' ') { if (state === STATE.PLAY) detonateBomb(); }
  if ((k === 'p' || k === 'escape') && (state === STATE.PAUSE || (state === STATE.PLAY && player.alive))) togglePause();
});
window.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowup' || k === 'w') keys.up = false;
  if (k === 'arrowdown' || k === 's') keys.down = false;
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  if (k === 'arrowright' || k === 'd') keys.right = false;
});

/* 【手机优化 6】触摸控制：手指按下后飞机保持在指尖上方 50px，避免手指遮挡 */
canvas.addEventListener('pointerdown', e => {
  if (state !== STATE.PLAY || !player || !player.alive) return;
  e.preventDefault();
  const p = toLogical(e.clientX, e.clientY);
  pointer.active = true;
  pointer.ox = player.x - p.x;
  pointer.oy = player.y - p.y;
  pointer.x = p.x; pointer.y = p.y;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});
canvas.addEventListener('pointermove', e => {
  if (!pointer.active) return;
  e.preventDefault();
  const p = toLogical(e.clientX, e.clientY);
  pointer.x = p.x; pointer.y = p.y;
});
const releasePointer = () => { pointer.active = false; };
window.addEventListener('pointerup', releasePointer);
window.addEventListener('pointercancel', releasePointer);
window.addEventListener('blur', () => { if (state === STATE.PLAY) togglePause(true); });

const touchBombBtn = document.getElementById('touchBomb');
if ('ontouchstart' in window) {
  touchBombBtn.style.display = 'flex';
  touchBombBtn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (state === STATE.PLAY) detonateBomb();
  });
}

  if (state === STATE.PLAY || force === true && state === STATE.PLAY) {
    state = STATE.PAUSE; showScreen('pause'); AudioSys.stopMusic();
  } else if (state === STATE.PAUSE) {
    state = STATE.PLAY; showScreen(null); AudioSys.init(); AudioSys.startMusic();

}

    nm.className = 'ship-name'; nm.textContent = cfg.name;
    card.appendChild(nm);
    const en = document.createElement('div');
    en.className = 'ship-en'; en.textContent = cfg.en;
    card.appendChild(en);
    const ds = document.createElement('div');
    ds.className = 'ship-desc'; ds.textContent = cfg.desc;
    card.appendChild(ds);

      const track = document.createElement('div');
      track.className = 'stat-track';
      const fill = document.createElement('div');
      fill.className = 'stat-fill';
      fill.style.width = (cfg.stats[k] / 5 * 100) + '%';
      track.appendChild(fill);
      row.appendChild(lab); row.appendChild(track);
      bars.appendChild(row);
    });
    card.appendChild(bars);

    card.addEventListener('click', () => {
      selectedShip = i;
      localStorage.setItem('skystrike.ship', String(i));
      grid.querySelectorAll('.ship-card').forEach(el => el.classList.toggle('selected', +el.dataset.id === i));
      AudioSys.init(); AudioSys.tone(680, 0.08, 'square', 0.05, 920);
    });
    grid.appendChild(card);
    drawHangarPreview(cv, i, 0);
  });
}
function hangarPreviewLoop(ts) {
  if (!hangarScreen.classList.contains('hidden')) {
    const t = ts / 1000;
    hangarScreen.querySelectorAll('.ship-card canvas').forEach(cv => drawHangarPreview(cv, +cv.dataset.id, t));
  }
  requestAnimationFrame(hangarPreviewLoop);
}
document.getElementById('hangarBtn').addEventListener('click', () => { AudioSys.init(); buildHangar(); showScreen('hangar'); });
document.getElementById('hangarBackBtn').addEventListener('click', () => showScreen('menu'));
document.getElementById('hangarStartBtn').addEventListener('click', () => { showScreen(null); startGame(); });
buildHangar();
requestAnimationFrame(hangarPreviewLoop);

const backBtn = document.getElementById('backBtn');
backBtn.addEventListener('click', () => {
  if (state === STATE.PLAY) {
    if (player.alive) togglePause();
    else toMenu();
  } else if (state === STATE.PAUSE || state === STATE.OVER) {
    toMenu();
  }
});

/* ---------------- 启动 ---------------- */
initBackground();
player = createPlayer();
bullets = []; ebullets = []; enemies = []; particles = []; powerups = []; floats = []; boss = null;
refreshMenuHi();
showScreen('menu');

let lastTs = performance.now();
function frame(ts) {
  const dt = Math.min(0.033, (ts - lastTs) / 1000);
  lastTs = ts;
  if (state === STATE.PLAY) update(dt);
  else updateBackground(dt);
  render(ts / 1000, dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
