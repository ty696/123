<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>暗室 3D</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
    body { background: #000; font-family: "Microsoft YaHei", monospace; }
    canvas { display: block; }
    #hud { position: absolute; top: 20px; left: 20px; color: #a00; font-size: 18px; font-weight: bold; text-shadow: 0 0 10px #f00; z-index: 10; pointer-events: none; font-family: monospace; letter-spacing: 2px; }
    #stamina { position: absolute; top: 50px; left: 20px; width: 150px; height: 6px; background: #222; z-index: 10; }
    #stamina-bar { height: 100%; width: 100%; background: #800; transition: width 0.1s; }
    #crosshair { position: absolute; top: 50%; left: 50%; width: 6px; height: 6px; background: rgba(255,255,255,0.5); border-radius: 50%; transform: translate(-50%, -50%); z-index: 5; }
    
    #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; text-align: center; }
    #start-screen h1 { font-size: 56px; color: #500; letter-spacing: 20px; margin-bottom: 20px; text-shadow: 0 0 30px #800; animation: flicker 3s infinite; }
    @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    #start-screen p { color: #444; font-size: 13px; margin: 6px 0; letter-spacing: 3px; }
    #start-screen button { margin-top: 40px; padding: 15px 50px; background: #000; border: 1px solid #500; color: #a00; font-size: 18px; cursor: pointer; letter-spacing: 8px; font-family: inherit; transition: all 0.3s; }
    #start-screen button:hover { background: #200; box-shadow: 0 0 20px #500; }
    
    #msg { position: absolute; top: 60%; left: 50%; transform: translate(-50%,-50%); color: #fff; font-size: 20px; z-index: 20; text-shadow: 0 0 10px #000; pointer-events: none; opacity: 0; transition: opacity 0.5s; }
    
    #jump-scare-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; display: none; justify-content: center; align-items: center; overflow: hidden; }
    #jump-scare-overlay img { width: 100%; height: 100%; object-fit: cover; animation: zoomIn 0.1s forwards, shake 0.05s infinite; }
    #fallback-eye { color: #f00; font-size: 50vh; line-height: 1; text-shadow: 0 0 50px #f00; display: none; animation: zoomIn 0.1s forwards, shake 0.05s infinite; }
    @keyframes zoomIn { from { transform: scale(2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translate(0,0); } 25% { transform: translate(-10px,5px); } 75% { transform: translate(10px,-5px); } }
    
    #game-over { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(50,0,0,0.9); color: #f00; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 300; text-align: center; }
    #game-over h2 { font-size: 50px; letter-spacing: 15px; text-shadow: 0 0 30px #f00; }
    #win-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: #0a0; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 300; text-align: center; }
    #win-screen h2 { font-size: 45px; letter-spacing: 10px; text-shadow: 0 0 30px #0a0; }
    
    /* 手机端专用的“重新开始”按钮样式 */
    .restart-btn {
        margin-top: 40px;
        padding: 15px 50px;
        background: #000;
        border: 2px solid #f00;
        color: #f00;
        font-size: 22px;
        font-weight: bold;
        letter-spacing: 5px;
        cursor: pointer;
        border-radius: 10px;
        font-family: "Microsoft YaHei", sans-serif;
        animation: pulse 1.5s infinite;
        -webkit-user-select: none;
        user-select: none;
    }
    .restart-btn:active { background: #500; color: #fff; }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); }
        70% { box-shadow: 0 0 0 20px rgba(255, 0, 0, 0); }
        100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); }
    }
    
    #orientation-warning { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: #f00; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; text-align: center; }
    #orientation-warning h2 { font-size: 30px; margin-bottom: 20px; letter-spacing: 5px; text-shadow: 0 0 10px #f00; }
    #orientation-warning .phone-icon { font-size: 80px; animation: rotatePhone 2s infinite; margin-bottom: 30px; }
    @keyframes rotatePhone { 0% { transform: rotate(0deg); } 50% { transform: rotate(90deg); } 100% { transform: rotate(90deg); } }
    
    /* 强制显示的虚拟摇杆和奔跑按钮 */
    #joystick-zone { position: absolute; bottom: 20px; left: 20px; width: 140px; height: 140px; z-index: 50; display: block; }
    #joystick-base { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); }
    #joystick-knob { position: absolute; top: 50%; left: 50%; width: 60px; height: 60px; margin: -30px 0 0 -30px; border-radius: 50%; background: rgba(150,0,0,0.6); border: 2px solid #800; }
    
    #run-btn { position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px; border-radius: 50%; background: rgba(150,0,0,0.5); border: 2px solid #800; color: #fff; font-size: 18px; font-weight: bold; text-align: center; line-height: 76px; z-index: 50; display: block; user-select: none; -webkit-user-select: none; }
    #run-btn:active { background: rgba(200,0,0,0.7); }
</style>
</head>
<body>

<div id="orientation-warning">
    <div class="phone-icon">📱</div>
    <h2>请旋转手机横屏游玩</h2>
    <p style="color:#888; font-size: 14px;">横屏才能感受到真正的黑暗压迫感</p>
</div>

<div id="start-screen">
    <h1>暗 室</h1>
    <p>—— 不要相信你听到的 ——</p>
    <p style="margin-top:20px; color:#222;">左侧摇杆移动 · 右侧屏幕滑动转向</p>
    <p style="color:#222;">按住右下角按钮奔跑（消耗体力）</p>
    <button onclick="startGame()">进 入</button>
</div>

<div id="hud">祭品: 0 / 3</div>
<div id="stamina"><div id="stamina-bar"></div></div>
<div id="crosshair"></div>
<div id="msg"></div>

<div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-knob"></div>
</div>
<div id="run-btn">奔跑</div>

<div id="jump-scare-overlay">
    <img id="scary-img" src="scary.jpg" onerror="this.style.display='none'; document.getElementById('fallback-eye').style.display='block';">
    <div id="fallback-eye">👁️</div>
</div>

<!-- 🚨 修改1：游戏结束界面 -->
<div id="game-over">
    <h2>你 被 抓 住 了</h2>
    <button class="restart-btn" onclick="startGame()">重新开始</button>
</div>

<!-- 🚨 修改2：逃脱成功界面 -->
<div id="win-screen">
    <h2>你 逃 出 去 了</h2>
    <p>但那东西...还在黑暗中</p>
    <button class="restart-btn" onclick="startGame()">再玩一次</button>
</div>

<script src="https://cdn.staticfile.org/three.js/r128/three.min.js"></script>
<script>
const ghostScream = new Audio('scream.mp3');
const pickupSound = new Audio('pickup.mp3');
const footstepSound = new Audio('footstep.mp3');
ghostScream.load(); pickupSound.load(); footstepSound.load();

function playSound(audioObj, volume = 1.0) {
    try { if (audioObj) { audioObj.volume = volume; audioObj.currentTime = 0; audioObj.play().catch(e => {}); } } catch(e) {}
}

let scene, camera, renderer;
let player, flashlight;
let keys = {};
let yaw = 0, pitch = 0;
let isPointerLocked = false;
let monster;
let items = [];
let walls = [];
let score = 0;
let stamina = 100;
let gameState = 'menu';
let lastTime = 0;
let footstepTimer = 0;
let mapSize = 80;
let joystickActive = false;
let joystickStart = {x: 0, y: 0};
let joystickVector = {x: 0, y: 0};
let isRunning = false;
let runBtnPressed = false;
let baseFov = 75, runFov = 90;

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.FogExp2(0x000000, 0.04); 

    camera = new THREE.PerspectiveCamera(baseFov, window.innerWidth / window.innerHeight, 0.1, 200);
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    let ambientLight = new THREE.AmbientLight(0x202020, 0.8);
    scene.add(ambientLight);

    flashlight = new THREE.SpotLight(0xffffff, 3.5, 45, Math.PI / 5, 0.5, 1.0);
    flashlight.castShadow = true;
    flashlight.shadow.mapSize.width = 1024;
    flashlight.shadow.mapSize.height = 1024;
    scene.add(flashlight);
    scene.add(flashlight.target);

    generateMap();
    createMonster();
    requestAnimationFrame(animate);
    player = { x: 0, y: 1.7, z: 0 };

    window.addEventListener('resize', onResize);
    document.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; });
    document.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('click', onCanvasClick);
    document.addEventListener('pointerlockchange', onPointerLockChange);
    
    setupJoystick();
    setupRunButton();
}

function generateMap() {
    const size = mapSize; const wallThickness = 0.5; const wallHeight = 3;
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x101010, roughness: 1 });
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(size * 2, size * 2), floorMat);
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
    const ceil = new THREE.Mesh(new THREE.PlaneGeometry(size * 2, size * 2), new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 }));
    ceil.rotation.x = Math.PI / 2; ceil.position.y = wallHeight; scene.add(ceil);
    
    const bounds = [[-size, -size, size*2, wallThickness], [-size, size - wallThickness, size*2, wallThickness], [-size, -size, wallThickness, size*2], [size - wallThickness, -size, wallThickness, size*2]];
    bounds.forEach(b => {
        const wall = new THREE.Mesh(new THREE.BoxGeometry(b[2], wallHeight, b[3]), wallMat);
        wall.position.set(b[0] + b[2]/2, wallHeight/2, b[1] + b[3]/2);
        wall.castShadow = true; wall.receiveShadow = true; scene.add(wall); walls.push({x: b[0], z: b[1], w: b[2], d: b[3]});
    });

    for (let i = 0; i < 60; i++) {
        let w = (Math.random() < 0.5 ? 6 : 2) * (Math.random() < 0.5 ? 1 : 0.5);
        let d = (w > 4) ? 1 : 4 + Math.random() * 4;
        let x = (Math.random() * (size - 10) - (size - 10) / 2) + Math.random() * 10 - 5;
        let z = (Math.random() * (size - 10) - (size - 10) / 2) + Math.random() * 10 - 5;
        if (Math.abs(x) < 5 && Math.abs(z) < 5) continue;
        const wall = new THREE.Mesh(new THREE.BoxGeometry(w, wallHeight, d), wallMat);
        wall.position.set(x, wallHeight/2, z); wall.castShadow = true; wall.receiveShadow = true; scene.add(wall);
        walls.push({x: x - w/2, z: z - d/2, w: w, d: d});
    }

    for (let i = 0; i < 3; i++) {
        let placed = false; let attempts = 0;
        while (!placed && attempts < 200) {
            let x = Math.random() * (size * 1.6) - size * 0.8; let z = Math.random() * (size * 1.6) - size * 0.8;
            if (Math.hypot(x, z) < 15) { attempts++; continue; }
            if (!isInsideWall(x, z)) { createItem(x, 1, z); placed = true; }
            attempts++;
        }
    }
}

function isInsideWall(x, z) {
    for (let w of walls) { if (x > w.x - 0.6 && x < w.x + w.w + 0.6 && z > w.z - 0.6 && z < w.z + w.d + 0.6) return true; }
    return false;
}

function createItem(x, y, z) {
    const item = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), new THREE.MeshStandardMaterial({ color: 0xff2020, emissive: 0xaa0000, emissiveIntensity: 2 }));
    item.position.set(x, y, z); item.castShadow = true; scene.add(item);
    const light = new THREE.PointLight(0xff0000, 0.8, 6); light.position.set(x, y, z); scene.add(light);
    items.push({ mesh: item, light: light, collected: false, phase: Math.random() * 6 });
}

function createMonster() {
    const group = new THREE.Group();
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x050505, roughness: 1 });
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.6, 2.5, 6), bodyMat);
    body.position.y = 1.25; body.castShadow = true; group.add(body);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 6, 6), bodyMat);
    head.position.y = 2.8; group.add(head);
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
    const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat); eye1.position.set(-0.15, 2.85, 0.35); group.add(eye1);
    const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), eyeMat); eye2.position.set(0.15, 2.85, 0.35); group.add(eye2);
    const eyeLight = new THREE.PointLight(0xff0000, 0.5, 5); eyeLight.position.set(0, 2.85, 0.5); group.add(eyeLight);
    group.position.set(mapSize * 0.7, 0, mapSize * 0.7); scene.add(group);
    monster = { group: group, x: mapSize * 0.7, z: mapSize * 0.7, speed: 1.5, eyeLight: eyeLight };
}

function updatePlayer(dt, time) {
    let forward = 0, right = 0;
    forward = -joystickVector.y; right = joystickVector.x;
    if (keys['w'] || keys['arrowup']) forward += 1;
    if (keys['s'] || keys['arrowdown']) forward -= 1;
    if (keys['a'] || keys['arrowleft']) right -= 1;
    if (keys['d'] || keys['arrowright']) right += 1;
    
    let isMoving = (forward !== 0 || right !== 0);
    isRunning = (keys['shift'] || runBtnPressed) && stamina > 0 && isMoving;
    
    let speed = isRunning ? 8 : 3.5; 
    
    if (isRunning) {
        stamina = Math.max(0, stamina - dt * 25); 
        camera.fov += (runFov - camera.fov) * 0.1; 
    } else {
        stamina = Math.min(100, stamina + dt * 10); 
        camera.fov += (baseFov - camera.fov) * 0.1; 
    }
    camera.updateProjectionMatrix();
    document.getElementById('stamina-bar').style.width = stamina + '%';
    
    if (isMoving) {
        const moveX = -Math.sin(yaw) * forward + Math.cos(yaw) * right;
        const moveZ = -Math.cos(yaw) * forward - Math.sin(yaw) * right;
        const len = Math.hypot(moveX, moveZ);
        if (len > 0) {
            const nx = player.x + (moveX / len) * speed * dt;
            const nz = player.z + (moveZ / len) * speed * dt;
            let canX = true, canZ = true;
            for (let w of walls) {
                if (nx > w.x - 0.3 && nx < w.x + w.w + 0.3 && player.z > w.z - 0.3 && player.z < w.z + w.d + 0.3) canX = false;
                if (player.x > w.x - 0.3 && player.x < w.x + w.w + 0.3 && nz > w.z - 0.3 && nz < w.z + w.d + 0.3) canZ = false;
            }
            if (canX) player.x = nx;
            if (canZ) player.z = nz;
            
            footstepTimer -= dt;
            if (footstepTimer <= 0) { playSound(footstepSound, 0.3); footstepTimer = isRunning ? 0.25 : 0.5; }
        }
    }
    player.x = Math.max(-mapSize + 1, Math.min(mapSize - 1, player.x));
    player.z = Math.max(-mapSize + 1, Math.min(mapSize - 1, player.z));
    
    camera.position.set(player.x, player.y, player.z);
    camera.rotation.order = 'YXZ'; camera.rotation.y = yaw; camera.rotation.x = pitch;
    flashlight.position.copy(camera.position);
    const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
    flashlight.target.position.copy(camera.position).add(dir.multiplyScalar(10));
    camera.position.y = player.y + Math.sin(time * 2) * 0.02;
}

function updateMonster(dt, time) {
    const dx = player.x - monster.x; const dz = player.z - monster.z;
    const dist = Math.hypot(dx, dz);
    if (dist > 1.5) {
        let speed = monster.speed;
        if (dist < 15) speed *= 2.5; else if (dist < 30) speed *= 1.8;
        const nx = monster.x + (dx / dist) * speed * dt; const nz = monster.z + (dz / dist) * speed * dt;
        if (!isInsideWall(nx, monster.z)) monster.x = nx;
        if (!isInsideWall(monster.x, nz)) monster.z = nz;
    }
    monster.group.position.set(monster.x, 0, monster.z);
    monster.group.rotation.y = Math.atan2(dx, dz);
    monster.eyeLight.intensity = 0.3 + Math.sin(time * 10) * 0.2;
    
    if (dist < 1.5 && gameState === 'playing') {
        gameState = 'gameover';
        playSound(ghostScream, 1.0); 
        document.getElementById('jump-scare-overlay').style.display = 'flex'; 
        setTimeout(() => {
            document.getElementById('jump-scare-overlay').style.display = 'none';
            document.getElementById('game-over').style.display = 'flex';
        }, 1200); 
    }
}

function updateItems(dt, time) {
    items.forEach(item => {
        if (item.collected) return;
        item.phase += dt * 2; item.mesh.rotation.y += dt * 1.5;
        item.mesh.position.y = 1 + Math.sin(item.phase) * 0.2;
        item.light.position.y = item.mesh.position.y;
        item.light.intensity = 0.5 + Math.sin(item.phase * 2) * 0.3;
        const dist = Math.hypot(player.x - item.mesh.position.x, player.z - item.mesh.position.z);
        if (dist < 1.5) {
            item.collected = true; scene.remove(item.mesh); scene.remove(item.light); score++;
            document.getElementById('hud').innerText = `祭品: ${score} / 3`;
            playSound(pickupSound, 0.8);
            const msg = document.getElementById('msg');
            msg.innerText = score >= 3 ? '所有祭品已收集... 快跑！' : `已收集 ${score} / 3`;
            msg.style.opacity = 1; setTimeout(() => { msg.style.opacity = 0; }, 2000);
        }
    });
}

function onMouseMove(e) { if (!isPointerLocked || gameState !== 'playing') return; yaw -= e.movementX * 0.002; pitch -= e.movementY * 0.002; pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch)); }
function onCanvasClick() { if (gameState === 'playing' && !isPointerLocked) renderer.domElement.requestPointerLock(); }
function onPointerLockChange() { isPointerLocked = document.pointerLockElement === renderer.domElement; }
function onResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); }

function setupJoystick() {
    const zone = document.getElementById('joystick-zone'); const knob = document.getElementById('joystick-knob');
    zone.addEventListener('touchstart', e => { e.preventDefault(); joystickActive = true; const touch = e.touches[0]; const rect = zone.getBoundingClientRect(); joystickStart.x = rect.left + rect.width / 2; joystickStart.y = rect.top + rect.height / 2; }, {passive: false});
    zone.addEventListener('touchmove', e => {
        e.preventDefault(); if (!joystickActive) return; const touch = e.touches[0];
        let dx = touch.clientX - joystickStart.x; let dy = touch.clientY - joystickStart.y;
        const maxDist = 50; const dist = Math.hypot(dx, dy);
        if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
        knob.style.transform = `translate(${dx}px, ${dy}px)`; joystickVector.x = dx / maxDist; joystickVector.y = dy / maxDist;
    }, {passive: false});
    zone.addEventListener('touchend', e => { e.preventDefault(); joystickActive = false; knob.style.transform = 'translate(0,0)'; joystickVector = {x: 0, y: 0}; }, {passive: false});
    
    zone.addEventListener('mousedown', e => { joystickActive = true; const rect = zone.getBoundingClientRect(); joystickStart.x = rect.left + rect.width / 2; joystickStart.y = rect.top + rect.height / 2; });
    document.addEventListener('mousemove', e => { if (!joystickActive) return; let dx = e.clientX - joystickStart.x; let dy = e.clientY - joystickStart.y; const maxDist = 50; const dist = Math.hypot(dx, dy); if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; } knob.style.transform = `translate(${dx}px, ${dy}px)`; joystickVector.x = dx / maxDist; joystickVector.y = dy / maxDist; });
    document.addEventListener('mouseup', () => { joystickActive = false; knob.style.transform = 'translate(0,0)'; joystickVector = {x: 0, y: 0}; });
}

function setupRunButton() {
    const btn = document.getElementById('run-btn');
    btn.addEventListener('touchstart', e => { e.preventDefault(); runBtnPressed = true; }, {passive: false});
    btn.addEventListener('touchend', e => { e.preventDefault(); runBtnPressed = false; }, {passive: false});
    btn.addEventListener('mousedown', e => { e.preventDefault(); runBtnPressed = true; });
    document.addEventListener('mouseup', () => { runBtnPressed = false; });
}

function animate(time) {
    requestAnimationFrame(animate);
    const dt = Math.min((time - lastTime) / 1000, 0.05); lastTime = time;
    if (gameState === 'playing') {
        updatePlayer(dt, time / 1000); updateMonster(dt, time / 1000); updateItems(dt, time / 1000);
        if (score >= 3) { if (Math.hypot(player.x, player.z) < 2) { gameState = 'win'; document.getElementById('win-screen').style.display = 'flex'; } }
    }
    renderer.render(scene, camera);
}

function startGame() {
    if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().catch(() => {}); }
    if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); }
    
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('game-over').style.display = 'none';
    document.getElementById('win-screen').style.display = 'none';
    
    gameState = 'playing'; player = { x: 0, y: 1.7, z: 0 }; yaw = 0; pitch = 0; score = 0; stamina = 100;
    document.getElementById('hud').innerText = '祭品: 0 / 3';
    items.forEach(it => { if (!it.collected) { scene.remove(it.mesh); scene.remove(it.light); } }); items = [];
    if (monster) scene.remove(monster.group);
    for (let i = 0; i < 3; i++) { let placed = false; let attempts = 0; while (!placed && attempts < 200) { let x = Math.random() * (mapSize * 1.6) - mapSize * 0.8; let z = Math.random() * (mapSize * 1.6) - mapSize * 0.8; if (Math.hypot(x, z) < 15) { attempts++; continue; } if (!isInsideWall(x, z)) { createItem(x, 1, z); placed = true; } attempts++; } }
    createMonster();
    
    if (renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
    
    const msg = document.getElementById('msg'); msg.innerText = '找到 3 个祭品...'; msg.style.opacity = 1; setTimeout(() => { msg.style.opacity = 0; }, 3000);
}
init();
</script>
</body>
