<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>逃离政治老师</title>
<style>
  *{
    margin:0;padding:0;box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
  }
  html,body{
    width:100%;height:100%;overflow:hidden;background:#000;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    touch-action:none;overscroll-behavior:none;
  }
  #c{
    position:fixed;inset:0;display:block;width:100%;height:100%;
    background:#000;
  }

  /* ---------- 摇杆 ---------- */
  #stick{
    position:fixed;left:-200px;top:-200px;
    width:120px;height:120px;border-radius:50%;
    border:2px solid rgba(110,160,210,.30);
    background:radial-gradient(circle,rgba(30,50,75,.35),rgba(10,18,28,.15));
    z-index:20;pointer-events:none;opacity:0;
    transition:opacity .15s ease;
    box-shadow:0 0 24px rgba(0,0,0,.6) inset;
  }
  #knob{
    position:absolute;left:50%;top:50%;
    width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,rgba(170,215,255,.55),rgba(60,110,160,.35));
    border:2px solid rgba(160,210,255,.55);
    box-shadow:0 0 20px rgba(100,180,255,.45);
    will-change:transform;
  }

  /* ---------- 准星 ---------- */
  #cross{
    position:fixed;left:50%;top:50%;
    width:5px;height:5px;margin:-2.5px 0 0 -2.5px;border-radius:50%;
    background:rgba(200,230,255,.45);
    box-shadow:0 0 6px rgba(150,200,255,.7);
    z-index:10;pointer-events:none;
  }

  /* ---------- 手电光晕 ---------- */
  #vignette{
    position:fixed;inset:0;z-index:8;pointer-events:none;
    background:radial-gradient(ellipse at 50% 50%,
      rgba(0,0,0,0) 32%,
      rgba(0,0,0,.35) 62%,
      rgba(0,0,0,.82) 100%);
  }

  /* ---------- 顶部 HUD ---------- */
  #hud{
    position:fixed;left:0;right:0;top:0;
    padding:10px 16px;z-index:12;pointer-events:none;
    display:flex;justify-content:space-between;align-items:flex-start;
    font-size:13px;letter-spacing:1px;
    color:#7fa6c8;text-shadow:0 0 8px rgba(80,160,255,.5);
  }
  #hud .tag{
    background:rgba(10,20,32,.55);
    border:1px solid rgba(80,140,200,.28);
    border-radius:4px;padding:4px 10px;
  }

  /* ---------- 开始遮罩 ---------- */
  #start{
    position:fixed;inset:0;z-index:60;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#0a1018 0%,#000 80%);
    color:#9fc4e0;gap:18px;
    transition:opacity .5s ease;
  }
  #start h1{
    font-size:32px;letter-spacing:10px;font-weight:700;
    color:#d8ecff;
    text-shadow:0 0 20px rgba(90,170,255,.8),0 0 44px rgba(60,120,200,.5);
  }
  #start .sub{
    font-size:13px;letter-spacing:3px;color:#5b7f9c;
  }
  #start .btn{
    margin-top:12px;padding:12px 40px;
    border:1px solid rgba(110,180,255,.55);
    border-radius:6px;color:#cfe8ff;font-size:15px;letter-spacing:6px;
    background:rgba(30,70,120,.28);
    box-shadow:0 0 24px rgba(60,140,220,.35);
  }

  /* ---------- 通关遮罩 ---------- */
  #win{
    position:fixed;inset:0;z-index:65;
    display:none;flex-direction:column;
    align-items:center;justify-content:center;
    background:radial-gradient(ellipse at center,#04140c 0%,#000 82%);
    color:#9fe0c0;gap:18px;
    transition:opacity .5s ease;
  }
  #win.on{ display:flex; }
  #win h1{
    font-size:34px;letter-spacing:12px;font-weight:700;
    color:#c9ffe4;
    text-shadow:0 0 22px rgba(90,255,180,.85),0 0 48px rgba(40,180,120,.5);
  }
  #win .sub{
    font-size:13px;letter-spacing:3px;color:#4f9070;
  }
  #win .stat{
    margin-top:6px;font-size:15px;letter-spacing:3px;color:#8fd8b4;
    text-shadow:0 0 12px rgba(80,220,150,.5);
  }
  #win .btn{
    margin-top:16px;padding:12px 40px;
    border:1px solid rgba(110,255,190,.55);
    border-radius:6px;color:#d6ffee;font-size:15px;letter-spacing:6px;
    background:rgba(20,90,60,.3);
    box-shadow:0 0 24px rgba(60,220,150,.35);
  }

  /* ---------- 强制横屏提示 ---------- */
  #rotate{
    display:none;position:fixed;inset:0;z-index:200;
    background:#000;color:#7fa6c8;
    flex-direction:column;align-items:center;justify-content:center;gap:18px;
    font-size:16px;letter-spacing:3px;
  }
  #rotate .ph{
    width:44px;height:76px;border:2px solid #3d607f;border-radius:8px;
    animation:rot 1.6s ease-in-out infinite;
  }
  @keyframes rot{
    0%,40%{transform:rotate(0deg)}
    60%,100%{transform:rotate(90deg)}
  }
  @media (orientation:portrait) and (max-width:900px){
    #rotate{display:flex;}
  }

  /* =========================================================
     答题界面
     ========================================================= */
  #quiz{
    position:fixed;inset:0;z-index:50;
    display:none;
    flex-direction:column;
    padding:12px 22px 8px;
    background:
      radial-gradient(ellipse at 50% 42%,
        rgba(10,26,44,.955) 0%,
        rgba(3,6,11,.985) 72%,
        rgba(0,0,0,.995) 100%);
    color:#bcd8ef;
    overflow:hidden;
  }
  #quiz.on{ display:flex; }

  .q-head{
    display:flex;justify-content:space-between;align-items:center;
    font-size:clamp(11px,1.9vh,15px);
    letter-spacing:2px;
    color:#5f8db3;
    padding-bottom:6px;
    flex:0 0 auto;
  }
  .q-head .q-title{ color:#8ab4d6; }

  .q-text{
    flex:0 0 auto;
    max-height:29vh;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    background:rgba(12,24,38,.62);
    border-left:3px solid #3d7fb8;
    border-radius:4px;
    padding:clamp(8px,1.6vh,16px) clamp(10px,1.6vw,20px);
    font-size:clamp(12px,2.15vh,17px);
    line-height:1.55;
    color:#cfe4f5;
    letter-spacing:.4px;
    box-shadow:0 0 22px rgba(30,80,140,.20) inset;
  }
  .q-text::-webkit-scrollbar{ width:3px; }
  .q-text::-webkit-scrollbar-thumb{ background:rgba(90,150,210,.5); }

  .q-opts{
    flex:1 1 auto;
    display:flex;
    gap:clamp(12px,2.6vw,34px);
    margin-top:clamp(8px,1.6vh,18px);
    min-height:0;
  }

  .opt{
    flex:1 1 0;
    display:flex;
    align-items:center;
    position:relative;
    border:1.5px solid rgba(70,130,190,.34);
    border-radius:10px;
    padding:clamp(8px,1.6vh,18px) clamp(10px,1.4vw,18px) clamp(8px,1.6vh,18px) 46px;
    background:linear-gradient(180deg,rgba(14,28,46,.62),rgba(8,16,28,.48));
    box-shadow:0 0 20px rgba(0,0,0,.45) inset;
    transition:border-color .18s ease, box-shadow .18s ease, background .18s ease;
    overflow:hidden;
  }
  .opt .opt-txt{
    font-size:clamp(11px,2.0vh,16px);
    line-height:1.5;
    color:#a9c9e2;
    letter-spacing:.3px;
    word-break:break-word;
  }

  .opt.ok{
    border-color:rgba(78,232,154,.95);
    background:linear-gradient(180deg,rgba(18,64,48,.72),rgba(10,34,26,.6));
    box-shadow:0 0 26px rgba(78,232,154,.42);
  }
  .opt.ok .opt-txt{ color:#b6ffe0; }

  .opt.bad{
    border-color:rgba(255,90,110,.95);
    background:linear-gradient(180deg,rgba(70,20,28,.72),rgba(38,10,16,.6));
    box-shadow:0 0 26px rgba(255,90,110,.40);
  }
  .opt.bad .opt-txt{ color:#ffc4cc; }

  .q-tip{
    flex:0 0 auto;
    text-align:center;
    font-size:clamp(10px,1.6vh,13px);
    letter-spacing:2px;
    color:#4a6d8c;
    padding-top:clamp(4px,1.0vh,12px);
  }

  /* 三角形光标 */
  #qCursor{
    position:absolute;
    left:0;top:0;
    width:26px;height:32px;
    color:#5fe8ff;
    filter:drop-shadow(0 0 8px rgba(95,232,255,.95))
           drop-shadow(0 0 18px rgba(60,180,255,.55));
    transition:left .15s cubic-bezier(.2,.8,.3,1), top .15s cubic-bezier(.2,.8,.3,1);
    pointer-events:none;
    animation:curBlink 1.15s ease-in-out infinite;
    z-index:3;
  }
  #qCursor svg{ display:block;width:100%;height:100%; }

  @keyframes curBlink{
    0%,100%{ opacity:1; }
    50%    { opacity:.32; }
  }

  /* Toast */
  #toast{
    position:fixed;left:50%;top:14%;
    transform:translate(-50%,-14px);
    z-index:70;
    padding:10px 22px;
    border:1px solid rgba(110,180,255,.45);
    border-radius:6px;
    background:rgba(8,20,34,.92);
    color:#cfe8ff;
    font-size:clamp(11px,1.9vh,15px);
    letter-spacing:2px;
    box-shadow:0 0 28px rgba(40,120,200,.45);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    white-space:nowrap;
  }
  #toast.on{
    opacity:1;
    transform:translate(-50%,0);
  }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="cross"></div>

<div id="stick"><div id="knob"></div></div>

<div id="hud">
  <div class="tag" id="hudFloor">四楼走廊</div>
  <div class="tag" id="hudHint">滑动屏幕转动视角 · 左下摇杆移动</div>
</div>

<div id="toast"></div>

<!-- ============ 答题界面 ============ -->
<div id="quiz">
  <div class="q-head">
    <span id="qProg">第 1 / 15 题</span>
    <span class="q-title" id="qTitle">课代表A</span>
  </div>

  <div class="q-text" id="qText"></div>

  <div class="q-opts">
    <div class="opt" id="optL"><div class="opt-txt" id="optLTxt"></div></div>
    <div class="opt" id="optR"><div class="opt-txt" id="optRTxt"></div></div>
  </div>

  <div class="q-tip">← 左右滑动切换选项 · 点击屏幕确认 →</div>

  <div id="qCursor">
    <svg viewBox="0 0 32 40" preserveAspectRatio="xMidYMid meet">
      <path d="M7 5 L26 20 L7 35"
            fill="none"
            stroke="currentColor"
            stroke-width="4.6"
            stroke-linecap="round"
            stroke-linejoin="round"/>
    </svg>
  </div>
</div>

<div id="start">
  <h1>逃离政治老师</h1>
  <div class="sub">YIN XING LOU · BUILDING 2</div>
  <div class="btn" id="startBtn">点 击 进 入</div>
</div>

<div id="win">
  <h1>成 功 逃 离</h1>
  <div class="sub">你已走出银杏楼二栋</div>
  <div class="stat" id="winStat"></div>
  <div class="btn" id="againBtn">再 来 一 次</div>
</div>

<div id="rotate">
  <div class="ph"></div>
  <div>请 横 屏 游 戏</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r149/three.min.js"></script>
<script>
(function(){
'use strict';

/* =========================================================
   0. 基础常量
   ========================================================= */
const EYE_H      = 1.65;    // 眼睛高度
const MOVE_SPEED = 3.4;     // 行走速度 m/s
const LOOK_SENS  = 0.0042;  // 视角灵敏度
const PITCH_LIM  = 1.15;    // 上下视角限制

const FLOOR_H    = 4;       // 层高
const FLOORS     = 4;       // 层数
const BX1 = -28, BX2 = 28;  // 楼体 X 范围
const BZO = -10;            // 走廊外侧墙 z
const BZS = -4;             // 教室隔墙 z
const BZB = 10;             // 楼体后墙 z
const BW  = BX2 - BX1;      // 楼宽 56

/* =========================================================
   1. 渲染器 / 场景 / 相机
   ========================================================= */
const canvas   = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({
  canvas, antialias:true, powerPreference:'high-performance'
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight, false);

/* 【性能修复】关闭阴影贴图：本场景静态装饰多，实时阴影收益极低，
   在移动端关闭后帧率显著提升。 */
renderer.shadowMap.enabled = false;

if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x04060a);
scene.fog        = new THREE.FogExp2(0x04060a, 0.026);

const camera = new THREE.PerspectiveCamera(
  76,
  window.innerWidth / window.innerHeight,
  0.06,
  320
);
camera.rotation.order = 'YXZ';
scene.add(camera);

/* =========================================================
   2. 程序化 Canvas 纹理（禁止外部图片）
   ========================================================= */
function makeCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* --- 地砖 --- */
function makeFloorTexture(){
  const c = makeCanvas(256, 256);
  const g = c.getContext('2d');
  g.fillStyle = '#15181e';
  g.fillRect(0, 0, 256, 256);

  const n = 4, s = 256 / n;
  for (let i = 0; i < n; i++){
    for (let j = 0; j < n; j++){
      const v = 30 + Math.random() * 12;
      g.fillStyle = 'rgb(' + (v|0) + ',' + ((v + 3)|0) + ',' + ((v + 8)|0) + ')';
      g.fillRect(i * s + 1.5, j * s + 1.5, s - 3, s - 3);
    }
  }
  const img = g.getImageData(0, 0, 256, 256);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const nz = (Math.random() - 0.5) * 26;
    d[i] += nz; d[i+1] += nz; d[i+2] += nz;
  }
  g.putImageData(img, 0, 0);

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(14, 1.6);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

/* --- 墙面 --- */
function makeWallTexture(){
  const c = makeCanvas(256, 256);
  const g = c.getContext('2d');
  g.fillStyle = '#20242c';
  g.fillRect(0, 0, 256, 256);

  g.fillStyle = '#171a21';
  for (let j = 0; j < 256; j += 64){
    g.fillRect(0, j, 256, 3);
  }
  g.fillStyle = 'rgba(14,16,20,.7)';
  for (let j = 0; j < 256; j += 64){
    const off = (j / 64) % 2 === 0 ? 0 : 32;
    for (let i = off; i < 256; i += 64){
      g.fillRect(i, j, 2, 64);
    }
  }
  const img = g.getImageData(0, 0, 256, 256);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4){
    const nz = (Math.random() - 0.5) * 18;
    d[i] += nz; d[i+1] += nz; d[i+2] += nz;
  }
  g.putImageData(img, 0, 0);

  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(12, 2);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 4;
  return t;
}

/* --- 楼顶发光招牌 --- */
function makeSignTexture(text){
  const W = 2048, H = 512;
  const c = makeCanvas(W, H);
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);

  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = 'bold 290px "PingFang SC","Microsoft YaHei","Heiti SC","SimHei",sans-serif';

  const glows = [
    { blur: 90, color: 'rgba(255,140,20,.85)' },
    { blur: 55, color: 'rgba(255,190,60,.95)' },
    { blur: 26, color: 'rgba(255,230,140,1)'   }
  ];
  glows.forEach(function(gl){
    g.shadowColor = gl.color;
    g.shadowBlur  = gl.blur;
    g.fillStyle   = gl.color;
    g.fillText(text, W/2, H/2);
    g.fillText(text, W/2, H/2);
  });

  g.shadowBlur = 10;
  g.shadowColor = '#fff6cc';
  g.fillStyle = '#fffdf2';
  g.fillText(text, W/2, H/2);

  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}

/* --- 安全出口标识 --- */
function makeExitTexture(){
  const c = makeCanvas(256, 128);
  const g = c.getContext('2d');
  g.fillStyle = '#031a0c';
  g.fillRect(0, 0, 256, 128);
  g.fillStyle = '#19ff7a';
  g.font = 'bold 62px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.shadowColor = '#19ff7a';
  g.shadowBlur = 18;
  g.fillText('安全出口', 128, 64);
  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* --- 教室门牌 --- */
function makeDoorPlateTexture(){
  const c = makeCanvas(128, 64);
  const g = c.getContext('2d');
  g.fillStyle = '#2a2f38';
  g.fillRect(0, 0, 128, 64);
  g.strokeStyle = '#454d59';
  g.lineWidth = 3;
  g.strokeRect(2, 2, 124, 60);
  g.fillStyle = '#8fa6bd';
  g.font = 'bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('教室', 64, 34);
  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* --- 光晕（课代表用） --- */
function makeGlowTexture(){
  const c = makeCanvas(128, 128);
  const g = c.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grd.addColorStop(0,    'rgba(255,255,255,1)');
  grd.addColorStop(0.22, 'rgba(170,235,255,.72)');
  grd.addColorStop(0.55, 'rgba(80,175,255,.20)');
  grd.addColorStop(1,    'rgba(0,0,0,0)');
  g.fillStyle = grd;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  return t;
}

/* --- 【新增】楼梯指示牌 --- */
function makeStairTex(text, colorHex){
  const W = 512, H = 256;
  const c = makeCanvas(W, H);
  const g = c.getContext('2d');
  g.clearRect(0, 0, W, H);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = 'bold 130px "PingFang SC","Microsoft YaHei",sans-serif';

  g.shadowColor = colorHex;
  g.shadowBlur  = 44;
  g.fillStyle   = colorHex;
  g.fillText(text, W/2, H/2);
  g.fillText(text, W/2, H/2);

  g.shadowColor = '#ffffff';
  g.shadowBlur  = 12;
  g.fillStyle   = '#ffffff';
  g.fillText(text, W/2, H/2);

  const t = new THREE.CanvasTexture(c);
  if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = 8;
  return t;
}

/* =========================================================
   3. 灯光
   ========================================================= */
const ambient = new THREE.AmbientLight(0x18202c, 0.55);
scene.add(ambient);

const moon = new THREE.DirectionalLight(0x3a5a8a, 0.22);
moon.position.set(-40, 60, -50);
scene.add(moon);

/* --- 手电筒 --- */
const torch = new THREE.SpotLight(0xfff2d6, 5.2, 30, Math.PI / 8, 0.42, 1.5);
torch.position.set(0.22, -0.18, 0);
/* 【性能修复】关闭聚光灯阴影 */
torch.castShadow = false;
torch.target.position.set(0, 0, -1);
camera.add(torch);
camera.add(torch.target);

const torchFill = new THREE.PointLight(0xffe9c4, 1.15, 5.5, 1.7);
torchFill.position.set(0.1, -0.1, -0.3);
camera.add(torchFill);

/* --- 体积光锥 --- */
(function(){
  const coneGeo = new THREE.ConeGeometry(2.6, 11, 24, 1, true);
  const coneMat = new THREE.MeshBasicMaterial({
    color: 0xfff0cc,
    transparent: true,
    opacity: 0.022,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    fog: false
  });
  const cone = new THREE.Mesh(coneGeo, coneMat);
  cone.rotation.x = Math.PI / 2;

/* =========================================================
   8. 课代表（临时占位点 —— 第三步将替换为出生点）
   ========================================================= */
const REP_DEFS = [
  { key:0, name:"课代表A", pos:new THREE.Vector3(-20, 3 * FLOOR_H, -7) },
  { key:1, name:"课代表B", pos:new THREE.Vector3(  8, 3 * FLOOR_H, -7) },
  { key:2, name:"课代表C", pos:new THREE.Vector3( 20, 3 * FLOOR_H, -7) }
];

const REP_COLOR = [0x5fe8ff, 0xa78bff, 0x66ffb0];

const REPS = [];

REP_DEFS.forEach(function(def, idx){
  const group = new THREE.Group();
  group.position.copy(def.pos);
  scene.add(group);

  const color = REP_COLOR[idx % REP_COLOR.length];

  // 主体八面体
  const core = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.42, 0),
    new THREE.MeshStandardMaterial({
      color: color,
      emissive: color,
      emissiveIntensity: 1.5,
      roughness: 0.25,
      metalness: 0.5,
      flatShading: true
    })
  );
  core.position.y = 1.05;
  group.add(core);

  // 外圈线框
  const cage = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.66, 0),
    new THREE.MeshBasicMaterial({
      color: color,
      wireframe: true,
      transparent: true,
      opacity: 0.45,
      fog: false
    })
  );
  cage.position.y = 1.05;
  group.add(cage);

  // 光晕
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTex,
    color: color,
    transparent: true,
    opacity: 0.85,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    fog: false
  }));
  glow.scale.set(3.4, 3.4, 1);
  glow.position.y = 1.05;
  group.add(glow);

  // 点光源
  const pl = new THREE.PointLight(color, 1.1, 8, 2);
  pl.position.y = 1.05;
  group.add(pl);

  // 地面光圈
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.72, 0.94, 40),
    new THREE.MeshBasicMaterial({
      color: color,
      transparent: true,
      opacity: 0.5,
      side: THREE.DoubleSide,
      depthWrite: false,
      fog: false
    })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.03;
  group.add(ring);

  REPS.push({
    def   : def,
    group : group,
    core  : core,
    cage  : cage,
    glow  : glow,
    ring  : ring,
    done  : false,
    phase : Math.random() * Math.PI * 2
  });
});

  const card = (QUIZ.cursorSide === 'left') ? optLEl : optREl;
  const cr = card.getBoundingClientRect();
  const qr = quizEl.getBoundingClientRect();

  const cw = qCursorEl.offsetWidth  || 26;
  const ch = qCursorEl.offsetHeight || 32;

  let left = cr.left - qr.left + 12;
  let top  = cr.top  - qr.top + (cr.height - ch) / 2;

  // 越界保护
  if (left < 4) left = 4;
  if (top < 0) top = 0;

  qCursorEl.style.left = left + 'px';
  qCursorEl.style.top  = top  + 'px';
}

function setCursorSide(side){
  if (QUIZ.cursorSide === side) return;
  QUIZ.cursorSide = side;
  positionCursor();
}

/* ---------- 渲染题目 ---------- */
function renderQuestion(){
  const set = QUESTION_BANK[QUIZ.setIndex];
  const q   = set.questions[QUIZ.qIndex];

  qProgEl.textContent  = '第 ' + (QUIZ.qIndex + 1) + ' / ' + set.questions.length + ' 题';
  qTitleEl.textContent = set.name;
  qTextEl.textContent  = q.q;
  qTextEl.scrollTop    = 0;

  /* 抽取正确项 + 一个干扰项 */
  const correctText = q.o[q.a];

  /* 【修复】干扰项按文本去重，避免左右显示相同内容 */
  let wrongIdx = -1;
  let guard = 0;
  while (guard++ < 80){
    const wi = Math.floor(Math.random() * q.o.length);
    if (wi !== q.a && q.o[wi] && q.o[wi] !== correctText){
      wrongIdx = wi;
      break;
    }
  }
  const wrongText = (wrongIdx >= 0) ? q.o[wrongIdx] : '——';

  /* 随机左右 */
  const correctOnLeft = Math.random() < 0.5;
  QUIZ.leftIsCorrect  = correctOnLeft;

  optLTxtEl.textContent = correctOnLeft ? correctText : wrongText;
  optRTxtEl.textContent = correctOnLeft ? wrongText  : correctText;

  optLEl.classList.remove('ok', 'bad');
  optREl.classList.remove('ok', 'bad');

  /* 光标随机初始位置 */
  QUIZ.cursorSide = Math.random() < 0.5 ? 'left' : 'right';

  requestAnimationFrame(function(){
    requestAnimationFrame(positionCursor);
  });
}

/* ---------- 开始答题 ---------- */
function startQuiz(setIndex){
  if (QUIZ.active) return;

  QUIZ.active       = true;
  QUIZ.locked       = false;
  QUIZ.setIndex     = setIndex;
  QUIZ.qIndex       = 0;
  QUIZ.correctCount = 0;

  // 清空输入
  lookTouch = null;
  moveTouch = null;
  joy.x = 0; joy.y = 0; joy.active = false;
  stickEl.style.opacity = '0';
  knobEl.style.transform = 'translate(0px,0px)';

  quizEl.classList.add('on');
  renderQuestion();
}

/* ---------- 提交答案 ---------- */
function submitAnswer(side){
  if (!QUIZ.active || QUIZ.locked) return;
  QUIZ.locked = true;

  const isCorrect = (side === 'left') ? QUIZ.leftIsCorrect : !QUIZ.leftIsCorrect;
  const card = (side === 'left') ? optLEl : optREl;
  const other = (side === 'left') ? optREl : optLEl;

  if (isCorrect){
    card.classList.add('ok');
    QUIZ.correctCount++;
  } else {
    card.classList.add('bad');
    // 同时把正确的那一项也标绿，便于学习
    other.classList.add('ok');
  }

  setTimeout(function(){
    card.classList.remove('ok', 'bad');
    other.classList.remove('ok', 'bad');
    nextQuestion();
  }, isCorrect ? 380 : 780);
}

/* ---------- 下一题 ---------- */
function nextQuestion(){
  QUIZ.qIndex++;

  const set = QUESTION_BANK[QUIZ.setIndex];

  if (QUIZ.qIndex >= set.questions.length){
    finishQuiz();
    return;
  }

  renderQuestion();
  QUIZ.locked = false;
}

/* ---------- 结束本轮 ---------- */
function finishQuiz(){
  QUIZ.locked = true;

  const set = QUESTION_BANK[QUIZ.setIndex];
  const total = set.questions.length;
  const right = QUIZ.correctCount;

  const rep = REPS[QUIZ.setIndex];
  if (rep){
    rep.done = true;
    rep.group.visible = false;
  }

  const remain = REPS.filter(function(r){ return !r.done; }).length;

  setTimeout(function(){
    QUIZ.active = false;
    quizEl.classList.remove('on');

    if (remain > 0){
      showToast(set.name + ' 完成 · 答对 ' + right + '/' + total + ' · 剩余课代表 ' + remain, 2600);
    } else {
      showToast('三位课代表全部完成 · 前往一楼大门撤离', 3200);
    }
  }, 520);
}

/* =========================================================
   10. 答题界面输入（滑动切换 + 点击确认）
   ========================================================= */
let qStartX = 0, qStartY = 0, qMoved = false, qDown = false;

function quizTouchStart(e){
  if (!QUIZ.active) return;
  e.preventDefault();
  const t = e.changedTouches[0];
  qStartX = t.clientX;
  qStartY = t.clientY;
  qMoved  = false;
  qDown   = true;
}

function quizTouchMove(e){
  if (!QUIZ.active || !qDown) return;
  e.preventDefault();

  const t = e.changedTouches[0];
  const dx = t.clientX - qStartX;
  const dy = t.clientY - qStartY;

  if (Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(dy)){
    if (dx > 0){
      setCursorSide('right');
    } else {
      setCursorSide('left');
    }
    // 允许连续切换
    qStartX = t.clientX;
    qStartY = t.clientY;
    qMoved  = true;
  }
}

function quizTouchEnd(e){
  if (!QUIZ.active || !qDown) return;
  e.preventDefault();
  qDown = false;

  if (!qMoved){
    submitAnswer(QUIZ.cursorSide);
  }
}

quizEl.addEventListener('touchstart', quizTouchStart, { passive:false });
quizEl.addEventListener('touchmove',  quizTouchMove,  { passive:false });
quizEl.addEventListener('touchend',   quizTouchEnd,   { passive:false });
quizEl.addEventListener('touchcancel',function(e){
  e.preventDefault(); qDown = false; qMoved = false;
}, { passive:false });

/* 鼠标（桌面调试）：点击卡片直接选择 */
optLEl.addEventListener('click', function(){
  if (!QUIZ.active || QUIZ.locked) return;
  setCursorSide('left');
  submitAnswer('left');
});
optREl.addEventListener('click', function(){
  if (!QUIZ.active || QUIZ.locked) return;
  setCursorSide('right');
  submitAnswer('right');
});

/* =========================================================
   11. 输入系统
   ========================================================= */
const stickEl = document.getElementById('stick');
const knobEl  = document.getElementById('knob');
const START   = document.getElementById('start');

let lookTouch = null;
let moveTouch = null;

const STICK_R = 55;

function onTouchStart(e){
  if (QUIZ.active) return;
  e.preventDefault();

  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    const isLeftBottom = (x < window.innerWidth * 0.42) &&
                         (y > window.innerHeight * 0.40);

    if (isLeftBottom && !moveTouch){
      moveTouch = { id: t.identifier, ox: x, oy: y };
      joy.active = true;
      stickEl.style.left = (x - 60) + 'px';
      stickEl.style.top  = (y - 60) + 'px';
      stickEl.style.opacity = '1';
      knobEl.style.transform = 'translate(0px,0px)';
    } else if (!lookTouch){
      lookTouch = { id: t.identifier, x: x, y: y };
    }
  }
}

function onTouchMove(e){
  if (QUIZ.active) return;
  e.preventDefault();

  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    const x = t.clientX, y = t.clientY;

    if (moveTouch && t.identifier === moveTouch.id){
      let dx = x - moveTouch.ox;
      let dy = y - moveTouch.oy;
      const len = Math.hypot(dx, dy);
      if (len > STICK_R){
        dx = dx / len * STICK_R;
        dy = dy / len * STICK_R;
      }
      knobEl.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      joy.x = dx / STICK_R;
      joy.y = -dy / STICK_R;
    }

    if (lookTouch && t.identifier === lookTouch.id){
      const dx = x - lookTouch.x;
      const dy = y - lookTouch.y;
      player.yaw   -= dx * LOOK_SENS;
      player.pitch -= dy * LOOK_SENS;
      player.pitch  = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, player.pitch));
      lookTouch.x = x;
      lookTouch.y = y;
    }
  }
}

function onTouchEnd(e){
  if (QUIZ.active) return;
  e.preventDefault();

  for (let i = 0; i < e.changedTouches.length; i++){
    const t = e.changedTouches[i];

    if (moveTouch && t.identifier === moveTouch.id){
      moveTouch = null;
      joy.x = 0; joy.y = 0;
      joy.active = false;
      stickEl.style.opacity = '0';
      knobEl.style.transform = 'translate(0px,0px)';
    }
    if (lookTouch && t.identifier === lookTouch.id){
      lookTouch = null;
    }
  }
}

canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove',  onTouchMove,  { passive: false });
canvas.addEventListener('touchend',   onTouchEnd,   { passive: false });
canvas.addEventListener('touchcancel',onTouchEnd,   { passive: false });

/* ---------- 桌面调试 ---------- */
let mouseDown = false;
let lastMX = 0, lastMY = 0;
const keys = {};

canvas.addEventListener('mousedown', function(e){
  if (QUIZ.active) return;
  mouseDown = true; lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('mouseup', function(){ mouseDown = false; });
window.addEventListener('mousemove', function(e){
  if (!mouseDown || QUIZ.active) return;
  const dx = e.clientX - lastMX;
  const dy = e.clientY - lastMY;
  player.yaw   -= dx * LOOK_SENS;
  player.pitch -= dy * LOOK_SENS;
  player.pitch  = Math.max(-PITCH_LIM, Math.min(PITCH_LIM, player.pitch));
  lastMX = e.clientX; lastMY = e.clientY;
});
window.addEventListener('keydown', function(e){
  keys[e.code] = true;

  if (!QUIZ.active) return;

  if (e.code === 'ArrowLeft' || e.code === 'KeyA'){
    setCursorSide('left');
  } else if (e.code === 'ArrowRight' || e.code === 'KeyD'){
    setCursorSide('right');
  } else if (e.code === 'Enter' || e.code === 'Space' || e.code === 'ArrowUp'){
    submitAnswer(QUIZ.cursorSide);
  }
  if (e.code === 'Enter' || e.code === 'Space'){
    e.preventDefault();
  }
});
window.addEventListener('keyup', function(e){
  keys[e.code] = false;
});

/* ---------- 禁止缩放 / 长按 ---------- */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('contextmenu',  function(e){ e.preventDefault(); });
document.addEventListener('dblclick',     function(e){ e.preventDefault(); });

/* =========================================================
   12. 地面高度查询
   ========================================================= */
function groundAt(x, z, currentY){
  let best = null;
  let bestD = 1.4;

  for (let i = 0; i < AREAS.length; i++){
    const a = AREAS[i];
    if (x < a.x1 || x > a.x2 || z < a.z1 || z > a.z2) continue;

    let y = a.y;
    if (a.ramp) y = a.ramp(x, z);

    const d = Math.abs(y - currentY);
    if (d < bestD){
      bestD = d;
      best = y;
    }
  }
  return best;
}

/* =========================================================
   12.1 【新增】楼梯检测
   ---------------------------------------------------------
   玩家进入楼梯触发区后，把 groundY 切换到目标楼层，
   同时水平位移到 exitX，离开触发区。
   相机 y 由 updatePlayer 的插值平滑过渡，视觉上像走楼梯。
   ========================================================= */
function checkStairs(dt){
  if (stairCooldown > 0) stairCooldown -= dt;
  if (QUIZ.active || stairCooldown > 0) return;

  for (let i = 0; i < STAIRS.length; i++){
    const s = STAIRS[i];

    if (Math.abs(player.groundY - s.y) > 0.4) continue;
    if (player.pos.x < s.x1 || player.pos.x > s.x2) continue;
    if (player.pos.z < s.z1 || player.pos.z > s.z2) continue;

    player.groundY = s.to;
    player.pos.x   = s.exitX;
    stairCooldown  = 0.9;

    const nf = Math.round(s.to / FLOOR_H) + 1;
    showToast('已到达 ' + nf + ' 楼', 1200);
    return;
  }
}

/* =========================================================
   12.2 【新增】一楼撤离判定
   ========================================================= */
let ESCAPED = false;
const winEl     = document.getElementById('win');
const winStatEl = document.getElementById('winStat');

function checkEscape(){
  if (ESCAPED || QUIZ.active) return;
  if (REPS.some(function(r){ return !r.done; })) return;
  if (Math.abs(player.groundY) > 0.6) return;
  if (player.pos.z > -10.5) return;
  if (player.pos.x < -6.5 || player.pos.x > 6.5) return;

  ESCAPED = true;
  winStatEl.textContent = '三份答卷 · 全部提交';
  winEl.classList.add('on');
}

document.getElementById('againBtn').addEventListener('click', function(){
  window.location.reload();
});

/* =========================================================
   13. 主循环
   ========================================================= */
const clock = new THREE.Clock();
let torchFlicker = 1;
let flickerTimer = 0;

function updateTorch(dt){
  flickerTimer -= dt;
  if (flickerTimer <= 0){
    flickerTimer = 0.06 + Math.random() * 0.18;
    torchFlicker = 0.86 + Math.random() * 0.22;
  }

  const breathe = 1 + Math.sin(performance.now() * 0.0016) * 0.035;
  torch.intensity     = 5.2  * breathe * torchFlicker;
  torchFill.intensity = 1.15 * breathe * torchFlicker;

  torch.position.x = 0.22 + Math.sin(performance.now() * 0.0022) * 0.02;
  torch.position.y = -0.18 + Math.cos(performance.now() * 0.0019) * 0.018;
}

/* ---------- 玩家更新 ---------- */
function updatePlayer(dt){
  if (QUIZ.active){
    camera.position.set(player.pos.x, player.pos.y + player.bobY, player.pos.z);
    camera.rotation.set(player.pitch, player.yaw, 0);
    return;
  }

  let ix = joy.x;
  let iy = joy.y;

  if (keys['KeyW'] || keys['ArrowUp'])    iy += 1;
  if (keys['KeyS'] || keys['ArrowDown'])  iy -= 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  ix -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) ix += 1;

  const mag = Math.hypot(ix, iy);
  if (mag > 1){
    ix /= mag; iy /= mag;
  }

  const moving = (Math.abs(ix) > 0.02 || Math.abs(iy) > 0.02);

  if (moving){
    const sinY = Math.sin(player.yaw);
    const cosY = Math.cos(player.yaw);

    const fx = -sinY, fz = -cosY;
    const rx =  cosY, rz = -sinY;

    const vx = (fx * iy + rx * ix) * MOVE_SPEED * dt;
    const vz = (fz * iy + rz * ix) * MOVE_SPEED * dt;

    const nx = player.pos.x + vx;
    const nz = player.pos.z + vz;

    let g = groundAt(nx, nz, player.groundY);

    if (g !== null){
      player.pos.x = nx;
      player.pos.z = nz;
      player.groundY = g;
    } else {
      g = groundAt(nx, player.pos.z, player.groundY);
      if (g !== null){
        player.pos.x = nx;
        player.groundY = g;
      } else {
        g = groundAt(player.pos.x, nz, player.groundY);
        if (g !== null){
          player.pos.z = nz;
          player.groundY = g;
        }
      }
    }

    player.bobT += dt * 9.5;
    player.bobY = Math.sin(player.bobT) * 0.045;
  } else {
    player.bobT = 0;
    player.bobY += (0 - player.bobY) * Math.min(1, dt * 8);
  }

  const targetY = player.groundY + EYE_H;
  player.pos.y += (targetY - player.pos.y) * Math.min(1, dt * 14);

  camera.position.set(
    player.pos.x,
    player.pos.y + player.bobY,
    player.pos.z
  );
  camera.rotation.set(player.pitch, player.yaw, 0);

  const f = Math.round(player.groundY / FLOOR_H);
  const names = ['一楼走廊', '二楼走廊', '三楼走廊', '四楼走廊'];
  const el = document.getElementById('hudFloor');
  const label = names[f] || '';
  if (el && el.textContent !== label) el.textContent = label;
}

/* ---------- 课代表动画 & 触发 ---------- */
function updateReps(dt, t){
  for (let i = 0; i < REPS.length; i++){
    const r = REPS[i];
    if (r.done) continue;

    const ph = t * 1.6 + r.phase;

    r.core.position.y = 1.05 + Math.sin(ph) * 0.14;
    r.core.rotation.y += dt * 1.1;
    r.core.rotation.x += dt * 0.45;

    r.cage.position.y = r.core.position.y;
    r.cage.rotation.y -= dt * 0.7;
    r.cage.rotation.z += dt * 0.35;

    r.glow.position.y = r.core.position.y;
    const sc = 3.2 + Math.sin(ph * 1.3) * 0.45;
    r.glow.scale.set(sc, sc, 1);

    const pulse = 0.4 + Math.abs(Math.sin(ph * 0.9)) * 0.35;
    r.ring.material.opacity = pulse;
    r.ring.scale.setScalar(1 + Math.sin(ph * 1.7) * 0.06);
  }
}

function checkTriggers(){
  if (QUIZ.active || ESCAPED) return;

  for (let i = 0; i < REPS.length; i++){
    const r = REPS[i];
    if (r.done) continue;

    const dx = player.pos.x - r.def.pos.x;
    const dz = player.pos.z - r.def.pos.z;
    const dy = player.groundY - r.def.pos.y;

    if (dx * dx + dz * dz < 2.7 * 2.7 && Math.abs(dy) < 1.2){
      startQuiz(i);
      return;
    }
  }
}

/* ---------- 主循环 ---------- */
function animate(){
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const t  = performance.now() * 0.001;

  updatePlayer(dt);
  updateTorch(dt);
  updateReps(dt, t);
  checkTriggers();
  checkStairs(dt);
  checkEscape();

  renderer.render(scene, camera);
}
animate();

/* =========================================================
   14. 窗口尺寸
   ========================================================= */
function onResize(){
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);

  if (QUIZ.active){
    requestAnimationFrame(positionCursor);
  }
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', function(){
  setTimeout(onResize, 260);
});
onResize();

/* =========================================================
   15. 开始遮罩
   ========================================================= */
document.getElementById('startBtn').addEventListener('click', function(){
  START.style.opacity = '0';
  setTimeout(function(){
    START.style.display = 'none';
  }, 520);

  const el = document.documentElement;
  if (el.requestFullscreen) {
    el.requestFullscreen().catch(function(){});
  } else if (el.webkitRequestFullscreen) {
    try { el.webkitRequestFullscreen(); } catch(err){}
  }

  setTimeout(function(){
    showToast('找到 3 位课代表并完成答题', 2600);
  }, 900);
});

})();
