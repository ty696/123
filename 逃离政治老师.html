<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>逃离政治老师</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;
  font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  touch-action:none;overscroll-behavior:none;}
#c{position:fixed;inset:0;display:block;width:100%;height:100%;background:#000;}
#stick{position:fixed;left:-200px;top:-200px;width:130px;height:130px;border-radius:50%;
  border:2px solid rgba(110,160,210,.3);background:radial-gradient(circle,rgba(30,50,75,.35),rgba(10,18,28,.15));
  z-index:20;pointer-events:none;opacity:0;transition:opacity .15s;box-shadow:0 0 24px rgba(0,0,0,.6) inset;}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(170,215,255,.55),rgba(60,110,160,.35));
  border:2px solid rgba(160,210,255,.55);box-shadow:0 0 20px rgba(100,180,255,.45);will-change:transform;}
#stick.sprint{border-color:rgba(255,180,80,.7);box-shadow:0 0 32px rgba(255,150,60,.6) inset;}
#stick.sprint #knob{background:radial-gradient(circle at 35% 30%,rgba(255,220,160,.75),rgba(200,120,40,.5));
  border-color:rgba(255,200,120,.85);}
#sprintTag{position:fixed;left:50%;bottom:11%;transform:translateX(-50%);z-index:22;
  padding:6px 18px;border-radius:4px;background:rgba(120,50,10,.7);
  border:1px solid rgba(255,180,80,.7);color:#ffd9a0;font-size:13px;letter-spacing:4px;
  text-shadow:0 0 12px rgba(255,180,80,.9);opacity:0;pointer-events:none;transition:opacity .15s;}
#sprintTag.on{opacity:1;}
#cross{position:fixed;left:50%;top:50%;width:5px;height:5px;margin:-2.5px 0 0 -2.5px;
  border-radius:50%;background:rgba(200,230,255,.45);box-shadow:0 0 6px rgba(150,200,255,.7);
  z-index:10;pointer-events:none;}
#vignette{position:fixed;inset:0;z-index:8;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 32%,rgba(0,0,0,.35) 62%,rgba(0,0,0,.82) 100%);
  transition:background 1.6s;}
#vignette.dark{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 10%,rgba(0,0,0,.75) 38%,rgba(0,0,0,.99) 100%);}
#hud{position:fixed;left:0;right:0;top:0;padding:10px 16px;z-index:12;pointer-events:none;
  display:flex;justify-content:space-between;align-items:flex-start;font-size:13px;
  letter-spacing:1px;color:#7fa6c8;text-shadow:0 0 8px rgba(80,160,255,.5);}
#hud .tag{background:rgba(10,20,32,.55);border:1px solid rgba(80,140,200,.28);
  border-radius:4px;padding:4px 10px;}
#hud .tag.warn{color:#ffb0b0;border-color:rgba(255,90,90,.7);text-shadow:0 0 12px rgba(255,90,90,.9);animation:bl 1s infinite;}
@keyframes bl{0%,100%{opacity:1;}50%{opacity:.4;}}
#start,#end,#dead{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;transition:opacity .5s;}
#start{background:radial-gradient(ellipse at center,#0a1018 0%,#000 80%);color:#9fc4e0;}
#end,#dead{display:none;}
#end.on,#dead.on{display:flex;}
#end{background:radial-gradient(ellipse at center,#04140c 0%,#000 82%);color:#9fe0c0;z-index:66;}
#dead{background:radial-gradient(ellipse at center,#200000 0%,#000 82%);color:#ffb0b0;z-index:68;}
#start h1{font-size:30px;letter-spacing:8px;color:#d8ecff;text-shadow:0 0 20px rgba(90,170,255,.8),0 0 44px rgba(60,120,200,.5);}
#start .sub{font-size:12px;letter-spacing:3px;color:#5b7f9c;}
#start .hint{font-size:12px;letter-spacing:2px;color:#486a86;line-height:2;text-align:center;max-width:80%;}
#start .err{font-size:13px;color:#ff9aa6;line-height:1.7;text-align:center;max-width:80%;}
#start .btn,#end .btn,#dead .btn{margin-top:12px;padding:12px 40px;border-radius:6px;
  font-size:15px;letter-spacing:6px;cursor:pointer;}
#start .btn{border:1px solid rgba(110,180,255,.55);color:#cfe8ff;background:rgba(30,70,120,.28);
  box-shadow:0 0 24px rgba(60,140,220,.35);}
#end h1{font-size:34px;letter-spacing:12px;color:#c9ffe4;text-shadow:0 0 22px rgba(90,255,180,.85),0 0 48px rgba(40,180,120,.5);}
#end .sub{font-size:13px;letter-spacing:3px;color:#4f9070;}
#end .stat{margin-top:6px;font-size:15px;letter-spacing:3px;color:#8fd8b4;}
#end .btn{border:1px solid rgba(110,255,190,.55);color:#d6ffee;background:rgba(20,90,60,.3);}
#dead h1{font-size:36px;letter-spacing:14px;color:#ffd0d0;text-shadow:0 0 24px rgba(255,60,60,.95),0 0 54px rgba(180,0,0,.7);}
#dead .sub{font-size:13px;letter-spacing:3px;color:#a06060;}
#dead .btn{border:1px solid rgba(255,120,120,.55);color:#ffd6d6;background:rgba(90,20,20,.35);}
#flash{position:fixed;inset:0;z-index:64;pointer-events:none;background:#000;opacity:0;
  transition:opacity 1.6s;}
#flash.on{opacity:1;}
#hunt{position:fixed;inset:0;z-index:62;pointer-events:none;opacity:0;transition:opacity .6s;
  background:radial-gradient(ellipse at 50% 50%,rgba(120,0,0,0) 30%,rgba(160,0,0,.35) 75%,rgba(90,0,0,.75) 100%);}
#hunt.on{opacity:1;}
#rotate{display:none;position:fixed;inset:0;z-index:200;background:#000;color:#7fa6c8;
  flex-direction:column;align-items:center;justify-content:center;gap:18px;font-size:16px;letter-spacing:3px;}
#rotate .ph{width:44px;height:76px;border:2px solid #3d607f;border-radius:8px;
  animation:rot 1.6s ease-in-out infinite;}
@keyframes rot{0%,40%{transform:rotate(0);}60%,100%{transform:rotate(90deg);}}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex;}}
#quiz{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;padding:12px 22px 8px;
  background:radial-gradient(ellipse at 50% 42%,rgba(10,26,44,.955) 0%,rgba(3,6,11,.985) 72%,rgba(0,0,0,.995) 100%);
  color:#bcd8ef;overflow:hidden;}
#quiz.on{display:flex;}
.q-head{display:flex;justify-content:space-between;align-items:center;
  font-size:clamp(11px,1.9vh,15px);letter-spacing:2px;color:#5f8db3;padding-bottom:6px;}
.q-head .q-title{color:#8ab4d6;}
.q-text{max-height:29vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(12,24,38,.62);border-left:3px solid #3d7fb8;border-radius:4px;
  padding:clamp(8px,1.6vh,16px) clamp(10px,1.6vw,20px);font-size:clamp(12px,2.15vh,17px);
  line-height:1.55;color:#cfe4f5;letter-spacing:.4px;box-shadow:0 0 22px rgba(30,80,140,.2) inset;}
.q-opts{flex:1;display:flex;gap:clamp(12px,2.6vw,34px);margin-top:clamp(8px,1.6vh,18px);min-height:0;}
.opt{flex:1;display:flex;align-items:center;position:relative;border:1.5px solid rgba(70,130,190,.34);
  border-radius:10px;padding:clamp(8px,1.6vh,18px) clamp(10px,1.4vw,18px) clamp(8px,1.6vh,18px) 46px;
  background:linear-gradient(180deg,rgba(14,28,46,.62),rgba(8,16,28,.48));
  box-shadow:0 0 20px rgba(0,0,0,.45) inset;transition:all .18s;overflow:hidden;cursor:pointer;}
.opt .opt-txt{font-size:clamp(11px,2vh,16px);line-height:1.5;color:#a9c9e2;word-break:break-word;}
.opt.ok{border-color:rgba(78,232,154,.95);background:linear-gradient(180deg,rgba(18,64,48,.72),rgba(10,34,26,.6));
  box-shadow:0 0 26px rgba(78,232,154,.42);}
.opt.ok .opt-txt{color:#b6ffe0;}
.opt.bad{border-color:rgba(255,90,110,.95);background:linear-gradient(180deg,rgba(70,20,28,.72),rgba(38,10,16,.6));
  box-shadow:0 0 26px rgba(255,90,110,.4);}
.opt.bad .opt-txt{color:#ffc4cc;}
.q-tip{text-align:center;font-size:clamp(10px,1.6vh,13px);letter-spacing:2px;color:#4a6d8c;
  padding-top:clamp(4px,1vh,12px);}
#qCursor{position:absolute;left:0;top:0;width:26px;height:32px;color:#5fe8ff;
  filter:drop-shadow(0 0 8px rgba(95,232,255,.95)) drop-shadow(0 0 18px rgba(60,180,255,.55));
  transition:left .15s cubic-bezier(.2,.8,.3,1),top .15s cubic-bezier(.2,.8,.3,1);
  pointer-events:none;animation:cb 1.15s infinite;z-index:3;}
@keyframes cb{0%,100%{opacity:1;}50%{opacity:.32;}}
#qCursor svg{display:block;width:100%;height:100%;}
#toast{position:fixed;left:50%;top:14%;transform:translate(-50%,-14px);z-index:70;
  padding:10px 22px;border:1px solid rgba(110,180,255,.45);border-radius:6px;
  background:rgba(8,20,34,.92);color:#cfe8ff;font-size:clamp(11px,1.9vh,15px);letter-spacing:2px;
  box-shadow:0 0 28px rgba(40,120,200,.45);opacity:0;pointer-events:none;
  transition:opacity .3s,transform .3s;white-space:nowrap;}
#toast.on{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vignette"></div>
<div id="cross"></div>
<div id="hunt"></div>
<div id="stick"><div id="knob"></div></div>
<div id="sprintTag">跑 起 来</div>
<div id="hud">
  <div class="tag" id="hudFloor">四楼走廊</div>
  <div class="tag" id="hudHint">左下摇杆移动 · 滑屏转视角</div>
</div>
<div id="toast"></div>
<div id="flash"></div>

<div id="quiz">
  <div class="q-head"><span id="qProg">第 1 / 15 题</span><span class="q-title" id="qTitle"></span></div>
  <div class="q-text" id="qText"></div>
  <div class="q-opts">
    <div class="opt" id="optL"><div class="opt-txt" id="optLTxt"></div></div>
    <div class="opt" id="optR"><div class="opt-txt" id="optRTxt"></div></div>
  </div>
  <div class="q-tip">← 左右滑动切换选项 · 点击屏幕确认 →</div>
  <div id="qCursor">
    <svg viewBox="0 0 32 40"><path d="M7 5 L26 20 L7 35" fill="none" stroke="currentColor"
      stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </div>
</div>

<div id="start">
  <h1>逃离政治老师</h1>
  <div class="sub">YIN XING LOU · BUILDING 2</div>
  <div class="hint">
    3 名课代表随机躲在主楼各层<br>
    找到 2 名答完题 · 灯会全灭 · 老师持戒尺现身<br>
    在黑暗里找到最后 1 名 · 完成答题<br>
    跑到校门口就能逃出去<br>
    <span style="color:#ffb070">摇杆推满 = 跑步</span>
  </div>
  <div class="btn" id="startBtn">点 击 进 入</div>
</div>
<div id="end">
  <h1>逃 出 去 了</h1>
  <div class="sub">大门在你身后缓缓合上</div>
  <div class="stat" id="endStat"></div>
  <div class="btn" id="againBtn">再 来 一 次</div>
</div>
<div id="dead">
  <h1>被 抓 住 了</h1>
  <div class="sub">戒尺落在肩上，你被拖回了教室……</div>
  <div class="btn" id="retryBtn">重 新 开 始</div>
</div>
<div id="rotate"><div class="ph"></div><div>请 横 屏 游 戏</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script>
(function(){
var START=document.getElementById('start'),BTN=document.getElementById('startBtn');
function enter(){
  START.style.opacity='0';
  setTimeout(function(){START.style.display='none';},520);
  try{var e=document.documentElement;
    if(e.requestFullscreen)e.requestFullscreen().catch(function(){});
    else if(e.webkitRequestFullscreen)e.webkitRequestFullscreen();
  }catch(x){}
  if(typeof THREE==='undefined'){
    setTimeout(function(){
      START.style.display='flex';START.style.opacity='1';
      START.innerHTML='<h1 style="color:#ff9aa6">加载失败</h1>'+
        '<div class="err">3D 引擎未能加载。<br>请检查网络后刷新。<br>（微信内请点右上角“在浏览器中打开”）</div>';
    },600);
  }
}
BTN.addEventListener('click',enter);
BTN.addEventListener('touchend',function(e){e.preventDefault();enter();},{passive:false});
document.getElementById('againBtn').addEventListener('click',function(){location.reload();});
document.getElementById('retryBtn').addEventListener('click',function(){location.reload();});
})();
</script>

<script>
(function(){
'use strict';
if(typeof THREE==='undefined')return;

/* ==================== 常量 ==================== */
var EYE_H=1.65, WALK=3.4, RUN=6.6, SENS=0.0042, PITCH_LIM=1.15;
var FLOOR_H=4, FLOORS=4;
var BX1=-28,BX2=28,BZO=-10,BZS=-4,BZB=10,BW=56;
/* 操场范围 */
var PLAY={x1:-44,x2:44,z1:-80,z2:-17};
/* 大门 */
var GATE_Z=-92;
/* 保安亭 */
var GUARD={x:16,z:-88};

/* ==================== 渲染器 ==================== */
var canvas=document.getElementById('c'), renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,powerPreference:'high-performance'});}
catch(e){
  document.getElementById('start').innerHTML='<h1 style="color:#ff9aa6">设备不支持</h1><div class="err">无法创建 WebGL。</div>';
  return;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight,false);
renderer.shadowMap.enabled=false;
if(THREE.sRGBEncoding!==undefined)renderer.outputEncoding=THREE.sRGBEncoding;

var scene=new THREE.Scene();
scene.background=new THREE.Color(0x04060a);
scene.fog=new THREE.FogExp2(0x04060a,0.022);

var camera=new THREE.PerspectiveCamera(76,innerWidth/innerHeight,0.06,400);
camera.rotation.order='YXZ';
scene.add(camera);

/* ==================== 纹理 ==================== */
function mkC(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function tFloor(){
  var c=mkC(256,256),g=c.getContext('2d');
  g.fillStyle='#15181e';g.fillRect(0,0,256,256);
  for(var i=0;i<4;i++)for(var j=0;j<4;j++){
    var v=30+Math.random()*12;
    g.fillStyle='rgb('+(v|0)+','+((v+3)|0)+','+((v+8)|0)+')';
    g.fillRect(i*64+1.5,j*64+1.5,61,61);
  }
  var im=g.getImageData(0,0,256,256),d=im.data;
  for(var k=0;k<d.length;k+=4){var nz=(Math.random()-.5)*26;d[k]+=nz;d[k+1]+=nz;d[k+2]+=nz;}
  g.putImageData(im,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(14,1.6);
  if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
function tWall(){
  var c=mkC(256,256),g=c.getContext('2d');
  g.fillStyle='#20242c';g.fillRect(0,0,256,256);
  g.fillStyle='#171a21';
  for(var j=0;j<256;j+=64)g.fillRect(0,j,256,3);
  g.fillStyle='rgba(14,16,20,.7)';
  for(var jj=0;jj<256;jj+=64){var off=(jj/64)%2===0?0:32;for(var i=off;i<256;i+=64)g.fillRect(i,jj,2,64);}
  var im=g.getImageData(0,0,256,256),d=im.data;
  for(var k=0;k<d.length;k+=4){var nz=(Math.random()-.5)*18;d[k]+=nz;d[k+1]+=nz;d[k+2]+=nz;}
  g.putImageData(im,0,0);
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(12,2);
  if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}
function tSign(text){
  var W=2048,H=512,c=mkC(W,H),g=c.getContext('2d');
  g.textAlign='center';g.textBaseline='middle';
  g.font='bold 290px "PingFang SC","Microsoft YaHei",sans-serif';
  var gs=[{b:90,c:'rgba(255,140,20,.85)'},{b:55,c:'rgba(255,190,60,.95)'},{b:26,c:'rgba(255,230,140,1)'}];
  for(var i=0;i<gs.length;i++){g.shadowColor=gs[i].c;g.shadowBlur=gs[i].b;g.fillStyle=gs[i].c;
    g.fillText(text,W/2,H/2);g.fillText(text,W/2,H/2);}
  g.shadowBlur=10;g.shadowColor='#fff6cc';g.fillStyle='#fffdf2';g.fillText(text,W/2,H/2);
  var t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;
  t.anisotropy=8;return t;
}
function tExit(){
  var c=mkC(256,128),g=c.getContext('2d');
  g.fillStyle='#031a0c';g.fillRect(0,0,256,128);
  g.fillStyle='#19ff7a';g.font='bold 62px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='center';g.textBaseline='middle';
  g.shadowColor='#19ff7a';g.shadowBlur=18;g.fillText('安全出口',128,64);
  var t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function tPlate(){
  var c=mkC(128,64),g=c.getContext('2d');
  g.fillStyle='#2a2f38';g.fillRect(0,0,128,64);
  g.strokeStyle='#454d59';g.lineWidth=3;g.strokeRect(2,2,124,60);
  g.fillStyle='#8fa6bd';g.font='bold 30px "PingFang SC","Microsoft YaHei",sans-serif';
  g.textAlign='center';g.textBaseline='middle';g.fillText('教室',64,34);
  var t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function tGlow(){
  var c=mkC(128,128),g=c.getContext('2d');
  var grd=g.createRadialGradient(64,64,0,64,64,64);
  grd.addColorStop(0,'rgba(255,255,255,1)');grd.addColorStop(.22,'rgba(170,235,255,.72)');
  grd.addColorStop(.55,'rgba(80,175,255,.2)');grd.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=grd;g.fillRect(0,0,128,128);
  var t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function tStair(txt,col){
  var W=512,H=256,c=mkC(W,H),g=c.getContext('2d');
  g.textAlign='center';g.textBaseline='middle';
  g.font='bold 130px "PingFang SC","Microsoft YaHei",sans-serif';
  g.shadowColor=col;g.shadowBlur=44;g.fillStyle=col;
  g.fillText(txt,W/2,H/2);g.fillText(txt,W/2,H/2);
  g.shadowColor='#fff';g.shadowBlur=12;g.fillStyle='#fff';g.fillText(txt,W/2,H/2);
  var t=new THREE.CanvasTexture(c);if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;
  t.anisotropy=8;return t;
}
function tTrack(){
  var c=mkC(256,256),g=c.getContext('2d');
  g.fillStyle='#5a2018';g.fillRect(0,0,256,256);
  for(var i=0;i<1000;i++){
    var r=90+Math.random()*50,b=40+Math.random()*30;
    g.fillStyle='rgba('+r+','+b+',30,'+(0.2+Math.random()*0.5)+')';
    g.fillRect(Math.random()*256,Math.random()*256,2,2);
  }
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(16,16);
  if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function tGrass(){
  var c=mkC(256,256),g=c.getContext('2d');
  g.fillStyle='#172412';g.fillRect(0,0,256,256);
  for(var i=0;i<2200;i++){
    var v=20+Math.random()*35;
    g.fillStyle='rgba('+(v*0.6|0)+','+v+','+(v*0.4|0)+','+(0.4+Math.random()*0.4)+')';
    g.fillRect(Math.random()*256,Math.random()*256,2,3);
  }
  var t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(20,20);
  if(THREE.sRGBEncoding!==undefined)t.encoding=THREE.sRGBEncoding;return t;
}
function tCourt(){
  var c=mkC(512,256),g=c.getContext('2d');
  g.fillStyle='#3a4048';g.fillRect(0,0,512,256);

/* ==================== 课代表（随机生成） ==================== */
/* 3 名课代表随机分布在不同楼层不同位置 */
var REP_COLOR=[0x5fe8ff,0xa78bff,0x66ffb0];
var REPS=[];
var repTriggerCooldown=0;

function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function spawnReps(){
  /* 从 4 层中挑 3 层（保证不同层，更难找） */
  var floors=[0,1,2,3];
  shuffle(floors);
  var chosen=[floors[0],floors[1],floors[2]];
  for(var i=0;i<3;i++){
    var f=chosen[i];
    /* x 在整个走廊范围随机，z 也随机 */
    var x=-22+Math.random()*44;
    var z=-9+Math.random()*3.5;
    var y=f*FLOOR_H;
    var g=new THREE.Group();
    g.position.set(x,y,z);
    scene.add(g);
    var color=REP_COLOR[i];
    /* 核心八面体 */
    var core=new THREE.Mesh(new THREE.OctahedronGeometry(.42,0),
      new THREE.MeshStandardMaterial({color:color,emissive:color,emissiveIntensity:1.5,
        roughness:.25,metalness:.5,flatShading:true}));
    core.position.y=1.05;g.add(core);
    /* 线框外圈 */
    var cage=new THREE.Mesh(new THREE.OctahedronGeometry(.66,0),
      new THREE.MeshBasicMaterial({color:color,wireframe:true,transparent:true,opacity:.45,fog:false}));
    cage.position.y=1.05;g.add(cage);
    /* 光晕 */
    var glow=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:color,
      transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
    glow.scale.set(3.4,3.4,1);glow.position.y=1.05;g.add(glow);
    /* 点光源 */
    var pl=new THREE.PointLight(color,1.1,8,2);
    pl.position.y=1.05;g.add(pl);
    /* 地面环 */
    var ring=new THREE.Mesh(new THREE.RingGeometry(.72,.94,40),
      new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.5,
        side:THREE.DoubleSide,depthWrite:false,fog:false}));
    ring.rotation.x=-Math.PI/2;ring.position.y=.03;g.add(ring);
    /* 头顶指示柱（给玩家一点视觉引导） */
    var beam=new THREE.Mesh(new THREE.CylinderGeometry(.25,.25,6,8,1,true),
      new THREE.MeshBasicMaterial({color:color,transparent:true,opacity:.12,
        side:THREE.DoubleSide,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));
    beam.position.y=3;g.add(beam);

    REPS.push({
      idx:i, group:g, core:core, cage:cage, glow:glow, ring:ring,
      def:{x:x,y:y,z:z}, done:false, phase:Math.random()*Math.PI*2
    });
  }
}
spawnReps();

/* ==================== 老师（追捕者） ==================== */
var teacher={
  group:null,pos:new THREE.Vector3(),speed:3.6,active:false,spawned:false,
  yaw:0,armSwing:0
};
function createTeacher(){
  var g=new THREE.Group();
  /* 身体 */
  var body=new THREE.Mesh(new THREE.BoxGeometry(.6,1.15,.32),M.darkCloth);
  body.position.y=1.05;g.add(body);
  /* 衬衫领口（点缀） */
  var collar=new THREE.Mesh(new THREE.BoxGeometry(.35,.2,.34),M.white);
  collar.position.y=1.55;g.add(collar);
  /* 头 */
  var head=new THREE.Mesh(new THREE.SphereGeometry(.22,16,12),M.skin);
  head.position.y=1.85;g.add(head);
  /* 头发（盖住头顶） */
  var hair=new THREE.Mesh(new THREE.SphereGeometry(.225,16,12,0,Math.PI*2,0,Math.PI/2.2),
    new THREE.MeshStandardMaterial({color:0x14100c,roughness:.9}));
  hair.position.y=1.87;g.add(hair);
  /* 左臂 */
  var armL=new THREE.Group();armL.position.set(-.42,1.4,0);g.add(armL);
  var armLm=new THREE.Mesh(new THREE.BoxGeometry(.18,.95,.18),M.darkCloth);
  armLm.position.y=-.4;armL.add(armLm);
  /* 右臂 */
  var armR=new THREE.Group();armR.position.set(.42,1.4,0);g.add(armR);
  var armRm=new THREE.Mesh(new THREE.BoxGeometry(.18,.95,.18),M.darkCloth);
  armRm.position.y=-.4;armR.add(armRm);
  /* 戒尺（右臂末端） */
  var ruler=new THREE.Mesh(new THREE.BoxGeometry(.06,.7,.14),M.ruler);
  ruler.position.set(0,-.95,0);armR.add(ruler);
  /* 腿 */
  var legL=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.2),M.grayCloth);
  legL.position.set(-.17,.5,0);g.add(legL);
  var legR=new THREE.Mesh(new THREE.BoxGeometry(.2,1,.2),M.grayCloth);
  legR.position.set(.17,.5,0);g.add(legR);
  /* 红光（轮廓识别） */
  var rl=new THREE.PointLight(0xff2020,1.5,7,1.6);
  rl.position.y=1.7;g.add(rl);
  /* 红光罩 */
  var aura=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,color:0xff2020,
    transparent:true,opacity:.55,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
  aura.scale.set(2.6,2.6,1);aura.position.y=1.4;g.add(aura);

  g.visible=false;
  scene.add(g);
  teacher.group=g;
  teacher.armL=armL;
  teacher.armR=armR;
  teacher.legL=legL;
  teacher.legR=legR;
}
createTeacher();

function spawnTeacher(){
  /* 在距离玩家 14-22m 的位置生成（同层或附近层） */
  var ang=Math.random()*Math.PI*2;
  var dist=14+Math.random()*8;
  var tx=player.pos.x+Math.cos(ang)*dist;
  var tz=player.pos.z+Math.sin(ang)*dist;
  /* 约束到主楼走廊范围 */
  tx=Math.max(BX1+2,Math.min(BX2-2,tx));
  tz=Math.max(BZO+1,Math.min(BZS-1,tz));
  teacher.pos.set(tx,player.groundY,tz);
  teacher.group.position.copy(teacher.pos);
  teacher.group.visible=true;
  teacher.active=true;
  teacher.spawned=true;
}

var qTextEl=document.getElementById('qText');

var optREl=document.getElementById('optR');

var optRTxtEl=document.getElementById('optRTxt');
var qCursorEl=document.getElementById('qCursor');

var QUIZ={active:false,locked:false,repIdx:-1,qIndex:0,cursorSide:'left',
  leftIsCorrect:true,correctCount:0};

var toastTimer=null;
function toast(msg,ms){
  toastEl.textContent=msg;toastEl.classList.add('on');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){toastEl.classList.remove('on');},ms||2200);
}

function positionCursor(){
  if(!QUIZ.active)return;
  var card=(QUIZ.cursorSide==='left')?optLEl:optREl;
  var cr=card.getBoundingClientRect(),qr=quizEl.getBoundingClientRect();
  var ch=qCursorEl.offsetHeight||32;
  var left=cr.left-qr.left+12;
  var top=cr.top-qr.top+(cr.height-ch)/2;
  if(left<4)left=4;if(top<0)top=0;
  qCursorEl.style.left=left+'px';qCursorEl.style.top=top+'px';
}
function setCursorSide(s){
  if(QUIZ.cursorSide===s)return;
  QUIZ.cursorSide=s;positionCursor();
}

function renderQuestion(){
  var set=QB[QUIZ.repIdx];
  var q=set.qs[QUIZ.qIndex];
  qProgEl.textContent='第 '+(QUIZ.qIndex+1)+' / '+set.qs.length+' 题';
  qTitleEl.textContent=set.name;
  qTextEl.textContent=q[0];
  qTextEl.scrollTop=0;
  /* 构建选项：正确 + 一个干扰 */
  var opts=q.slice(1,5), ans=q[5];
  var correctText=opts[ans];
  var wrongIdx=-1,guard=0;
  while(guard++<60){
    var wi=Math.floor(Math.random()*4);
    if(wi!==ans&&opts[wi]!==correctText){wrongIdx=wi;break;}
  }
  var wrongText=(wrongIdx>=0)?opts[wrongIdx]:'——';
  var correctOnLeft=Math.random()<.5;
  QUIZ.leftIsCorrect=correctOnLeft;
  optLTxtEl.textContent=correctOnLeft?correctText:wrongText;
  optRTxtEl.textContent=correctOnLeft?wrongText:correctText;
  optLEl.classList.remove('ok','bad');optREl.classList.remove('ok','bad');
  QUIZ.cursorSide=Math.random()<.5?'left':'right';
  requestAnimationFrame(function(){requestAnimationFrame(positionCursor);});
}

function startQuiz(repIdx){
  if(QUIZ.active)return;
  QUIZ.active=true;QUIZ.locked=false;QUIZ.repIdx=repIdx;QUIZ.qIndex=0;QUIZ.correctCount=0;
  lookTouch=null;moveTouch=null;joy.x=0;joy.y=0;joy.active=false;
  stickEl.style.opacity='0';knobEl.style.transform='translate(0px,0px)';
  quizEl.classList.add('on');
  renderQuestion();
}

function submitAnswer(side){
  if(!QUIZ.active||QUIZ.locked)return;
  QUIZ.locked=true;
  var correct=(side==='left')?QUIZ.leftIsCorrect:!QUIZ.leftIsCorrect;
  var card=(side==='left')?optLEl:optREl;
  var other=(side==='left')?optREl:optLEl;
  if(correct){card.classList.add('ok');QUIZ.correctCount++;}
  else{card.classList.add('bad');other.classList.add('ok');}
  setTimeout(function(){
    card.classList.remove('ok','bad');other.classList.remove('ok','bad');
    nextQuestion();
  },correct?380:780);
}

function nextQuestion(){
  QUIZ.qIndex++;
  var set=QB[QUIZ.repIdx];
  if(QUIZ.qIndex>=set.qs.length){finishQuiz();return;}
  renderQuestion();QUIZ.locked=false;
}

var TOTAL_REPS=3;
var DARK_TRIGGER=2; /* 答完2名触发变黑 */
var darkMode=false;
var escapeReady=false; /* 3名都答完，大门可开 */

function finishQuiz(){
  QUIZ.locked=true;
  var set=QB[QUIZ.repIdx];
  var right=QUIZ.correctCount;
  var rep=REPS[QUIZ.repIdx];
  if(rep){rep.done=true;rep.group.visible=false;}
  var doneCount=REPS.filter(function(r){return r.done;}).length;
  var remain=TOTAL_REPS-doneCount;

  setTimeout(function(){
    QUIZ.active=false;quizEl.classList.remove('on');
    if(remain>0){
      toast(set.name+' 完成 · 答对 '+right+'/'+set.qs.length+' · 剩余课代表 '+remain,2600);
    } else {
      toast('课代表全部答完 · 大门已开 · 快跑',3200);
      escapeReady=true;
    }
    /* 触发变黑 */
    if(doneCount>=DARK_TRIGGER&&!darkMode){
      triggerDark();
    }
  },520);
}

/* ==================== 输入系统 ==================== */
var stickEl=document.getElementById('stick');
var knobEl=document.getElementById('knob');
var sprintTag=document.getElementById('sprintTag');
var lookTouch=null,moveTouch=null;
var STICK_R=58;

function onTouchStart(e){
  if(QUIZ.active)return;e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    var x=t.clientX,y=t.clientY;
    var isLeftBottom=(x<innerWidth*0.42)&&(y>innerHeight*0.4);
    if(isLeftBottom&&!moveTouch){
      moveTouch={id:t.identifier,ox:x,oy:y};
      joy.active=true;
      stickEl.style.left=(x-65)+'px';
      stickEl.style.top=(y-65)+'px';
      stickEl.style.opacity='1';
      knobEl.style.transform='translate(0px,0px)';
    }else if(!lookTouch){
      lookTouch={id:t.identifier,x:x,y:y};
    }
  }
}
function onTouchMove(e){
  if(QUIZ.active)return;e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i],x=t.clientX,y=t.clientY;
    if(moveTouch&&t.identifier===moveTouch.id){
      var dx=x-moveTouch.ox,dy=y-moveTouch.oy;
      var len=Math.hypot(dx,dy);
      if(len>STICK_R){dx=dx/len*STICK_R;dy=dy/len*STICK_R;}
      knobEl.style.transform='translate('+dx+'px,'+dy+'px)';
      joy.x=dx/STICK_R;joy.y=-dy/STICK_R;
      var mag=Math.hypot(joy.x,joy.y);
      if(mag>0.85){
        if(!player.sprinting){
          player.sprinting=true;
          stickEl.classList.add('sprint');
          sprintTag.classList.add('on');
        }
      }else{
        if(player.sprinting){
          player.sprinting=false;
          stickEl.classList.remove('sprint');
          sprintTag.classList.remove('on');
        }
      }
    }
    if(lookTouch&&t.identifier===lookTouch.id){
      var ldx=x-lookTouch.x,ldy=y-lookTouch.y;
      player.yaw-=ldx*SENS;
      player.pitch-=ldy*SENS;
      player.pitch=Math.max(-PITCH_LIM,Math.min(PITCH_LIM,player.pitch));
      lookTouch.x=x;lookTouch.y=y;
    }
  }
}
function onTouchEnd(e){
  if(QUIZ.active)return;e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){
    var t=e.changedTouches[i];
    if(moveTouch&&t.identifier===moveTouch.id){
      moveTouch=null;joy.x=0;joy.y=0;joy.active=false;
      player.sprinting=false;
      stickEl.style.opacity='0';
      stickEl.classList.remove('sprint');
      sprintTag.classList.remove('on');
      knobEl.style.transform='translate(0px,0px)';
    }
    if(lookTouch&&t.identifier===lookTouch.id)lookTouch=null;
  }
}
canvas.addEventListener('touchstart',onTouchStart,{passive:false});
canvas.addEventListener('touchmove',onTouchMove,{passive:false});
canvas.addEventListener('touchend',onTouchEnd,{passive:false});
canvas.addEventListener('touchcancel',onTouchEnd,{passive:false});

/* ==================== 地面高度查询 ==================== */
function groundAt(x,z,curY){
  var best=null,bestD=1.4;
  for(var i=0;i<AREAS.length;i++){
    var a=AREAS[i];
    if(x<a.x1||x>a.x2||z<a.z1||z>a.z2)continue;
    var y=a.y;
    var d=Math.abs(y-curY);
    if(d<bestD){bestD=d;best=y;}
  }
  return best;
}

/* ==================== 楼梯检测 ==================== */
function checkStairs(dt){
  if(stairCooldown>0)stairCooldown-=dt;
  if(QUIZ.active||stairCooldown>0)return;
  for(var i=0;i<STAIRS.length;i++){
    var s=STAIRS[i];
    if(Math.abs(player.groundY-s.y)>0.4)continue;
    if(player.pos.x<s.x1||player.pos.x>s.x2)continue;
    if(player.pos.z<s.z1||player.pos.z>s.z2)continue;
    player.groundY=s.to;player.pos.x=s.exitX;stairCooldown=0.9;
    var nf=Math.round(s.to/FLOOR_H)+1;
    toast('已到达 '+nf+' 楼',1200);
    return;
  }
}

/* ==================== 老师更新 ==================== */
var caught=false;
function updateTeacher(dt){
  if(!teacher.active||caught)return;
  var dx=player.pos.x-teacher.pos.x;
  var dz=player.pos.z-teacher.pos.z;
  var dist=Math.hypot(dx,dz);
  if(dist<0.001)return;
  var nx=dx/dist,nz=dz/dist;
  /* 靠近玩家时减速（给玩家一点喘息） */
  var spd=teacher.speed*(dist<6?0.75:1);
  teacher.pos.x+=nx*spd*dt;
  teacher.pos.z+=nz*spd*dt;
  /* y 跟随玩家地面高度 */
  teacher.pos.y+=((player.groundY)-teacher.pos.y)*Math.min(1,dt*3);
  teacher.group.position.copy(teacher.pos);
  /* 面向玩家 */
  var targetYaw=Math.atan2(nx,nz);
  var diff=targetYaw-teacher.yaw;
  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;
  teacher.yaw+=diff*Math.min(1,dt*4);
  teacher.group.rotation.y=teacher.yaw;
  /* 手臂摆动 */
  teacher.armSwing+=dt*8;
  if(teacher.armL)teacher.armL.rotation.x=Math.sin(teacher.armSwing)*0.5;
  if(teacher.armR)teacher.armR.rotation.x=Math.sin(teacher.armSwing+Math.PI)*0.5;
  /* 距离越近，红色滤镜越重 */
  if(dist<10){
    huntEl.style.opacity=String(0.4+(1-dist/10)*0.6);
  }
  /* 抓到 */
  if(dist<1.3){
    caught=true;
    document.getElementById('dead').classList.add('on');
  }
}

/* ==================== 大门打开 & 逃出判定 ==================== */
var GATE_OPEN=false, gateOpenT=0;
function checkEscape(){
  /* 三名课代表都答完，大门可开 */
  if(escapeReady&&!GATE_OPEN){
    GATE_OPEN=true;
    toast('大门缓缓打开了……',2400);
  }
  /* 大门开启动画 */
  if(GATE_OPEN&&gateOpenT<1){
    gateOpenT=Math.min(1,gateOpenT+0.01);
    if(gateLeftPivot)gateLeftPivot.rotation.y=gateOpenT*Math.PI*0.55;
    if(gateRightPivot)gateRightPivot.rotation.y=-gateOpenT*Math.PI*0.55;
  }
  /* 玩家跑到大门外 */
  if(GATE_OPEN&&player.pos.z<GATE_Z+1&&Math.abs(player.pos.x)<8){
    document.getElementById('end').classList.add('on');
    document.getElementById('endStat').textContent='三份答卷 · 全部提交';
    /* 停住玩家 */
    caught=true;
  }
}

/* ==================== 主循环 ==================== */
var clock=new THREE.Clock();
var torchFlicker=1,flickerTimer=0;

function updateTorch(dt){
  flickerTimer-=dt;
  if(flickerTimer<=0){
    flickerTimer=0.06+Math.random()*0.18;
    torchFlicker=0.86+Math.random()*0.22;
  }
  var breathe=1+Math.sin(performance.now()*0.0016)*0.035;
  var base=darkMode?7.5:5.2;
  torch.intensity=base*breathe*torchFlicker;
  torchFill.intensity=(darkMode?1.6:1.15)*breathe*torchFlicker;
  torch.position.x=0.22+Math.sin(performance.now()*0.0022)*0.02;
  torch.position.y=-0.18+Math.cos(performance.now()*0.0019)*0.018;
}

function updatePlayer(dt){
  if(QUIZ.active||caught){
    camera.position.set(player.pos.x,player.pos.y+player.bobY,player.pos.z);
    camera.rotation.set(player.pitch,player.yaw,0);
    return;
  }
  var ix=joy.x,iy=joy.y;
  if(keys['KeyW']||keys['ArrowUp'])iy+=1;
  if(keys['KeyS']||keys['ArrowDown'])iy-=1;
  if(keys['KeyA']||keys['ArrowLeft'])ix-=1;
  if(keys['KeyD']||keys['ArrowRight'])ix+=1;
  if(keys['ShiftLeft']||keys['ShiftRight'])player.sprinting=true;
  var mag=Math.hypot(ix,iy);
  if(mag>1){ix/=mag;iy/=mag;}
  var moving=(Math.abs(ix)>0.02||Math.abs(iy)>0.02);
  var speed=player.sprinting?RUN:WALK;

  if(moving){
    var sinY=Math.sin(player.yaw),cosY=Math.cos(player.yaw);
    var fx=-sinY,fz=-cosY;
    var rx=cosY,rz=-sinY;
    var vx=(fx*iy+rx*ix)*speed*dt;
    var vz=(fz*iy+rz*ix)*speed*dt;
    var nx=player.pos.x+vx,nz=player.pos.z+vz;
    var g=groundAt(nx,nz,player.groundY);
    if(g!==null){player.pos.x=nx;player.pos.z=nz;player.groundY=g;}
    else{
      g=groundAt(nx,player.pos.z,player.groundY);
      if(g!==null){player.pos.x=nx;player.groundY=g;}
      else{
        g=groundAt(player.pos.x,nz,player.groundY);
        if(g!==null){player.pos.z=nz;player.groundY=g;}
      }
    }
    player.bobT+=dt*(player.sprinting?13:9.5);
    player.bobY=Math.sin(player.bobT)*(player.sprinting?0.06:0.045);
  }else{
    player.bobT=0;
    player.bobY+=(0-player.bobY)*Math.min(1,dt*8);
  }
  var targetY=player.groundY+EYE_H;
  player.pos.y+=(targetY-player.pos.y)*Math.min(1,dt*14);

  camera.position.set(player.pos.x,player.pos.y+player.bobY,player.pos.z);
  camera.rotation.set(player.pitch,player.yaw,0);

  /* HUD */
  var f=Math.round(player.groundY/FLOOR_H);
  var label;
  if(player.groundY<-0.3||player.pos.z<BZO-1){
    label=player.pos.z<GATE_Z+8?'校门口':'操场';
  }else{
    var names=['一楼走廊','二楼走廊','三楼走廊','四楼走廊'];
    label=names[f]||'';
  }
  if(hudFloorEl&&hudFloorEl.textContent!==label)hudFloorEl.textContent=label;
}

function updateReps(dt,t){
  for(var i=0;i<REPS.length;i++){
    var r=REPS[i];
    if(r.done)continue;
    var ph=t*1.6+r.phase;
    r.core.position.y=1.05+Math.sin(ph)*0.14;
    r.core.rotation.y+=dt*1.1;
    r.core.rotation.x+=dt*0.45;
    r.cage.position.y=r.core.position.y;
    r.cage.rotation.y-=dt*0.7;
    r.cage.rotation.z+=dt*0.35;
    r.glow.position.y=r.core.position.y;
    var sc=3.2+Math.sin(ph*1.3)*0.45;
    r.glow.scale.set(sc,sc,1);
    r.ring.material.opacity=0.4+Math.abs(Math.sin(ph*0.9))*0.35;
    r.ring.scale.setScalar(1+Math.sin(ph*1.7)*0.06);
  }
}

function checkTriggers(dt){
  if(repTriggerCooldown>0)repTriggerCooldown-=dt;
  if(QUIZ.active||caught||repTriggerCooldown>0)return;
  for(var i=0;i<REPS.length;i++){
    var r=REPS[i];
    if(r.done)continue;
    var dx=player.pos.x-r.def.x;
    var dz=player.pos.z-r.def.z;
    var dy=player.groundY-r.def.y;
    if(dx*dx+dz*dz<2.7*2.7&&Math.abs(dy)<1.2){
      startQuiz(i);
      repTriggerCooldown=1.5;
      return;
    }
  }
}

function animate(){
  requestAnimationFrame(animate);
  var dt=Math.min(clock.getDelta(),0.05);
  var t=performance.now()*0.001;
  updatePlayer(dt);
  updateTorch(dt);
  updateReps(dt,t);
  checkTriggers(dt);
  checkStairs(dt);
  if(darkMode)updateTeacher(dt);
  checkEscape();
  renderer.render(scene,camera);
}
animate();

/* ==================== 尺寸 ==================== */
function onResize(){
  var w=innerWidth,h=innerHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.setSize(w,h,false);
  if(QUIZ.active)requestAnimationFrame(positionCursor);
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',function(){setTimeout(onResize,260);});
onResize();

/* 开场提示 */
setTimeout(function(){
  if(typeof toast==='function')toast('3 名课代表躲在主楼各层 · 找找看',2800);
},900);

})();
</script>
