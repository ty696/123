<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏站</title>
<style>
* { -webkit-tap-highlight-color: transparent; }
html, body {
  background: #fff;
  color: #000;
  font-family: SimSun, "宋体", serif;
  font-size: 15px;
  margin: 0;
  padding: 0;
  overscroll-behavior: none;
}
body {
  max-width: 640px;
  margin: 0 auto;
  padding: 12px 12px 30px;
  box-sizing: border-box;
}
h1 {
  font-size: 19px;
  border-bottom: 1px solid #999;
  padding-bottom: 6px;
  margin: 6px 0 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
h1 a { color: #0000cc; text-decoration: none; font-size: 14px; padding: 4px 8px; }
h1 a:active { color: #ff0000; }
.page { display: none; }
.page.on { display: block; }
a { color: #0000cc; }
a:active { color: #ff0000; }
canvas {
  background: #000;
  border: 1px solid #999;
  touch-action: none;
  display: block;
  margin: 8px auto;
  width: 100%;
  max-width: 480px;
  height: auto;
}
.hud { text-align: center; margin: 6px 0; font-size: 15px; }
.center { text-align: center; }
.btn {
  font-family: inherit;
  font-size: 16px;
  padding: 10px 20px;
  margin: 8px 4px;
  border: 1px solid #999;
  background: #eee;
  cursor: pointer;
  text-decoration: none;
  color: #000;
  display: inline-block;
  -webkit-user-select: none;
  user-select: none;
  min-width: 100px;
}
.btn:active { background: #ccc; }
.sound-toggle {
  font-size: 13px;
  color: #555;
  padding: 4px 8px;
  border: 1px solid #999;
  background: #f5f5f5;
  cursor: pointer;
  margin-left: 8px;
}
ul.games { list-style: none; padding: 0; margin: 0; }
ul.games li { border-bottom: 1px dashed #ccc; padding: 14px 4px; }
ul.games a { font-size: 18px; font-weight: bold; text-decoration: none; }
.desc { color: #555; font-size: 13px; margin-top: 6px; line-height: 1.5; }
.pad {
  display: inline-grid;
  grid-template-columns: repeat(3, 68px);
  grid-template-rows: repeat(2, 68px);
  gap: 8px;
  margin: 10px auto;
  user-select: none;
  -webkit-user-select: none;
}
.pad button {
  font-size: 26px;
  font-family: inherit;
  background: #eee;
  border: 1px solid #999;
  cursor: pointer;
  border-radius: 4px;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}
.pad button:active { background: #ccc; }
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<div id="p-home" class="page on">
  <h1>游戏站 <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">🔊 音效开</button></h1>
  <ul class="games">
    <li>
      <a href="#" onclick="go('snake');return false;">贪吃蛇</a>
      <div class="desc">滑动屏幕或点方向键控制，撞墙或撞自己结束。</div>
    </li>
    <li>
      <a href="#" onclick="go('breakout');return false;">打砖块</a>
      <div class="desc">手指拖动底部挡板，把球弹回去打光砖块。</div>
    </li>
    <li>
      <a href="#" onclick="go('space');return false;">星际守卫</a>
      <div class="desc">手指拖动飞船，自动开火，躲开红色敌人。</div>
    </li>
  </ul>
</div>

<div id="p-snake" class="page">
  <h1>贪吃蛇 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="sScore">0</span>　最高：<span id="sBest">0</span></div>
  <canvas id="snakeC" width="400" height="400"></canvas>
  <div class="center">
    <div class="pad">
      <button class="up"    ontouchstart="sDir(0,-1);event.preventDefault();" onmousedown="sDir(0,-1)">↑</button>
      <button class="left"  ontouchstart="sDir(-1,0);event.preventDefault();" onmousedown="sDir(-1,0)">←</button>
      <button class="down"  ontouchstart="sDir(0,1);event.preventDefault();"  onmousedown="sDir(0,1)">↓</button>
      <button class="right" ontouchstart="sDir(1,0);event.preventDefault();"  onmousedown="sDir(1,0)">→</button>
    </div>
  </div>
  <div class="center"><button class="btn" onclick="sReset()">重新开始</button></div>
</div>

<div id="p-breakout" class="page">
  <h1>打砖块 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="bScore">0</span>　生命：<span id="bLives">3</span></div>
  <canvas id="brC" width="480" height="600"></canvas>
  <div class="center"><button class="btn" onclick="bReset()">重新开始</button></div>
</div>

<div id="p-space" class="page">
  <h1>星际守卫 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="spScore">0</span>　生命：<span id="spLives">3</span></div>
  <canvas id="spC" width="400" height="600"></canvas>
  <div class="center"><button class="btn" onclick="spReset()">重新开始</button></div>
</div>

<script>
document.addEventListener('gesturestart', function(e) { e.preventDefault(); });
document.addEventListener('touchmove', function(e) {
  if (e.target.tagName === 'CANVAS') e.preventDefault();
}, { passive: false });

// ============================================
// 音效系统（Web Audio API 合成）
// ============================================
var Sound = (function() {
  var ctx = null;
  var enabled = true;
  try {
    var saved = localStorage.getItem('sound_on');
    if (saved === '0') enabled = false;
  } catch(e) {}

  function init() {
    if (ctx) {
      if (ctx.state === 'suspended') ctx.resume();
      return;
    }
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { ctx = null; }
  }

  // 简单音：正弦/方波/锯齿 + 指数衰减
  function beep(freq, dur, type, vol, sweepTo) {
    if (!enabled || !ctx) return;
    try {
      var t = ctx.currentTime;
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = type || 'square';
      osc.frequency.setValueAtTime(freq, t);
      if (sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t + dur);
      gain.gain.setValueAtTime(vol || 0.05, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch(e) {}
  }

  // 噪声爆炸
  function noise(dur, vol, filterFreq) {
    if (!enabled || !ctx) return;
    try {
      var t = ctx.currentTime;
      var len = Math.floor(ctx.sampleRate * dur);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      }
      var src = ctx.createBufferSource();
      src.buffer = buf;
      var filter = ctx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = filterFreq || 1200;
      var gain = ctx.createGain();
      gain.gain.setValueAtTime(vol || 0.15, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
    } catch(e) {}
  }

  return {
    init: init,
    isOn: function() { return enabled; },
    toggle: function() {
      enabled = !enabled;
      try { localStorage.setItem('sound_on', enabled ? '1' : '0'); } catch(e) {}
      if (enabled) { init(); beep(880, 0.08, 'sine', 0.05); }
      return enabled;
    },
    // 各游戏音效
    snakeEat: function() { beep(880, 0.08, 'square', 0.04, 1200); },
    snakeTurn: function() { beep(600, 0.03, 'square', 0.02); },
    snakeDie: function() { beep(300, 0.4, 'sawtooth', 0.06, 80); noise(0.3, 0.1, 600); },
    brickHit: function() { beep(700, 0.06, 'square', 0.03, 900); },
    paddleHit: function() { beep(400, 0.06, 'square', 0.03, 500); },
    wallHit: function() { beep(300, 0.04, 'square', 0.02); },
    brickBreak: function() { beep(900, 0.08, 'square', 0.035, 1300); },
    loseLife: function() { beep(220, 0.3, 'sawtooth', 0.06, 100); },
    win: function() {
      beep(660, 0.1, 'sine', 0.05);
      setTimeout(function() { beep(880, 0.1, 'sine', 0.05); }, 100);
      setTimeout(function() { beep(1100, 0.15, 'sine', 0.05); }, 200);
    },
    shoot: function() { beep(1200, 0.03, 'square', 0.015, 800); },
    hitEnemy: function() { beep(500, 0.05, 'square', 0.025, 700); },
    explode: function() { noise(0.25, 0.12, 1000); beep(200, 0.2, 'sawtooth', 0.04, 80); },
    playerHit: function() { noise(0.4, 0.15, 800); beep(150, 0.4, 'sawtooth', 0.06, 60); }
  };
})();

function toggleSound() {
  Sound.init();
  var on = Sound.toggle();
  document.getElementById('soundBtn').textContent = on ? '🔊 音效开' : '🔇 音效关';
}

// 首次交互时初始化音频（绕过浏览器自动播放限制）
function initAudioOnce() {
  Sound.init();
  document.removeEventListener('touchstart', initAudioOnce);
  document.removeEventListener('mousedown', initAudioOnce);
  document.removeEventListener('click', initAudioOnce);
}
document.addEventListener('touchstart', initAudioOnce);
document.addEventListener('mousedown', initAudioOnce);
document.addEventListener('click', initAudioOnce);

// 更新首页按钮的初始文本
(function() {
  if (!Sound.isOn()) {
    document.getElementById('soundBtn').textContent = '🔇 音效关';
  }
})();

// ============ 页面切换 ============
function go(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('on'); });
  document.getElementById('p-' + name).classList.add('on');
  window.scrollTo(0, 0);

  if (name !== 'snake') sStop();
  if (name !== 'breakout') bStop();
  if (name !== 'space') spStop();

  if (name === 'snake') sReset();
  else if (name === 'breakout') bReset();
  else if (name === 'space') spReset();
}

// ============================================
// 贪吃蛇
// ============================================
var snake = { running: false, raf: null };
(function() {
  var cv = document.getElementById('snakeC');
  var cx = cv.getContext('2d');
  var G = 20, CELL = 20;
  var body, dir, nextDir, food, score, tickMs, lastTick, best = 0, dead = false;

  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch(e) {}
  document.getElementById('sBest').textContent = best;

  window.sDir = function(dx, dy) {
    if (!snake.running || dead) return;
    if (dx === -dir.x && dy === -dir.y) return;
    if (dx === dir.x && dy === dir.y) return;
    nextDir = { x: dx, y: dy };
  };

  window.sStop = function() {
    snake.running = false;
    if (snake.raf) { cancelAnimationFrame(snake.raf); snake.raf = null; }
  };

  window.sReset = function() {
    sStop();
    body = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0};
    nextDir = {x:1,y:0};
    score = 0;
    tickMs = 160;
    lastTick = 0;
    dead = false;
    snake.running = true;
    document.getElementById('sScore').textContent = '0';
    spawnFood();
    snake.raf = requestAnimationFrame(loop);
  };

  function spawnFood() {
    while (true) {
      var f = { x: Math.floor(Math.random()*G), y: Math.floor(Math.random()*G) };
      var ok = true;
      for (var i = 0; i < body.length; i++) {
        if (body[i].x === f.x && body[i].y === f.y) { ok = false; break; }
      }
      if (ok) { food = f; return; }
    }
  }

  function draw() {
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, 400, 400);
    cx.strokeStyle = '#222';
    for (var i = 1; i < G; i++) {
      cx.beginPath(); cx.moveTo(i*CELL, 0); cx.lineTo(i*CELL, 400); cx.stroke();
      cx.beginPath(); cx.moveTo(0, i*CELL); cx.lineTo(400, i*CELL); cx.stroke();
    }
    cx.fillStyle = '#f44';
    cx.fillRect(food.x*CELL+4, food.y*CELL+4, CELL-8, CELL-8);
    for (var i = 0; i < body.length; i++) {
      var s = body[i];
      cx.fillStyle = (i === 0) ? '#4af' : '#28f';
      if (dead) cx.fillStyle = '#844';
      cx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
    }
    if (dead) {
      cx.fillStyle = '#fff';
      cx.font = '18px SimSun';
      cx.textAlign = 'center';
      cx.fillText('游戏结束，得分 ' + score, 200, 190);
      cx.fillText('点重新开始', 200, 218);
    }
  }

  function loop(now) {
    if (!snake.running) { snake.raf = null; return; }

    if (now - lastTick >= tickMs) {
      lastTick = now;
      dir = nextDir;
      var head = { x: body[0].x + dir.x, y: body[0].y + dir.y };
      var died = false;
      if (head.x < 0 || head.x >= G || head.y < 0 || head.y >= G) died = true;
      if (!died) {
        for (var i = 0; i < body.length; i++) {
          if (body[i].x === head.x && body[i].y === head.y) { died = true; break; }
        }
      }
      if (died) {
        dead = true;
        snake.running = false;
        Sound.snakeDie();
        draw();
        if (score > best) {
          best = score;
          try { localStorage.setItem('snake_best', String(best)); } catch(e) {}
          document.getElementById('sBest').textContent = best;
        }
        snake.raf = null;
        return;
      }
      body.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        document.getElementById('sScore').textContent = score;
        if (tickMs > 80) tickMs -= 4;
        Sound.snakeEat();
        spawnFood();
      } else {
        body.pop();
      }
    }
    draw();
    snake.raf = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', function(e) {
    if (!snake.running) return;
    var k = e.key;
    if (k === 'ArrowUp' || k === 'w') { sDir(0,-1); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's') { sDir(0,1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'a') { sDir(-1,0); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd') { sDir(1,0); e.preventDefault(); }
  });

  var sx = 0, sy = 0;
  cv.addEventListener('touchstart', function(e) {
    if (e.touches[0]) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', function(e) {
    if (!snake.running) return;
    if (e.touches[0]) {
      var dx = e.touches[0].clientX - sx;
      var dy = e.touches[0].clientY - sy;
      if (Math.abs(dx) > 22 || Math.abs(dy) > 22) {
        if (Math.abs(dx) > Math.abs(dy)) sDir(dx > 0 ? 1 : -1, 0);
        else sDir(0, dy > 0 ? 1 : -1);
        sx = e.touches[0].clientX;
        sy = e.touches[0].clientY;
      }
    }
    e.preventDefault();
  }, {passive:false});
})();

// ============================================
// 打砖块
// ============================================
var br = { running: false, raf: null };
(function() {
  var cv = document.getElementById('brC');
  var cx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var paddle, ball, bricks, score, lives, keys = {};

  window.bStop = function() {
    br.running = false;
    if (br.raf) { cancelAnimationFrame(br.raf); br.raf = null; }
  };

  window.bReset = function() {
    bStop();
    paddle = { w: 100, h: 16, x: W/2 - 50, y: H - 50 };
    ball = { x: W/2, y: H - 80, vx: 3.2, vy: -3.2, r: 8 };
    bricks = [];
    var cols = 8, rows = 5;
    var bw = (W - 40) / cols, bh = 24, gap = 4;
    var colors = ['#c33','#c93','#3c3','#36c','#93c'];
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        bricks.push({
          x: 20 + c * bw,
          y: 60 + r * (bh + gap),
          w: bw - gap, h: bh,
          color: colors[r % colors.length],
          alive: true,
          hp: (r === 0) ? 2 : 1
        });
      }
    }
    score = 0; lives = 3;
    document.getElementById('bScore').textContent = '0';
    document.getElementById('bLives').textContent = '3';
    br.running = true;
    br.raf = requestAnimationFrame(loop);
  };

  function setPaddleX(clientX) {
    var rect = cv.getBoundingClientRect();
    var scale = W / rect.width;
    paddle.x = (clientX - rect.left) * scale - paddle.w / 2;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x > W - paddle.w) paddle.x = W - paddle.w;
  }

  cv.addEventListener('mousemove', function(e) { setPaddleX(e.clientX); });
  cv.addEventListener('mousedown', function(e) { setPaddleX(e.clientX); });
  cv.addEventListener('touchstart', function(e) {
    if (e.touches[0]) setPaddleX(e.touches[0].clientX);
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', function(e) {
    if (e.touches[0]) setPaddleX(e.touches[0].clientX);
    e.preventDefault();
  }, {passive:false});

  document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
  });
  document.addEventListener('keyup', function(e) { keys[e.key] = false; });

  function draw() {
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, W, H);
    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      cx.fillStyle = b.color;
      cx.fillRect(b.x, b.y, b.w, b.h);
      if (b.hp > 1) {
        cx.strokeStyle = '#fff';
        cx.strokeRect(b.x + 0.5, b.y + 0.5, b.w - 1, b.h - 1);
      }
    }
    cx.fillStyle = '#4af';
    cx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
    cx.fillStyle = '#ff0';
    cx.beginPath();
    cx.arc(ball.x, ball.y, ball.r, 0, 6.283);
    cx.fill();
    if (!br.running) {
      cx.fillStyle = '#fff';
      cx.font = '22px SimSun';
      cx.textAlign = 'center';
      cx.fillText('游戏结束，得分 ' + score, W/2, H/2);
      cx.font = '14px SimSun';
      cx.fillText('点重新开始', W/2, H/2 + 30);
    }
  }

  function update() {
    var speed = 8;
    if (keys['ArrowLeft'] || keys['a']) paddle.x -= speed;
    if (keys['ArrowRight'] || keys['d']) paddle.x += speed;
    if (paddle.x < 0) paddle.x = 0;
    if (paddle.x > W - paddle.w) paddle.x = W - paddle.w;

    ball.x += ball.vx;
    ball.y += ball.vy;

    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); Sound.wallHit(); }
    if (ball.x + ball.r > W) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); Sound.wallHit(); }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); Sound.wallHit(); }

    if (ball.vy > 0 &&
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x && ball.x <= paddle.x + paddle.w) {
      ball.y = paddle.y - ball.r;
      var hit = (ball.x - (paddle.x + paddle.w/2)) / (paddle.w/2);
      var angle = hit * 1.05;
      var sp = Math.sqrt(ball.vx*ball.vx + ball.vy*ball.vy);
      if (sp < 6) sp = 6;
      ball.vx = sp * Math.sin(angle);
      ball.vy = -sp * Math.cos(angle);
      Sound.paddleHit();
    }

    for (var i = 0; i < bricks.length; i++) {
      var b = bricks[i];
      if (!b.alive) continue;
      if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w &&
          ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
        var ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        var oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
        b.hp--;
        if (b.hp <= 0) {
          b.alive = false;
          score += 10;
          document.getElementById('bScore').textContent = score;
          Sound.brickBreak();
        } else {
          Sound.brickHit();
        }
        break;
      }
    }

    if (ball.y - ball.r > H) {
      lives--;
      document.getElementById('bLives').textContent = lives;
      if (lives <= 0) {
        br.running = false;
        Sound.loseLife();
      } else {
        Sound.loseLife();
        ball.x = W/2;
        ball.y = H - 80;
        ball.vx = (Math.random() < 0.5 ? -1 : 1) * 3.2;
        ball.vy = -3.2;
        paddle.x = W/2 - paddle.w/2;
      }
    }

    var any = false;
    for (var i = 0; i < bricks.length; i++) if (bricks[i].alive) { any = true; break; }
    if (!any && br.running) {
      br.running = false;
      Sound.win();
    }
  }

  function loop() {
    if (!br.running) {
      draw();
      br.raf = null;
      return;
    }
    update();
    draw();
    if (br.running) br.raf = requestAnimationFrame(loop);
    else {
      draw();
      br.raf = null;
    }
  }
})();

// ============================================
// 星际守卫
// ============================================
var sp = { running: false, raf: null };
(function() {
  var cv = document.getElementById('spC');
  var cx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var player, bullets, enemies, particles, stars;
  var keys = {}, pointerX = null, pointerActive = false;
  var score, lives, fireTimer, spawnTimer, lastT;

  window.spStop = function() {
    sp.running = false;
    if (sp.raf) { cancelAnimationFrame(sp.raf); sp.raf = null; }
  };

  window.spReset = function() {
    spStop();
    player = { x: W/2, y: H - 80, r: 16, speed: 360 };
    bullets = [];
    enemies = [];
    particles = [];
    stars = [];
    for (var i = 0; i < 60; i++) {
      stars.push({ x: Math.random()*W, y: Math.random()*H, z: Math.random()*2 + 0.5 });
    }
    score = 0; lives = 3;
    fireTimer = 0; spawnTimer = 0;
    lastT = performance.now();
    document.getElementById('spScore').textContent = '0';
    document.getElementById('spLives').textContent = '3';
    sp.running = true;
    sp.raf = requestAnimationFrame(loop);
  };

  function setPointer(clientX) {
    var rect = cv.getBoundingClientRect();
    var scale = W / rect.width;
    pointerX = (clientX - rect.left) * scale;
  }

  cv.addEventListener('mousedown', function(e) { pointerActive = true; setPointer(e.clientX); });
  cv.addEventListener('mousemove', function(e) { if (pointerActive) setPointer(e.clientX); });
  document.addEventListener('mouseup', function() { pointerActive = false; });

  cv.addEventListener('touchstart', function(e) {
    pointerActive = true;
    if (e.touches[0]) setPointer(e.touches[0].clientX);
    e.preventDefault();
  }, {passive:false});
  cv.addEventListener('touchmove', function(e) {
    if (e.touches[0]) setPointer(e.touches[0].clientX);
    e.preventDefault();
  }, {passive:false});
  document.addEventListener('touchend', function() { pointerActive = false; });

  document.addEventListener('keydown', function(e) {
    keys[e.key] = true;
    if (['ArrowLeft','ArrowRight'].indexOf(e.key) !== -1) e.preventDefault();
  });
  document.addEventListener('keyup', function(e) { keys[e.key] = false; });

  function fire() {
    var y = player.y - player.r;
    bullets.push({ x: player.x - 10, y: y, vy: -560 });
    bullets.push({ x: player.x + 10, y: y, vy: -560 });
    Sound.shoot();
  }

  function spawnEnemy() {
    var r = 14 + Math.random() * 14;
    enemies.push({
      x: 30 + Math.random() * (W - 60),
      y: -30,
      r: r,
      vy: 80 + score * 0.35 + Math.random() * 40,
      vx: (Math.random() - 0.5) * 50,
      hp: r > 22 ? 2 : 1,
      points: Math.round(r)
    });
  }

  function explode(x, y, color, n) {
    for (var i = 0; i < n; i++) {
      var a = Math.random() * 6.283;
      var s2 = 40 + Math.random() * 200;
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * s2,
        vy: Math.sin(a) * s2,
        life: 0.5 + Math.random() * 0.4,
        maxLife: 0.9,
        color: color,
        size: 2 + Math.random() * 2
      });
    }
  }

  function update(dt) {
    for (var i = 0; i < stars.length; i++) {
      stars[i].y += (30 + stars[i].z * 50) * dt;
      if (stars[i].y > H) { stars[i].y = -2; stars[i].x = Math.random() * W; }
    }
    if (!sp.running) return;

    var dir = 0;
    if (keys['ArrowLeft'] || keys['a']) dir -= 1;
    if (keys['ArrowRight'] || keys['d']) dir += 1;
    if (dir !== 0) {
      player.x += dir * player.speed * dt;
    } else if (pointerActive && pointerX !== null) {
      player.x += (pointerX - player.x) * Math.min(1, dt * 16);
    }
    if (player.x < player.r + 4) player.x = player.r + 4;
    if (player.x > W - player.r - 4) player.x = W - player.r - 4;

    fireTimer -= dt;
    if (fireTimer <= 0) { fire(); fireTimer = 0.16; }

    for (var i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y += bullets[i].vy * dt;
      if (bullets[i].y < -20) { bullets.splice(i, 1); continue; }
      var hit = false;
      for (var j = enemies.length - 1; j >= 0; j--) {
        var e = enemies[j];
        var dx = bullets[i].x - e.x, dy = bullets[i].y - e.y;
        if (dx*dx + dy*dy < (e.r + 4) * (e.r + 4)) {
          e.hp--;
          hit = true;
          explode(bullets[i].x, bullets[i].y, '#ff0', 4);
          if (e.hp <= 0) {
            score += e.points;
            document.getElementById('spScore').textContent = score;
            explode(e.x, e.y, '#f44', 14);
            Sound.explode();
            enemies.splice(j, 1);
          } else {
            Sound.hitEnemy();
          }
          break;
        }
      }
      if (hit) bullets.splice(i, 1);
    }

    for (var i = enemies.length - 1; i >= 0; i--) {
      var e = enemies[i];
      e.y += e.vy * dt;
      e.x += e.vx * dt;
      if (e.y > H + 60) { enemies.splice(i, 1); continue; }
      var dx = e.x - player.x, dy = e.y - player.y;
      var rr = e.r + player.r * 0.75;
      if (dx*dx + dy*dy < rr*rr) {
        lives--;
        document.getElementById('spLives').textContent = lives;
        explode(player.x, player.y, '#4af', 24);
        Sound.playerHit();
        enemies.splice(i, 1);
        if (lives <= 0) sp.running = false;
      }
    }

    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      spawnEnemy();
      spawnTimer = Math.max(0.35, 1.0 - score * 0.001) * (0.7 + Math.random() * 0.6);
    }
  }

  function draw() {
    cx.fillStyle = '#000';
    cx.fillRect(0, 0, W, H);

    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      cx.globalAlpha = 0.3 + s.z * 0.3;
      cx.fillStyle = '#9bf';
      cx.fillRect(s.x, s.y, s.z, s.z * 2);
    }
    cx.globalAlpha = 1;

    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      cx.globalAlpha = Math.max(0, p.life / p.maxLife);
      cx.fillStyle = p.color;
      cx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    cx.globalAlpha = 1;

    for (var i = 0; i < enemies.length; i++) {
      var e = enemies[i];
      cx.fillStyle = '#f44';
      cx.beginPath();
      cx.arc(e.x, e.y, e.r, 0, 6.283);
      cx.fill();
      cx.fillStyle = '#fbb';
      cx.beginPath();
      cx.arc(e.x, e.y, e.r * 0.45, 0, 6.283);
      cx.fill();
    }

    cx.fillStyle = '#ff0';
    for (var i = 0; i < bullets.length; i++) {
      cx.fillRect(bullets[i].x - 2, bullets[i].y - 8, 4, 14);
    }

    if (sp.running) {
      cx.save();
      cx.translate(player.x, player.y);
      var flame = 8 + Math.random() * 8;
      var grd = cx.createLinearGradient(0, 14, 0, 14 + flame);
      grd.addColorStop(0, 'rgba(120,200,255,0.9)');
      grd.addColorStop(1, 'rgba(120,200,255,0)');
      cx.fillStyle = grd;
      cx.beginPath();
      cx.moveTo(-7, 14);
      cx.lineTo(0, 14 + flame);
      cx.lineTo(7, 14);
      cx.closePath();
      cx.fill();
      cx.fillStyle = '#4af';
      cx.beginPath();
      cx.moveTo(0, -20);
      cx.lineTo(14, 14);
      cx.lineTo(0, 7);
      cx.lineTo(-14, 14);
      cx.closePath();
      cx.fill();
      cx.fillStyle = '#bfe3ff';
      cx.beginPath();
      cx.arc(0, -5, 4, 0, 6.283);
      cx.fill();
      cx.restore();
    }

    if (!sp.running) {
      cx.fillStyle = '#fff';
      cx.font = '22px SimSun';
      cx.textAlign = 'center';
      cx.fillText('游戏结束，得分 ' + score, W/2, H/2);
      cx.font = '14px SimSun';
      cx.fillText('点重新开始', W/2, H/2 + 30);
    }
  }

  function loop(now) {
    if (!sp.running) {
      draw();
      sp.raf = null;
      return;
    }
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    update(dt);
    draw();
    sp.raf = requestAnimationFrame(loop);
  }
})();
</script>
</body>
