<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>游戏站</title>
<style>
* { -webkit-tap-highlight-color: transparent; }
html, body { background: #fff; color: #000; font-family: SimSun, "宋体", serif; font-size: 15px; margin: 0; padding: 0; overscroll-behavior: none; }
body { max-width: 100%; margin: 0 auto; padding: 12px 12px 30px; box-sizing: border-box; transition: all 0.3s ease; }
h1 { font-size: 19px; border-bottom: 1px solid #999; padding-bottom: 6px; margin: 6px 0 12px; display: flex; justify-content: space-between; align-items: center; }
h1 a { color: #0000cc; text-decoration: none; font-size: 14px; padding: 4px 8px; }
h1 a:active { color: #ff0000; }
.page { display: none; }
.page.on { display: block; }
a { color: #0000cc; }
a:active { color: #ff0000; }
canvas { background: #000; border: 1px solid #999; touch-action: none; display: block; margin: 8px auto; width: 100%; height: auto; }
.hud { text-align: center; margin: 6px 0; font-size: 15px; }
.center { text-align: center; }
.btn { font-family: inherit; font-size: 16px; padding: 10px 20px; margin: 8px 4px; border: 1px solid #999; background: #eee; cursor: pointer; text-decoration: none; color: #000; display: inline-block; -webkit-user-select: none; user-select: none; min-width: 100px; }
.btn:active { background: #ccc; }
.sound-toggle { font-size: 13px; color: #555; padding: 4px 8px; border: 1px solid #999; background: #f5f5f5; cursor: pointer; margin-left: 8px; }
ul.games { list-style: none; padding: 0; margin: 0; }
ul.games li { border-bottom: 1px dashed #ccc; padding: 14px 4px; }
ul.games a { font-size: 18px; font-weight: bold; text-decoration: none; }
.desc { color: #555; font-size: 13px; margin-top: 6px; line-height: 1.5; }
.pad { display: inline-grid; grid-template-columns: repeat(3, 68px); grid-template-rows: repeat(2, 68px); gap: 8px; margin: 10px auto; user-select: none; -webkit-user-select: none; }
.pad button { font-size: 26px; font-family: inherit; background: #eee; border: 1px solid #999; cursor: pointer; border-radius: 4px; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
.pad button:active { background: #ccc; }
.up { grid-column: 2; grid-row: 1; }
.left { grid-column: 1; grid-row: 2; }
.down { grid-column: 2; grid-row: 2; }
.right { grid-column: 3; grid-row: 2; }
.admin-entry { text-align: center; margin-top: 40px; }
.media-item { border: 1px solid #ddd; padding: 10px; border-radius: 8px; margin-bottom: 15px; background: #fafafa; }
.media-item h3 { font-size: 15px; margin: 0 0 10px 0; }
.media-item img { width: 100%; border-radius: 6px; }
.media-item iframe { width: 100%; height: 250px; border-radius: 6px; }
#media-section { max-width: 800px !important; margin: 30px auto !important; padding: 0 15px; box-sizing: border-box; text-align: center; }
#media-section img { max-width: 100% !important; height: auto !important; display: block; margin: 0 auto 15px auto !important; border-radius: 8px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
</style>
</head>
<body>

<script>
const CUSTOM_GAMES = [
    "game2.html",
    "卡牌.html",
];
window.eliteSpawnRate = 0.45;
window.pendingGame = null;
</script>

<div id="device-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99999; display: none; justify-content: center; align-items: center;">
    <div style="background: #fff; padding: 30px 20px; border-radius: 12px; text-align: center; max-width: 80%;">
        <h2 style="margin-top: 0; color: #333; font-size: 20px;">请选择你的设备</h2>
        <p style="font-size: 13px; color: #888; margin-bottom: 20px;">选择后会自动适配显示比例。</p>
        <div style="display: flex; justify-content: space-around; gap: 15px;">
            <button onclick="selectDevice('pc')" style="padding: 15px 25px; font-size: 16px; cursor: pointer; background: #0056b3; color: white; border: none; border-radius: 6px; flex: 1;">电脑</button>
            <button onclick="selectDevice('mobile')" style="padding: 15px 25px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; flex: 1;">手机</button>
        </div>
    </div>
</div>

<div id="p-home" class="page on">
  <h1>游戏站 <button class="sound-toggle" id="soundBtn" onclick="toggleSound()">音效开</button></h1>
  <ul class="games">
    <li><a href="#" onclick="go('snake');return false;">贪吃蛇</a><div class="desc">滑动屏幕或点方向键控制，撞墙或撞自己结束。</div></li>
    <li><a href="#" onclick="go('breakout');return false;">打砖块</a><div class="desc">手指拖动底部挡板，把球弹回去打光砖块。</div></li>
    <li><a href="#" onclick="go('space');return false;">星际守卫</a><div class="desc">全屏拖动飞船，自动开火。击杀怪物有几率掉落技能球！加入精英怪！</div></li>
  </ul>
  <div id="custom-games-list" style="margin-top: 10px;"></div>
  <div id="media-section" style="margin-top: 30px;">
    <h2 style="font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">图片与视频区</h2>
    <img src="ab.jpg" alt="图片1" onerror="this.style.display='none'">
    <img src="2.jpg" alt="图片2" onerror="this.style.display='none'">
    <img src="3.jpg" alt="图片3" onerror="this.style.display='none'">
    <div id="media-list"></div>
  </div>
</div>

<div id="p-snake" class="page">
  <h1>贪吃蛇 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="sScore">0</span> 最高：<span id="sBest">0</span></div>
  <canvas id="snakeC" width="400" height="400"></canvas>
  <div class="center">
    <div class="pad">
      <button class="up" ontouchstart="sDir(0,-1);event.preventDefault();" onmousedown="sDir(0,-1)">↑</button>
      <button class="left" ontouchstart="sDir(-1,0);event.preventDefault();" onmousedown="sDir(-1,0)">←</button>
      <button class="down" ontouchstart="sDir(0,1);event.preventDefault();" onmousedown="sDir(0,1)">↓</button>
      <button class="right" ontouchstart="sDir(1,0);event.preventDefault();" onmousedown="sDir(1,0)">→</button>
    </div>
  </div>
  <div class="center"><button class="btn" onclick="sReset()">重新开始</button></div>
</div>

<div id="p-breakout" class="page">
  <h1>打砖块 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="bScore">0</span> 生命：<span id="bLives">3</span></div>
  <canvas id="brC" width="480" height="600"></canvas>
  <div class="center"><button class="btn" onclick="bReset()">重新开始</button></div>
</div>

<div id="p-space" class="page">
  <h1>星际守卫 <a href="#" onclick="go('home');return false;">[返回]</a></h1>
  <div class="hud">分数：<span id="spScore">0</span> 生命：<span id="spLives">3</span></div>
  <canvas id="spC" width="400" height="600"></canvas>
  <div class="center"><button class="btn" onclick="spReset()">重新开始</button></div>
</div>

<script>
function go(name) {
  if (name === 'snake' || name === 'breakout' || name === 'space') {
    window.pendingGame = name; 
    document.getElementById('device-modal').style.display = 'flex';
    return;
  }
  switchPage(name);
}
function switchPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('on'); });
  document.getElementById('p-' + name).classList.add('on');
  window.scrollTo(0, 0);
  if (name !== 'snake') sStop(); if (name !== 'breakout') bStop(); if (name !== 'space') spStop();
  if (name === 'snake') sReset(); else if (name === 'breakout') bReset(); else if (name === 'space') spReset();
}

function selectDevice(type) {
    document.getElementById('device-modal').style.display = 'none';
    applyDeviceStyle(type);
    if (window.pendingGame) { switchPage(window.pendingGame); window.pendingGame = null; }
}
function applyDeviceStyle(type) {
    var canvases = document.querySelectorAll('canvas');
    if (type === 'pc') {
        document.body.style.maxWidth = '100%'; document.body.style.padding = '20px 40px';
        canvases.forEach(function(c) { c.style.maxWidth = '100%'; c.style.width = '900px'; c.style.margin = '20px auto'; });
    } else {
        document.body.style.maxWidth = '640px'; document.body.style.padding = '12px 12px 30px';
        canvases.forEach(function(c) { c.style.maxWidth = '480px'; c.style.width = '100%'; c.style.margin = '8px auto'; });
    }
}

const ADMIN_PASSWORD = "123456";
let isAdminLoggedIn = false;
function getCustomMedias() { try { return JSON.parse(localStorage.getItem('custom_medias') || '[]'); } catch(e) { return []; } }
function saveCustomMedias(medias) { localStorage.setItem('custom_medias', JSON.stringify(medias)); renderCustomMedias(); }

function renderCustomGames() {
    const listEl = document.getElementById('custom-games-list');
    if (!listEl) return;
    if (CUSTOM_GAMES.length === 0) { listEl.innerHTML = ''; return; }
    let html = '<h2 style="font-size: 18px; border-bottom: 1px solid #ccc; padding-bottom: 5px; margin-top:20px;">我的新游戏</h2><ul class="games">';
    CUSTOM_GAMES.forEach(function(name) {
        let displayName = name.replace('.html', ''); 
        html += `<li><a href="#" onclick="playCustomGame('${name}');return false;">${displayName}</a></li>`;
    });
    html += '</ul>';
    listEl.innerHTML = html;
}

function renderCustomMedias() {
    const listEl = document.getElementById('media-list');
    if (!listEl) return;
    let medias = getCustomMedias();
    if (medias.length === 0) { return; }
    let html = '';
    medias.forEach(function(item, index) {
        html += `<div class="media-item"><h3>${item.name}</h3>`;
        if (item.type === 'video') { html += `<iframe src="${item.url}" scrolling="no" border="0" frameborder="no" allowfullscreen="true"></iframe>`; } 
        else { html += `<img src="${item.url}" onerror="this.src='https://via.placeholder.com/600x300?text=Error';">`; }
        html += `<button onclick="deleteMedia(${index})" style="margin-top:10px; padding: 4px 8px; background: #d9534f; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 12px;">删除</button></div>`;
    });
    listEl.innerHTML = html;
}

function playCustomGame(name) {
    const iframe = document.createElement('iframe');
    iframe.style.cssText = 'position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 9999; background: white;';
    iframe.src = 'https://ty696.github.io/123/' + name; 
    const closeBtn = document.createElement('button');
    closeBtn.textContent = '返回主站';
    closeBtn.style.cssText = 'position: fixed; bottom: 20px; right: 20px; z-index: 10000; padding: 10px 20px; background: #d9534f; color: white; border: none; border-radius: 5px; cursor: pointer;';
    closeBtn.onclick = () => { iframe.remove(); closeBtn.remove(); };
    document.body.appendChild(iframe); document.body.appendChild(closeBtn);
}

function deleteMedia(index) {
    if (!confirm("确定要删除这个媒体吗？")) return;
    let medias = getCustomMedias(); medias.splice(index, 1); saveCustomMedias(medias);
}

let cmdOutput, cmdInput, cmdWindow;
function initTerminal() {
    cmdOutput = document.getElementById('term-output'); cmdInput = document.getElementById('term-input'); cmdWindow = document.getElementById('terminal-window');
    cmdInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { processCommand(this.value.trim()); this.value = ''; } });
    document.getElementById('term-close').onclick = function() { cmdWindow.style.display = 'none'; cmdInput.blur(); };
}
function openTerminal() {
    let pwd = prompt("请输入管理员密码：");
    if (pwd !== ADMIN_PASSWORD) { alert("密码错误！"); return; }
    isAdminLoggedIn = true; cmdWindow.style.display = 'block'; cmdInput.focus();
    cmdOutput.innerHTML = ''; printTerminal("管理员模式已开启，请输入命令：\n");
}
function printTerminal(text) { cmdOutput.innerHTML += text + "<br>"; cmdOutput.scrollTop = cmdOutput.scrollHeight; }

function processCommand(cmd) {
    if (!cmd) return;
    printTerminal("> " + cmd);
    if (cmd.toLowerCase() === 'cls') { cmdOutput.innerHTML = ''; return; }
    if (cmd.toLowerCase() === 'exit') { cmdWindow.style.display = 'none'; return; }
    if (cmd.toLowerCase() === 'help') {
        printTerminal("可用命令:");
        printTerminal("  admin_skill  - 获取全技能(叠加3次，永久保存)");
        printTerminal("  admin_rate <0-100> - 调整精英怪出现概率(%)");
        printTerminal("  addimg <链接> <名称> - 添加图片到媒体区");
        printTerminal("  addvid <链接> <名称> - 添加视频到媒体区");
        printTerminal("  cls          - 清屏");
        printTerminal("  exit         - 退出");
        return;
    }
    if (cmd.toLowerCase() === 'admin_skill') {
        let currentLevel = parseInt(localStorage.getItem('admin_skill_level') || '0');
        if (currentLevel < 3) {
            currentLevel++;
            localStorage.setItem('admin_skill_level', currentLevel);
            printTerminal(`[+] 成功注入技能！当前叠加次数：${currentLevel}/3 (已永久保存)`);
            Sound.win();
            if (window.sp && window.sp.player) { window.sp.player.adminSkillLevel = currentLevel; }
        } else { printTerminal(`[!] 已达最高叠加次数（3次）！`); }
        return;
    }
    if (cmd.toLowerCase().startsWith('admin_rate ')) {
        let rate = parseInt(cmd.substring(11).trim());
        if (!isNaN(rate) && rate >= 0 && rate <= 100) {
            window.eliteSpawnRate = rate / 100;
            printTerminal(`[+] 精英怪生成概率已调整为 ${rate}%`);
        } else { printTerminal(`[!] 请输入 0-100 之间的数字，例如：admin_rate 45`); }
        return;
    }
    if (cmd.toLowerCase().startsWith('addimg ')) {
        let parts = cmd.substring(7).trim().split(' '); let url = parts[0], name = parts.slice(1).join(' ') || '未命名图片';
        let medias = getCustomMedias(); medias.push({ name: name, url: url, type: 'image' }); saveCustomMedias(medias); printTerminal(`[+] 成功添加图片`);
    }
    else if (cmd.toLowerCase().startsWith('addvid ')) {
        let parts = cmd.substring(7).trim().split(' '); let url = parts[0], name = parts.slice(1).join(' ') || '未命名视频';
        let medias = getCustomMedias(); medias.push({ name: name, url: url, type: 'video' }); saveCustomMedias(medias); printTerminal(`[+] 成功添加视频`);
    }
    else { printTerminal(`'${cmd}' 不是内部或外部命令。`); }
}

var Sound = (function() {
  var ctx = null; var enabled = true;
  try { var saved = localStorage.getItem('sound_on'); if (saved === '0') enabled = false; } catch(e) {}
  function init() { if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; } try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) { ctx = null; } }
  function beep(freq, dur, type, vol, sweepTo) {
    if (!enabled || !ctx) return;
    try { var t = ctx.currentTime; var osc = ctx.createOscillator(); var gain = ctx.createGain();
      osc.type = type || 'square'; osc.frequency.setValueAtTime(freq, t);
      if (sweepTo) osc.frequency.exponentialRampToValueAtTime(Math.max(1, sweepTo), t + dur);
      gain.gain.setValueAtTime(vol || 0.05, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain); gain.connect(ctx.destination); osc.start(t); osc.stop(t + dur);
    } catch(e) {}
  }
  function noise(dur, vol, filterFreq) {
    if (!enabled || !ctx) return;
    try { var t = ctx.currentTime; var len = Math.floor(ctx.sampleRate * dur); var buf = ctx.createBuffer(1, len, ctx.sampleRate); var data = buf.getChannelData(0);
      for (var i = 0; i < len; i++) { data[i] = (Math.random() * 2 - 1) * (1 - i / len); }
      var src = ctx.createBufferSource(); src.buffer = buf; var filter = ctx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = filterFreq || 1200; var gain = ctx.createGain();
      gain.gain.setValueAtTime(vol || 0.15, t); gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter); filter.connect(gain); gain.connect(ctx.destination); src.start(t);
    } catch(e) {}
  }
  return {
    init: init, isOn: function() { return enabled; },
    toggle: function() { enabled = !enabled; try { localStorage.setItem('sound_on', enabled ? '1' : '0'); } catch(e) {} if (enabled) { init(); beep(880, 0.08, 'sine', 0.05); } return enabled; },
    snakeEat: function() { beep(880, 0.08, 'square', 0.04, 1200); }, snakeTurn: function() { beep(600, 0.03, 'square', 0.02); }, snakeDie: function() { beep(300, 0.4, 'sawtooth', 0.06, 80); noise(0.3, 0.1, 600); },
    brickHit: function() { beep(700, 0.06, 'square', 0.03, 900); }, paddleHit: function() { beep(400, 0.06, 'square', 0.03, 500); }, wallHit: function() { beep(300, 0.04, 'square', 0.02); }, brickBreak: function() { beep(900, 0.08, 'square', 0.035, 1300); }, loseLife: function() { beep(220, 0.3, 'sawtooth', 0.06, 100); },
    win: function() { beep(660, 0.1, 'sine', 0.05); setTimeout(function() { beep(880, 0.1, 'sine', 0.05); }, 100); setTimeout(function() { beep(1100, 0.15, 'sine', 0.05); }, 200); },
    shoot: function() { beep(1200, 0.03, 'square', 0.015, 800); }, hitEnemy: function() { beep(500, 0.05, 'square', 0.025, 700); }, explode: function() { noise(0.25, 0.12, 1000); beep(200, 0.2, 'sawtooth', 0.04, 80); }, playerHit: function() { noise(0.4, 0.15, 800); beep(150, 0.4, 'sawtooth', 0.06, 60); }
  };
})();

function toggleSound() { Sound.init(); var on = Sound.toggle(); document.getElementById('soundBtn').textContent = on ? '音效开' : '音效关'; }
function initAudioOnce() { Sound.init(); document.removeEventListener('touchstart', initAudioOnce); document.removeEventListener('mousedown', initAudioOnce); document.removeEventListener('click', initAudioOnce); }
document.addEventListener('touchstart', initAudioOnce); document.addEventListener('mousedown', initAudioOnce); document.addEventListener('click', initAudioOnce);
(function() { if (!Sound.isOn()) { document.getElementById('soundBtn').textContent = '音效关'; } })();

var snake = { running: false, raf: null };
(function() {
  var cv = document.getElementById('snakeC'); var cx = cv.getContext('2d'); var G = 20, CELL = 20; var body, dir, nextDir, food, score, tickMs, lastTick, best = 0, dead = false;
  try { best = parseInt(localStorage.getItem('snake_best') || '0', 10) || 0; } catch(e) {}
  document.getElementById('sBest').textContent = best;
  window.sDir = function(dx, dy) { if (!snake.running || dead) return; if (dx === -dir.x && dy === -dir.y) return; if (dx === dir.x && dy === dir.y) return; nextDir = { x: dx, y: dy }; };
  window.sStop = function() { snake.running = false; if (snake.raf) { cancelAnimationFrame(snake.raf); snake.raf = null; } };
  window.sReset = function() {
    sStop(); body = [{x:10,y:10},{x:9,y:10},{x:8,y:10}]; dir = {x:1,y:0}; nextDir = {x:1,y:0}; score = 0; tickMs = 160; lastTick = 0; dead = false; snake.running = true;
    document.getElementById('sScore').textContent = '0'; spawnFood(); snake.raf = requestAnimationFrame(loop);
  };
  function spawnFood() { while (true) { var f = { x: Math.floor(Math.random()*G), y: Math.floor(Math.random()*G) }; var ok = true; for (var i = 0; i < body.length; i++) { if (body[i].x === f.x && body[i].y === f.y) { ok = false; break; } } if (ok) { food = f; return; } } }
  function draw() {
    cx.fillStyle = '#000'; cx.fillRect(0, 0, 400, 400); cx.strokeStyle = '#222';
    for (var i = 1; i < G; i++) { cx.beginPath(); cx.moveTo(i*CELL, 0); cx.lineTo(i*CELL, 400); cx.stroke(); cx.beginPath(); cx.moveTo(0, i*CELL); cx.lineTo(400, i*CELL); cx.stroke(); }
    cx.fillStyle = '#f44'; cx.fillRect(food.x*CELL+4, food.y*CELL+4, CELL-8, CELL-8);
    for (var i = 0; i < body.length; i++) { var s = body[i]; cx.fillStyle = (i === 0) ? '#4af' : '#28f'; if (dead) cx.fillStyle = '#844'; cx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2); }
    if (dead) { cx.fillStyle = '#fff'; cx.font = '18px SimSun'; cx.textAlign = 'center'; cx.fillText('游戏结束，得分 ' + score, 200, 190); cx.fillText('点重新开始', 200, 218); }
  }
  function loop(now) {
    if (!snake.running) { snake.raf = null; return; }
    if (now - lastTick >= tickMs) {
      lastTick = now; dir = nextDir; var head = { x: body[0].x + dir.x, y: body[0].y + dir.y }; var died = false;
      if (head.x < 0 || head.x >= G || head.y < 0 || head.y >= G) died = true;
      if (!died) { for (var i = 0; i < body.length; i++) { if (body[i].x === head.x && body[i].y === head.y) { died = true; break; } } }
      if (died) { dead = true; snake.running = false; Sound.snakeDie(); draw(); if (score > best) { best = score; try { localStorage.setItem('snake_best', String(best)); } catch(e) {} document.getElementById('sBest').textContent = best; } snake.raf = null; return; }
      body.unshift(head);
      if (head.x === food.x && head.y === food.y) { score++; document.getElementById('sScore').textContent = score; if (tickMs > 80) tickMs -= 4; Sound.snakeEat(); spawnFood(); } else { body.pop(); }
    }
    draw(); snake.raf = requestAnimationFrame(loop);
  }
  document.addEventListener('keydown', function(e) { if (!snake.running) return; var k = e.key; if (k === 'ArrowUp' || k === 'w') { sDir(0,-1); e.preventDefault(); } else if (k === 'ArrowDown' || k === 's') { sDir(0,1); e.preventDefault(); } else if (k === 'ArrowLeft' || k === 'a') { sDir(-1,0); e.preventDefault(); } else if (k === 'ArrowRight' || k === 'd') { sDir(1,0); e.preventDefault(); } });
  var sx = 0, sy = 0;
  cv.addEventListener('touchstart', function(e) { if (e.touches[0]) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } e.preventDefault(); }, {passive:false});
  cv.addEventListener('touchmove', function(e) {
    if (!snake.running) return;
